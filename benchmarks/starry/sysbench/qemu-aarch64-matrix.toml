# The sysbench case rootfs boots the distribution init by default, which never
# exposes the interactive `root@starry:` prompt the shell check waits for.
# Select the test shell explicitly, matching the board configs, so
# `shell_check_steps` can inject the measurement script.
cmdline = 'init=/bin/sh HOME=/root USER=root HOSTNAME=starry -- -c "cd /root; export PS1=$USER@$HOSTNAME:~#; exec /bin/sh -i"'
args = [
    "-nographic",
    "-cpu", "cortex-a53",
    "-m", "1024M",
    "-smp", "4",
    "-device", "nvme,serial=sysbench,drive=nvm,max_ioqpairs=64,msix_qsize=65",
    "-drive", "id=nvm,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-device", "virtio-net-pci,netdev=net0",
    "-netdev", "user,id=net0",
]
uefi = false
to_bin = true
timeout = 900
fail_regex = ['(?i)\bpanic(?:ked)?\b', '(?m)^SYSBENCH_HAS_FAILURES\s*$', '(?m)^SYSBENCH_FAILED\b']

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = "sh -eu -c 'work=$(mktemp -d); trap '\"'\"'rm -rf \"$work\"'\"'\"' EXIT; tar -xzf /share/sysbench.tar.gz -C \"$work\"; sh \"$work/run.sh\" matrix' || printf 'SYSBENCH_%s\\n' HAS_FAILURES"
success_regex = ['(?m)^SYSBENCH_DONE\s*$']
