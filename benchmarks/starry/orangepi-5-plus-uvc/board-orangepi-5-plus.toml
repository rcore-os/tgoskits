# Select the test shell on the board rootfs instead of its systemd init,
# which cannot finish booting without kernel uevent netlink support.
cmdline = 'root=/dev/mmcblk0p2 rw console=ttyS2,1500000 earlycon=uart8250,mmio32,0xfeb50000 rootwait rootfstype=ext4 init=/bin/sh HOME=/root USER=root HOSTNAME=starry -- -c "cd /root; export PS1=$USER@$HOSTNAME:~#; exec /bin/sh -i"'
board_type = "OrangePi-5-Plus"
fail_regex = [
  '(?m)^UVC_SESSION_ASSET_FAILED$',
  '(?m)^UVC_FRAME_VALIDATION_FAILED$',
  '(?i)\bpanic(?:ked)?\b',
  '(?m)^uvc-fps: error: .*$',
  '(?m)^uvc-fps: save error: .*$',
  '(?m)^unable to initialize libusb: .*$',
  '(?i)(uvc-fps|sh): .*not found',
]
timeout = 300

[[shell_check_steps]]
shell_prefix = "root@starry:"
success_regex = [
  '(?m)^UVC_ENDPOINT_LIFECYCLE_OK\s*$'
]
