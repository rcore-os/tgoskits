# Select the test shell on the board rootfs instead of its systemd init,
# which cannot finish booting without kernel uevent netlink support.
cmdline = 'root=/dev/mmcblk0p2 rw console=ttyS2,1500000 earlycon=uart8250,mmio32,0xfeb50000 rootwait rootfstype=ext4 init=/bin/sh HOME=/root USER=root HOSTNAME=starry -- -c "cd /root; export PS1=$USER@$HOSTNAME:~#; exec /bin/sh -i"'
board_type = "OrangePi-5-Plus"
dtb_file = "os/StarryOS/configs/board/orangepi-5-plus.dtb"
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)segmentation fault",
  "(?i)Meet (unsupported|unknown) .*target",
  "(?i)failed to check rknpu hardware version",
  "(?m)^uvc-fps: error: .*$",
  "(?m)^uvc-fps: save error: .*$",
  "(?m)^rknn_init fail!.*$",
  "(?m)^read_image fail!.*$",
  "(?m)^inference_yolov8_model fail!.*$",
  "(?m)^UVC_RKNN_VALIDATE_FAIL .*$",
  "(?m)^UVC_RKNN_BENCH_FAILED",
  "(?m)^UVC_RKNN_STREAM_FAILED",
  "(?m)^(uvc_init|uvc_open|uvc_start_streaming|uvc_get_device_list) failed: .*$",
  "(?m)^dlopen libuvc\\.so failed: .*$",
  "(?i)error while loading shared libraries",
  "(?i)(uvc-fps|rknn_yolov8_image|rknn_yolov8_stream|rknn_yolov8_bench|sh): .*not found",
]
timeout = 240

# Use the interactive Starry shell required by the board runner. Without an
# explicit init, the board's Linux rootfs init starts systemd and freezes
# before the benchmark command can be delivered.
cmdline = 'root=/dev/mmcblk0p2 rw console=ttyS2,1500000 earlycon=uart8250,mmio32,0xfeb50000 rootwait rootfstype=ext4 init=/bin/sh HOME=/root USER=root HOSTNAME=starry -- -c "cd /root; export PS1=$USER@$HOSTNAME:~#; exec /bin/sh -i"'

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = '''
<<<<<<< HEAD
echo UVC_RKNN_BENCH_BEGIN && cd /rknn_yolov8_image && export LD_LIBRARY_PATH=/rknn_yolov8_image/lib:/usr/local/lib:/usr/lib/aarch64-linux-gnu:${LD_LIBRARY_PATH:-} && ./rknn_yolov8_bench --validate-list validation/images.txt --expected validation/expected.txt --min-confidence 25 --core-mask all --profile && ./rknn_yolov8_bench --width 160 --height 120 --fps 10 --infer-every 1 --duration-sec 60 --report-interval-sec 5 --min-confidence 25 --core-mask all --profile && echo UVC_RKNN_BENCH_DONE
=======
export UVC_RKNN_MODE=bench
>>>>>>> 8dd1114bb (fix(benchmarks): update StarryOS benchmark scripts and configurations for improved validation and deployment)
'''
# The benchmark workload lives in `init.sh` (selected by `UVC_RKNN_MODE`), so
# this step must not repeat it. `UVC_RKNN_BENCH_PASSED` is the single terminal
# wrapper verdict: `init.sh` prints it only after the fixed three-image
# validation marker and the 60 s camera benchmark both succeeded, and prints
# `UVC_RKNN_BENCH_FAILED` on every failure path. The program's own
# `UVC_RKNN_BENCH_RESULT` and `UVC_RKNN_BENCH_DONE` lines stay in the log as
# benchmark evidence but must not be success conditions: `success_regex` is a
# disjunction, and matching either of them would end the board session before
# the wrapper reached its verdict.
success_regex = [
  "(?m)^UVC_RKNN_BENCH_PASSED\\s*$",
]
