board_type = "OrangePi-5-Plus"
dtb_file = "os/StarryOS/configs/board/orangepi-5-plus.dtb"
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?m)^uvc-fps: error: .*$",
  "(?m)^uvc-fps: save error: .*$",
  "(?m)^rknn_init fail!.*$",
  "(?m)^read_image fail!.*$",
  "(?m)^inference_yolov8_model fail!.*$",
  "(?m)^(uvc_init|uvc_open|uvc_start_streaming|uvc_get_device_list) failed: .*$",
  "(?m)^dlopen libuvc\\.so failed: .*$",
  "(?i)error while loading shared libraries",
  "(?i)(uvc-fps|rknn_yolov8_image|rknn_yolov8_stream|sh): .*not found",
]
timeout = 120

# Run the benchmark from the existing Starry shell instead of the Linux
# rootfs init. The latter starts systemd on this board image and leaves the
# serial shell unavailable for the app runner.
cmdline = 'root=/dev/mmcblk0p2 rw console=ttyS2,1500000 earlycon=uart8250,mmio32,0xfeb50000 rootwait rootfstype=ext4 init=/bin/sh HOME=/root USER=root HOSTNAME=starry -- -c "cd /root; export PS1=$USER@$HOSTNAME:~#; exec /bin/sh -i"'

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = '''
echo UVC_RKNN_STREAM_BEGIN && cd /rknn_yolov8_image && export LD_LIBRARY_PATH=/rknn_yolov8_image/lib:/usr/local/lib:/usr/lib/aarch64-linux-gnu:${LD_LIBRARY_PATH:-} && ./rknn_yolov8_stream --fps 10 --infer-every 8 --duration-sec 30 --max-inferences 3 --log-every 1 --min-confidence 25 --http-port 8080 --http-fps 2 --publish-width 0 --publish-height 0 --jpeg-quality 70 && echo UVC_RKNN_STREAM_DONE
'''
success_regex = [
  "(?m)^UVC_RKNN_STREAM_DONE$",
]
