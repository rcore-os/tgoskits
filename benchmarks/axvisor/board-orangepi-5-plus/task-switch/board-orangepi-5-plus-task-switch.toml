board_type = "OrangePi-5-Plus"
# Historically, the original Rust-Shyper run on this board finished in 3799.7 s:
# 100 rounds of 100,000,000 yields at roughly 35 s per round, plus bring-up. The
# current case measures 30 rounds of 10,000,000 task switches. The harness
# timeout is infrastructure that only bounds the run; it is not a benchmark
# threshold, and 3600 s is retained unchanged.
timeout = 3600
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "Failed to initialize guest VM",
  "VM\\[1\\] run VCpu\\[0\\] get error",
  # The guest prints this and stops before measuring when the GPIO3_C6 pin the
  # benchmark times against cannot be mapped or configured.
  "(?m)^(?:\\[VM 1\\] )?BENCHER_GPIO_FAILED reason=[a-z0-9-]+\\s*$",
  # The guest prints this and stops before `Bencher end` when a PMU/timer round
  # reads or converts to a zero or otherwise invalid value.
  "(?m)^(?:\\[VM 1\\] )?BENCHER_MEASUREMENT_FAILED reason=[a-z0-9-]+(?: round=[0-9]+)?\\s*$",
]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"
# The success evidence is split across two steps because the runner treats the
# `success_regex` entries of one step as alternates, not as conditions that must
# all match. Step one requires the aggregated non-zero measurement summary; a
# boot-only, zero-PMU, or conversion-failed run never prints it. Step two then
# requires the original completion line, so a truncated run cannot pass either.
success_regex = ["(?m)^(?:\\[VM 1\\] )?TASK_SWITCH_SUMMARY rounds=30 samples_per_round=10000000 avg_ns=[1-9][0-9]* avg_cycles=[1-9][0-9]*\\s*$"]

[[shell_check_steps]]
success_regex = ["(?m)^(?:\\[VM 1\\] )?Bencher end\\s*$"]
