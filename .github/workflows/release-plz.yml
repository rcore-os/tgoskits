name: Release-plz

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-plz-${{ github.ref }}
  queue: max

jobs:
  release-plz-release:
    name: Release-plz release
    env:
      RUSTUP_TOOLCHAIN: stable
    if: >-
      github.repository == 'rcore-os/tgoskits' &&
      (github.event_name == 'workflow_dispatch' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Preflight workspace packages
        run: cargo publish --workspace --dry-run --no-verify

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    if: >-
      github.repository == 'rcore-os/tgoskits' &&
      (github.event_name == 'workflow_dispatch' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - *checkout
      - name: Install semver-check system dependencies
        # All-feature rustdoc builds include host tooling that links to libudev.
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libudev-dev

      - name: Install workspace Rust toolchain
        run: |
          toolchain="$(rustup show active-toolchain)"
          # Apply the repository toolchain to temporary registry baseline builds too.
          echo "RUSTUP_TOOLCHAIN=${toolchain%% *}" >> "$GITHUB_ENV"

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
