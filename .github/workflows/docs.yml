name: Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "Cargo.toml"
      - "components/**/Cargo.toml"
      - "components/**/README*.md"
      - "drivers/**/Cargo.toml"
      - "drivers/**/README*.md"
      - "memory/**/Cargo.toml"
      - "memory/**/README*.md"
      - "virtualization/**/Cargo.toml"
      - "virtualization/**/README*.md"
      - "fs/**/Cargo.toml"
      - "fs/**/README*.md"
      - "net/**/Cargo.toml"
      - "net/**/README*.md"
      - "platforms/**/Cargo.toml"
      - "platforms/**/README*.md"
      - "os/**/Cargo.toml"
      - "os/**/README*.md"
      - "apps/**"
      - ".github/workflows/docs.yml"
  # Fallback for nights when the benchmark update job cannot dispatch this workflow.
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      benchmark_run_id:
        description: Benchmarks workflow run containing the current updates.
        required: false
        default: ""
        type: string
      benchmark_revision:
        description: Tested revision for the benchmark updates.
        required: false
        default: ""
        type: string
      benchmark_date:
        description: UTC date for the benchmark updates.
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  queue: max

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: docs/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: docs
        run: yarn install --frozen-lockfile

      - name: Validate catalog discovery
        working-directory: docs
        run: yarn test

      - name: Build Docusaurus site
        working-directory: docs
        run: yarn build

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Download benchmark updates
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.benchmark_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: benchmark-updates
          run-id: ${{ inputs.benchmark_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/benchmark-updates

      - name: Prepare performance dashboard
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          BENCHMARK_RUN_ID: ${{ github.event.inputs.benchmark_run_id || '' }}
          BENCHMARK_REVISION: ${{ github.event.inputs.benchmark_revision || '' }}
          BENCHMARK_DATE: ${{ github.event.inputs.benchmark_date || '' }}
          BENCHMARK_UPDATES: ${{ runner.temp }}/benchmark-updates
        run: |
          python3 scripts/test/ci_perf_pages.py \
            --base-url "${PAGES_BASE_URL}" \
            --output-dir docs/build \
            --updates-dir "${BENCHMARK_UPDATES}" \
            --benchmark-run-id "${BENCHMARK_RUN_ID}" \
            --benchmark-revision "${BENCHMARK_REVISION}" \
            --benchmark-date "${BENCHMARK_DATE}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
