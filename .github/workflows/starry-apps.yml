name: Starry Apps

on:
  schedule:
    # GitHub cron uses UTC. This runs at 02:00 Beijing time (UTC+8).
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      focused:
        description: Run only the six selected failure-reproduction pairs.
        required: false
        default: false
        type: boolean
      focused_cases:
        description: Comma-separated focused case names; empty selects all six.
        required: false
        default: ""
        type: string
      run_clippy_all:
        description: Include the full workspace Clippy audit in this run.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: starry-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Starry Apps
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      matrix: ${{ steps.focused.outputs.matrix || steps.matrix.outputs.starry_apps_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Scheduled checks follow dev; manual checks test the dispatched commit.
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}

      - name: Pin triggering revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Plan check matrix
        id: matrix
        uses: ./.github/actions/ci-plan
        with:
          mode: starry-apps
          repository: ${{ github.repository }}
          repository-owner: ${{ github.repository_owner }}
          event-name: ${{ github.event_name }}
          boolean-inputs: ${{ inputs.run_clippy_all && 'run_clippy_all' || '' }}

      - name: Select focused application matrix
        id: focused
        if: github.event_name == 'workflow_dispatch' && inputs.focused
        env:
          BASE_MATRIX: ${{ steps.matrix.outputs.starry_apps_matrix }}
          FOCUSED_CASES: ${{ inputs.focused_cases }}
        run: |
          set -euo pipefail
          args=(--ci-matrix --base-matrix "$BASE_MATRIX")
          if [[ -n "$FOCUSED_CASES" ]]; then
            IFS=',' read -ra selected <<< "$FOCUSED_CASES"
            for case_name in "${selected[@]}"; do
              args+=(--case "$case_name")
            done
          fi
          matrix=$(python3 scripts/test/starry_apps_focused.py "${args[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo '### Focused Apps: one independent job per selected pair' >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Starry Apps
    needs: [plan]
    uses: ./.github/workflows/reusable-check-matrix.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.revision }}
      matrix_json: ${{ needs.plan.outputs.matrix }}
      fail_fast: false
      save_cache: ${{ github.event_name == 'schedule' }}

  result:
    name: Nightly Result
    if: always()
    needs: [plan, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.revision || github.sha }}
      - name: Report result
        uses: ./.github/actions/ci-result
        with:
          title: Starry Apps Nightly
          revision: ${{ needs.plan.outputs.revision }}
          revision-label: ${{ github.event_name == 'schedule' && 'dev revision' || 'tested revision' }}
          stages: |
            Plan=${{ needs.plan.result }}
            Apps=${{ needs.checks.result }}
          required-stages: |
            Plan
            Apps
