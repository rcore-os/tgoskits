name: Starry Apps

on:
  schedule:
    # GitHub cron uses UTC. This runs at 02:00 Beijing time (UTC+8).
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      run_clippy_all:
        description: Run the full workspace clippy audit before Starry app smoke.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: starry-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Starry Apps
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      matrix: ${{ steps.matrix.outputs.starry_apps_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Pin dev revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Plan check matrix
        id: matrix
        uses: ./.github/actions/ci-plan
        with:
          mode: starry-apps
          repository: ${{ github.repository }}
          repository-owner: ${{ github.repository_owner }}
          event-name: ${{ github.event_name }}
          boolean-inputs: ${{ inputs.run_clippy_all && 'run_clippy_all' || '' }}

  checks:
    name: Starry Apps
    needs: [plan]
    uses: ./.github/workflows/reusable-check-matrix.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.revision }}
      matrix_json: ${{ needs.plan.outputs.matrix }}
      fail_fast: false
      save_cache: ${{ github.event_name == 'schedule' }}

  result:
    name: Nightly Result
    if: always()
    needs: [plan, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.revision || github.sha }}
      - name: Report result
        uses: ./.github/actions/ci-result
        with:
          title: Starry Apps Nightly
          revision: ${{ needs.plan.outputs.revision }}
          revision-label: dev revision
          stages: |
            Plan=${{ needs.plan.result }}
            Apps=${{ needs.checks.result }}
          required-stages: |
            Plan
            Apps
