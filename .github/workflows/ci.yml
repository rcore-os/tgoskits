name: CI

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
      - "**/*.rst"
      - "**/*.adoc"
      - "docs/**"
      - "**/docs/**"
      - "**/doc/**"
  pull_request:
    paths:
      - ".cargo/**"
      - ".github/actions/publish-container/action.yml"
      - ".github/ci/**"
      - ".github/workflows/ci-branch-push.yml"
      - ".github/workflows/container-publish.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/reusable-check-matrix.yml"
      - ".github/workflows/starry-apps.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/**"
      - "bootloader/**"
      - "components/**"
      - "drivers/**"
      - "fs/**"
      - "memory/**"
      - "net/**"
      - "os/**"
      - "platforms/**"
      - "scripts/**"
      - "test-suit/**"
      - "tools/**"
      - "virtualization/**"
      - "xtask/**"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      since_sha:
        description: Base commit for incremental CI checks.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: >-
    ${{
      github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
      && format('ci-{0}-{1}', github.workflow, github.ref)
      || format('ci-{0}-{1}', github.workflow, github.run_id)
    }}
  queue: max

jobs:
  cancel_stale_runs:
    name: Cancel stale CI runs
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel older queued or running runs
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -uo pipefail

          statuses=(queued in_progress waiting requested)

          if [ "$EVENT_NAME" = "pull_request" ]; then
            selector='select(
              .run_number < (env.CURRENT_RUN_NUMBER | tonumber)
              and any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber))
            )'
          else
            selector='select(
              .run_number < (env.CURRENT_RUN_NUMBER | tonumber)
              and .head_branch == env.REF_NAME
              and .event != "pull_request"
              and .event != "pull_request_target"
            )'
          fi

          cancel_run() {
            local run_id="$1"
            local run_number="$2"
            local run_url="$3"

            if gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null; then
              echo "Canceled stale CI run #${run_number}: ${run_url}"
            else
              echo "::warning::Failed to cancel stale CI run #${run_number}: ${run_url}"
            fi
          }

          for status in "${statuses[@]}"; do
            runs="$(
              gh api \
                --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?status=${status}&per_page=100" \
                --jq ".workflow_runs[] | ${selector} | [.id, .run_number, .html_url] | @tsv" 2>api-error.log
            )"
            gh_status=$?

            if [ "$gh_status" -ne 0 ]; then
              while IFS= read -r line; do
                echo "::warning::Failed to query stale CI runs with status '${status}': ${line}"
              done < api-error.log
              rm -f api-error.log
              continue
            fi
            rm -f api-error.log

            while IFS=$'\t' read -r run_id run_number run_url; do
              if [ -n "$run_id" ]; then
                cancel_run "$run_id" "$run_number" "$run_url"
              fi
            done <<< "$runs"
          done

  plan_ci:
    name: Plan CI
    needs: cancel_stale_runs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      since_ref: ${{ steps.since.outputs.since_ref }}
      static_matrix: ${{ steps.matrix.outputs.static_matrix }}
      test_matrix: ${{ steps.matrix.outputs.test_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Validate CI configuration
        run: |
          set -euo pipefail
          python3 scripts/test/check_ci_paths.py
          python3 scripts/test/check_ci_routing.py
          python3 scripts/test/check_workflow_layout.py
          python3 -m unittest scripts/test/test_ci_impact.py scripts/test/test_ci_plan.py

      - name: Resolve incremental base revision
        id: since
        env:
          EVENT_NAME: ${{ github.event_name }}
          SINCE_SHA: ${{ inputs.since_sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail

          is_empty_or_zero_sha() {
            local value="$1"
            [ -z "$value" ] || [ "$value" = "0000000000000000000000000000000000000000" ]
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            since_ref="$PR_BASE_SHA"
            if ! git rev-parse --verify "${since_ref}^{commit}" >/dev/null 2>&1; then
              git fetch --no-tags --depth=1 origin "$since_ref" >/dev/null 2>&1 || true
            fi
          elif [ "$EVENT_NAME" = "push" ] && ! is_empty_or_zero_sha "$PUSH_BEFORE_SHA"; then
            since_ref="$PUSH_BEFORE_SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && ! is_empty_or_zero_sha "$SINCE_SHA"; then
            since_ref="$SINCE_SHA"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            since_ref="$(git rev-parse HEAD~1)"
          else
            git fetch --no-tags --depth=1 origin dev:refs/remotes/origin/dev >/dev/null 2>&1 || true
            since_ref="$(git merge-base HEAD origin/dev 2>/dev/null || git rev-parse HEAD)"
          fi

          echo "since_ref=${since_ref}" >> "$GITHUB_OUTPUT"

      - name: Plan check matrices
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR_HEAD_REPOSITORY_OWNER: >-
            ${{ github.event.pull_request.head.repo.owner.login || '' }}
          SINCE_REF: ${{ steps.since.outputs.since_ref }}
        run: |
          set -euo pipefail
          source_repository_owner="$REPOSITORY_OWNER"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            source_repository_owner="$PR_HEAD_REPOSITORY_OWNER"
          fi
          python3 scripts/test/ci_plan.py \
            --mode main \
            --repository "$GITHUB_REPOSITORY" \
            --repository-owner "$source_repository_owner" \
            --event-name "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --since-ref "$SINCE_REF" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --output-file "$GITHUB_OUTPUT"

  static_checks:
    name: Static
    needs: plan_ci
    uses: ./.github/workflows/reusable-check-matrix.yml
    with:
      matrix_json: ${{ needs.plan_ci.outputs.static_matrix }}
      fail_fast: true
      save_cache: ${{ github.event_name == 'push' }}
      since_ref: ${{ needs.plan_ci.outputs.since_ref }}
    secrets:
      CLAW_API_KEY: ${{ secrets.CLAW_API_KEY }}

  test_checks:
    name: Tests
    needs:
      - plan_ci
      - static_checks
    uses: ./.github/workflows/reusable-check-matrix.yml
    with:
      matrix_json: ${{ needs.plan_ci.outputs.test_matrix }}
      fail_fast: true
      save_cache: ${{ github.event_name == 'push' }}
      since_ref: ${{ needs.plan_ci.outputs.since_ref }}
    secrets:
      CLAW_API_KEY: ${{ secrets.CLAW_API_KEY }}
