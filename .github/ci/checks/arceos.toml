cargo xtask arceos test qemu --arch loongarch64 --test-group loongarch
cargo xtask arceos test qemu --arch loongarch64 \
  --test-group rust --test-case task-scheduler-irq-window
'''

[[check.suite]]
kind = "arceos-qemu"
arch = "loongarch64"

