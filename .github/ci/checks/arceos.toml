schema_version = 3
phase = "test"
group = "ArceOS"
default_runner = "qcs"

[[check]]
id = "test-arceos-x86-64-qemu"
impact_targets = ["arceos:x86_64"]
name = "QEMU x86_64 · Suites"
command = '''
cargo xtask arceos test qemu --arch x86_64 --test-group rust
cargo xtask arceos test qemu --arch x86_64 --test-group c
cargo xtask arceos test qemu --arch x86_64 \
  --test-group rust --test-case task-scheduler-irq-window
'''

[[check.suite]]
kind = "arceos-qemu"
arch = "x86_64"

[[check]]
id = "test-arceos-riscv64-qemu"
impact_targets = ["arceos:riscv64"]
name = "QEMU riscv64 · Suites + task IPI"
command = '''
cargo xtask arceos test qemu --arch riscv64 --test-group rust
cargo xtask arceos test qemu --arch riscv64 --test-group c
cargo xtask arceos test qemu --arch riscv64 \
  --test-group rust --test-case task-scheduler-irq-window
taskset -c 0 cargo xtask arceos test qemu --arch riscv64 \
  --test-group rust --test-case task-ipi
'''

[[check.suite]]
kind = "arceos-qemu"
arch = "riscv64"

[[check]]
id = "test-arceos-aarch64-qemu-app-suites"
impact_targets = ["arceos:aarch64"]
name = "QEMU aarch64 · GICv2 SMP4 boot + suites"
command = '''
echo "==> arceos aarch64 GICv2 SMP4 default app boot"
cargo xtask arceos qemu --arch aarch64 --smp 4 \
  --qemu-config os/arceos/configs/qemu/qemu-aarch64-gicv2-boot.toml
echo "==> arceos aarch64 test suites (Rust GICv2 SMP4 IPI + C GICv3 SMP4)"
cargo xtask arceos test qemu --arch aarch64 --test-group rust
cargo xtask arceos test qemu --arch aarch64 --test-group c
cargo xtask arceos test qemu --arch aarch64 \
  --test-group rust --test-case task-scheduler-irq-window
'''

[[check.suite]]
kind = "arceos-qemu"
arch = "aarch64"

[[check]]
id = "test-arceos-loongarch64-qemu"
impact_targets = ["arceos:loongarch64"]
name = "QEMU loongarch64 · Suites"
