[[check]]
id = "test-axvisor-self-hosted-board-orangepi-5-plus-linux-starry-ivc-benchmark"
impact_targets = ["axvisor:aarch64", "starry:aarch64"]
name = "Board OrangePi 5 Plus · Linux + StarryOS + AXIVC Zephyr-Starry benchmark"
