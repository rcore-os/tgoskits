schema_version = 3
phase = "test"
group = "AxVisor"
default_runner = "qcs"

[[check]]
id = "test-axvisor-aarch64-qemu-smoke-axtest"
impact_targets = ["axvisor:aarch64"]
name = "QEMU aarch64 · General + guest devices + axtest"
# The shared build and the axtest runs are joined by the two-vCPU AxVM runtime
# case, whose QEMU budget alone is 900 s, so the job keeps a wider bound than
# the build-only stages used to need.
timeout_minutes = 45
# The unified QEMU smoke build carries `web-ui`, so axbuild runs npm.
node_version = "24"
command = '''
echo "==> axvisor aarch64 shared general boot (five CI checks)"
cargo xtask axvisor test qemu --arch aarch64 --test-case qemu/aarch64/general
echo "==> axvisor aarch64 virtio-blk ArceOS guest"
timeout 240s apps/arceos/virtio-blk-test/run.sh
echo "==> axvisor aarch64 five virtio-net guest vCPUs on two host CPUs"
timeout 600s apps/arceos/virtio-net-peer/run.sh --vcpus
echo "==> axvisor aarch64 PCI memory test ArceOS guest"
cargo xtask axvisor test qemu --arch aarch64 --test-case qemu/aarch64/pci-memory-test
echo "==> axvisor aarch64 axtest"
cargo xtask ktest qemu -p axvisor --test axtest --arch aarch64 \
  --config os/axvisor/tests/build-memory-root-aarch64.toml \
  --qemu-config os/axvisor/tests/qemu-memory-root-aarch64.toml
echo "==> axvm aarch64 two-vCPU guest runtime axtest"
# The guest and its resources are prepared by the adjacent `guest-builds.toml`
# `host_prepare` entry; the case needs no host root disk.
cargo xtask ktest qemu -p axvm --test vcpu_runtime --arch aarch64 \
  --config virtualization/axvm/tests/vcpu-runtime/build-aarch64-unknown-none-softfloat.toml \
  --qemu-config virtualization/axvm/tests/vcpu-runtime/qemu-aarch64.toml
echo "==> axvm aarch64 provided-DTB CPU map regression"
run_axvm_cross_test() {
  local output
  output="$(cargo xtask cross-test "$@" 2>&1)" || {
    printf '%s\n' "$output"
    return 1
  }
  printf '%s\n' "$output"
  printf '%s\n' "$output" | grep -Eq 'test result: ok\. [1-9][0-9]* passed;' || {
    echo "cross-test filter matched no passing test" >&2
    return 1
  }
}
run_axvm_cross_test --arch aarch64 --package axvm \
  --features axvm/host-test --no-default-features --lib arch::aarch64::fdt
echo "==> axvm aarch64 ECAM automatic MMIO pool boundary regression"
run_axvm_cross_test --arch aarch64 --package axvm \
  --features axvm/host-test --no-default-features --lib arch::aarch64::pci_plan
echo "==> axvm aarch64 cloned CPU identity regression"
run_axvm_cross_test --arch aarch64 --package axvm \
  --features axvm/host-test --no-default-features --lib tree_clones_missing_guest_cpu_nodes_with_fresh_phandles
echo "==> axvm riscv64 cloned CPU identity regression"
run_axvm_cross_test --arch riscv64 --package axvm \
  --features axvm/host-test --no-default-features --lib tree_clones_missing_guest_cpu_nodes_with_fresh_phandles
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "aarch64"
cases = ["qemu/aarch64/general", "qemu/aarch64/pci-memory-test"]

[[check.suite]]
# The two-vCPU runtime case is a ktest execution unit of its own: the AxVM
# `vcpu_runtime` test target owns the guest resources instead of the AxVisor
# `test qemu` case tree, so it registers the package, target, arch and configs
# that `cargo xtask ktest qemu` actually consumes.
kind = "ktest-qemu"
package = "axvm"
test = "vcpu_runtime"
arch = "aarch64"
config = "virtualization/axvm/tests/vcpu-runtime/build-aarch64-unknown-none-softfloat.toml"
qemu_config = "virtualization/axvm/tests/vcpu-runtime/qemu-aarch64.toml"

[[check]]
id = "test-axvisor-web-ui-assets"
impact_targets = ["axvisor:aarch64", "axvisor:x86_64"]
name = "Web UI · Unit tests and bundle"
timeout_minutes = 15
node_version = "24"
command = '''
echo "==> axvisor web UI typecheck, unit tests, and bundle"
(
  cd os/axvisor/web-ui
  npm ci
  npm test
  npm run build
)
'''

[[check]]
id = "test-axvisor-aarch64-qemu-web-ui"
impact_targets = ["axvisor:aarch64"]
name = "QEMU aarch64 · Memory-root web dashboard"
timeout_minutes = 30
node_version = "24"
command = '''
echo "==> axvisor aarch64 web dashboard (axbuild runs npm itself for the bundle)"
cargo xtask axvisor test qemu --arch aarch64 --test-case qemu/aarch64/memory-web
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "aarch64"
cases = ["qemu/aarch64/memory-web"]

[[check]]
id = "test-axvisor-aarch64-qemu-http-control-plane-browser-console-ivc"
impact_targets = ["axvisor:aarch64"]
name = "QEMU aarch64 · HTTP control-plane + browser console + IVC"
timeout_minutes = 30
node_version = "24"
command = '''
echo "==> axvisor aarch64 HTTP control-plane, browser console and source-built IVC peers"
# Keep all cases in one axbuild invocation. The QEMU runner groups cases by
# Cargo identity before building, so equal AxVisor kernels are compiled once
# and their per-case initramfs/runtime inputs are still prepared independently.
# Build ArceOS guests from this checkout rather than using prebuilt binaries.
cargo xtask axvisor test qemu --arch aarch64 \
  --test-case qemu/aarch64/http-control-plane,qemu/aarch64/ivc-local,qemu/aarch64/ivc-arceos
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "aarch64"
cases = [
  "qemu/aarch64/http-control-plane",
  "qemu/aarch64/ivc-local",
  "qemu/aarch64/ivc-arceos",
  # "qemu/aarch64/ivc", # Prebuilt guest images must match the publisher protocol.
]

[[check]]
id = "test-axvisor-riscv64-qemu-smoke-ipi"
impact_targets = ["axvisor:riscv64"]
name = "QEMU riscv64 · Smoke + IPI"
timeout_minutes = 30
# The unified QEMU smoke build carries `web-ui`, so axbuild runs npm.
node_version = "24"
command = '''
echo "==> axvisor riscv64 qemu/riscv64/smoke/shell-and-block"
cargo xtask axvisor test qemu --arch riscv64 --test-case qemu/riscv64/smoke/shell-and-block
echo "==> axvisor riscv64 IPI cross-test"
cargo xtask cross-test --arch riscv64 \
  --package axvm \
  --features axvm/host-test --no-default-features --lib ipi
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "riscv64"
cases = ["qemu/riscv64/smoke/shell-and-block"]

[[check]]
id = "test-axvisor-loongarch64-qemu"
impact_targets = ["axvisor:loongarch64"]
name = "QEMU loongarch64 · Linux, IOCSR and timers"
runner = "ubuntu-axvisor-lvz"
cache_key = ""
download_xtask_bin_artifact = true
# The unified QEMU smoke build carries `web-ui`, so axbuild runs npm.
node_version = "24"
command = '''
echo "==> axvm loongarch64 guest timer ownership"
output="$(target/debug/tg-xtask cross-test --arch loongarch64 --package axvm \
  --features axvm/host-test --no-default-features --lib guest_csr 2>&1)" || {
  printf '%s\n' "$output"
  exit 1
}
printf '%s\n' "$output"
printf '%s\n' "$output" | grep -Eq 'test result: ok\. [1-9][0-9]* passed;' || {
  echo "guest timer filter matched no passing test" >&2
  exit 1
}
echo "==> axvisor loongarch64 Linux guests"
task_capture_bin=$(mktemp -d)
task_capture_state=$(mktemp -d "$PWD/target/ci-qemu-state.XXXXXX")
ln -s "$PWD/scripts/test/qemu_state_capture.py" "$task_capture_bin/qemu-system-loongarch64"
task_status=0
TGOS_QEMU_CAPTURE_REAL="$(command -v qemu-system-loongarch64)" \
TGOS_QEMU_CAPTURE_DIR="$task_capture_state" \
AXBUILD_QEMU_SYSTEM_LOONGARCH64="$task_capture_bin/qemu-system-loongarch64" \
  target/debug/tg-xtask axvisor test qemu --arch loongarch64 || task_status=$?
if [ "$task_status" -ne 0 ]; then
  python3 scripts/test/qemu_state_capture.py --report "$task_capture_state" \
    || printf '%s\n' 'QEMU state report failed' >&2
  rm "$task_capture_bin/qemu-system-loongarch64"
  rmdir "$task_capture_bin"
  exit "$task_status"
fi
rm "$task_capture_bin/qemu-system-loongarch64"
rmdir "$task_capture_bin"
echo "==> axvm loongarch64 IOCSR isolation axtest"
target/debug/tg-xtask ktest qemu --package axvm-kernel-tests --test loongarch_iocsr --arch loongarch64 \
  --config virtualization/test_crates/axvm-kernel-tests/build-loongarch64-unknown-none-softfloat.toml \
  --qemu-config virtualization/test_crates/axvm-kernel-tests/qemu-loongarch64.toml
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "loongarch64"
cases = ["qemu/loongarch64/smoke"]

[[check.suite]]
kind = "ktest-qemu"
package = "axvm-kernel-tests"
test = "loongarch_iocsr"
arch = "loongarch64"
config = "virtualization/test_crates/axvm-kernel-tests/build-loongarch64-unknown-none-softfloat.toml"
qemu_config = "virtualization/test_crates/axvm-kernel-tests/qemu-loongarch64.toml"

