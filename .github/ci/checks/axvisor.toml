arch = "x86_64"
cases = ["smoke-vmx", "direct-acpi-vmx", "mp-fallback-vmx", "ovmf-acpi-vmx", "pci-enumeration-vmx", "pci-block-rw-vmx", "pci-block-ro-vmx"]

[[check]]
id = "test-axloader-http-smoke"
impact_packages = ["axloader"]
name = "UEFI x86_64 · AxLoader HTTP boot"
runner = "kvm-intel"
# Cold runners may spend most of the original 45-minute budget on checkout and builds.
timeout_minutes = 90
command = '''
rustup target add x86_64-unknown-uefi
cargo xtask axloader test qemu --target x86_64-unknown-uefi
'''

[[check]]
id = "test-axvisor-self-hosted-board-orangepi-5-plus-linux-starry"
impact_targets = ["axvisor:aarch64", "starry:aarch64"]
name = "Board OrangePi 5 Plus · Linux + StarryOS"
runner = "board"
resource_group = "orangepi-5-plus"
timeout_minutes = 90
command = '''
echo "==> axvisor OrangePi 5 Plus Linux guest"
AXVISOR_GUEST_ASSETS=/guest cargo xtask axvisor test board --board orangepi-5-plus-linux --test-case smoke
echo "==> build the StarryOS guest from this checkout"
cargo xtask starry build --config test-suit/starryos/board-orangepi-5-plus/build-aarch64-unknown-none-softfloat.toml --smp 1
echo "==> axvisor OrangePi 5 Plus StarryOS guest"
cargo xtask axvisor test board --board orangepi-5-plus-starry
'''

[[check.suite]]
kind = "axvisor-board"
board = "orangepi-5-plus-linux"
cases = ["smoke"]

[[check.suite]]
kind = "axvisor-board"
board = "orangepi-5-plus-starry"

