command = '''
mkdir -p tmp
target/debug/tg-xtask image pull qemu-x86_64 --extract-dir tmp
target/debug/tg-xtask image pull initramfs-x86_64-busybox.cpio.gz --extract-dir tmp
gzip -dc \
  tmp/initramfs-x86_64-busybox.cpio.gz/initramfs-x86_64-busybox.cpio.gz \
  > tmp/initramfs-x86_64-busybox.cpio
target/debug/tg-xtask axvisor test board --board asus-nuc15crh-linux
'''

