echo "==> axvisor x86_64 VMX OVMF ACPI boot"
cargo xtask axvisor test qemu --arch x86_64 --test-case ovmf-acpi-vmx
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "x86_64"
cases = ["direct-acpi-vmx", "mp-fallback-vmx", "ovmf-acpi-vmx"]

