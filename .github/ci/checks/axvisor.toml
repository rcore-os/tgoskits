id = "test-axvisor-x86-64-acpi-direct-and-ovmf-boot-vmx"
impact_targets = ["axvisor:x86_64"]
name = "VMX x86_64 · Direct + MP fallback + OVMF ACPI"
runner = "kvm-intel"
timeout_minutes = 90
