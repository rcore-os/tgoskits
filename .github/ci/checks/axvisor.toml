schema_version = 3
phase = "test"
group = "AxVisor"
default_runner = "qcs"

[[check]]
id = "test-axvisor-aarch64-qemu-smoke-axtest"
impact_targets = ["axvisor:aarch64"]
name = "QEMU aarch64 · Smoke + virtio-blk guest + axtest"
# The shared build and the axtest runs are joined by the two-vCPU AxVM runtime
# case, whose QEMU budget alone is 900 s, so the job keeps a wider bound than
# the build-only stages used to need.
timeout_minutes = 45
# The unified QEMU smoke build carries `web-ui`, so axbuild runs npm.
node_version = "24"
command = '''
echo "==> axvisor aarch64 smoke + host initramfs"
cargo xtask axvisor test qemu --arch aarch64 --test-case smoke,qemu-host-initramfs
echo "==> axvisor aarch64 virtio-blk ArceOS guest"
timeout 240s apps/arceos/virtio-blk-test/run.sh
echo "==> axvisor aarch64 five virtio-net guest vCPUs on two host CPUs"
timeout 600s apps/arceos/virtio-net-peer/run.sh --vcpus
echo "==> axvisor aarch64 axtest"
cargo xtask ktest qemu -p axvisor --test axtest --arch aarch64 \
  --config os/axvisor/tests/build-memory-root-aarch64.toml \
  --qemu-config os/axvisor/tests/qemu-memory-root-aarch64.toml
echo "==> axvm aarch64 two-vCPU guest runtime axtest"
# The guest and its resources are prepared by the adjacent `guest-builds.toml`
# `host_prepare` entry; the case needs no host root disk.
cargo xtask ktest qemu -p axvm --test vcpu_runtime --arch aarch64 \
  --config virtualization/axvm/tests/vcpu-runtime/build-aarch64-unknown-none-softfloat.toml \
  --qemu-config virtualization/axvm/tests/vcpu-runtime/qemu-aarch64.toml
echo "==> axvm aarch64 provided-DTB CPU map regression"
run_axvm_cross_test() {
  local output
  output="$(cargo xtask cross-test "$@" 2>&1)" || {
    printf '%s\n' "$output"
    return 1
  }
  printf '%s\n' "$output"
  printf '%s\n' "$output" | grep -Eq 'test result: ok\. [1-9][0-9]* passed;' || {
    echo "cross-test filter matched no passing test" >&2
    return 1
  }
}
run_axvm_cross_test --arch aarch64 --package axvm \
  --features axvm/host-test --no-default-features --lib arch::aarch64::fdt
echo "==> axvm aarch64 cloned CPU identity regression"
run_axvm_cross_test --arch aarch64 --package axvm \
  --features axvm/host-test --no-default-features --lib tree_clones_missing_guest_cpu_nodes_with_fresh_phandles
echo "==> axvm riscv64 cloned CPU identity regression"
run_axvm_cross_test --arch riscv64 --package axvm \
  --features axvm/host-test --no-default-features --lib tree_clones_missing_guest_cpu_nodes_with_fresh_phandles
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "aarch64"
cases = ["smoke", "qemu-host-initramfs"]

[[check.suite]]
# The two-vCPU runtime case is a ktest execution unit of its own: the AxVM
# `vcpu_runtime` test target owns the guest resources instead of the AxVisor
# `test qemu` case tree, so it registers the package, target, arch and configs
# that `cargo xtask ktest qemu` actually consumes.
kind = "ktest-qemu"
package = "axvm"
test = "vcpu_runtime"
arch = "aarch64"
config = "virtualization/axvm/tests/vcpu-runtime/build-aarch64-unknown-none-softfloat.toml"
qemu_config = "virtualization/axvm/tests/vcpu-runtime/qemu-aarch64.toml"

[[check]]
id = "test-axvisor-web-ui-assets"
impact_targets = ["axvisor:aarch64"]
name = "Web UI · Unit tests and bundle"
timeout_minutes = 15
node_version = "24"
command = '''
echo "==> axvisor web UI typecheck, unit tests, and bundle"
(
  cd os/axvisor/web-ui
  npm ci
  npm test
  npm run build
)
'''

[[check]]
id = "test-axvisor-aarch64-qemu-web-ui"
impact_targets = ["axvisor:aarch64"]
name = "QEMU aarch64 · Web dashboard from the disk root and the initramfs root"
timeout_minutes = 30
node_version = "24"
command = '''
echo "==> axvisor aarch64 web dashboard (axbuild runs npm itself for the bundle)"
cargo xtask axvisor test qemu --arch aarch64 --test-case web-ui,web-ui-diskless
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "aarch64"
cases = ["web-ui", "web-ui-diskless"]

[[check]]
id = "test-axvisor-aarch64-qemu-http-control-plane-browser-console-ivc"
impact_targets = ["axvisor:aarch64"]
name = "QEMU aarch64 · HTTP control-plane + VM pool + browser console + ArceOS IVC"
timeout_minutes = 30
node_version = "24"
command = '''
echo "==> axvisor aarch64 HTTP control-plane, VM pool, browser console and ArceOS IVC"
# Keep all cases in one axbuild invocation. The QEMU runner groups cases by
# Cargo identity before building, so equal AxVisor kernels are compiled once
# and their per-case initramfs/runtime inputs are still prepared independently.
cargo xtask axvisor test qemu --arch aarch64 --test-group normal \
  --test-case http-control-plane,qemu-vm-pool,qemu-vm-pool-http,browser-console,qemu-ivc-arceos
# Disabled until the Linux IVC guest image matches the v2 publisher protocol.
# echo "==> axvisor aarch64 IVC"
# cargo xtask axvisor test qemu --arch aarch64 --test-group normal --test-case qemu-ivc
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "aarch64"
cases = [
  "http-control-plane",
  "qemu-vm-pool",
  "qemu-vm-pool-http",
  "browser-console",
  "qemu-ivc-arceos",
  # "qemu-ivc", # Linux guest image uses IVC v3; ArceOS publisher uses v2.
]

[[check]]
id = "test-axvisor-riscv64-qemu-smoke-ipi"
impact_targets = ["axvisor:riscv64"]
name = "QEMU riscv64 · Smoke + IPI"
timeout_minutes = 30
# The unified QEMU smoke build carries `web-ui`, so axbuild runs npm.
node_version = "24"
command = '''
echo "==> axvisor riscv64 smoke"
cargo xtask axvisor test qemu --arch riscv64 --test-case smoke
echo "==> axvisor riscv64 IPI cross-test"
cargo xtask cross-test --arch riscv64 \
  --package axvm \
  --features axvm/host-test --no-default-features --lib ipi
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "riscv64"
cases = ["smoke"]

