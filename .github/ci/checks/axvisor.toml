schema_version = 3
phase = "test"
group = "AxVisor"
default_runner = "qcs"

[[check]]
id = "test-axvisor-aarch64-qemu-smoke-axtest-timer-stress"
impact_targets = ["axvisor:aarch64"]
name = "QEMU aarch64 · Smoke + virtio-blk/ivshmem guests + axtest + timer stress"
timeout_minutes = 30
command = '''
echo "==> axvisor aarch64 smoke"
cargo xtask axvisor test qemu --arch aarch64 --test-case smoke
echo "==> axvisor aarch64 virtio-blk ArceOS guest"
timeout 240s apps/arceos/virtio-blk-test/run.sh
echo "==> axvisor aarch64 ivshmem-pci ArceOS guest"
cargo xtask axvisor test qemu --arch aarch64 --test-group normal --test-case ivshmem-pci
echo "==> axvisor aarch64 axtest"
cargo xtask ktest qemu -p axvisor --test axtest --arch aarch64
echo "==> pull qemu-aarch64 image"
cargo xtask image pull qemu-aarch64 --extract-dir tmp/axbuild/images
echo "==> axvisor aarch64 gicv2 timer stress"
cargo xtask axvisor test qemu --arch aarch64 --test-case gicv2-timer-stress
echo "==> axvisor aarch64 gicv3 timer stress"
cargo xtask axvisor test qemu --arch aarch64 --test-case gicv3-timer-stress
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "aarch64"
cases = ["smoke", "ivshmem-pci", "gicv2-timer-stress", "gicv3-timer-stress"]

[[check]]
id = "test-axvisor-aarch64-qemu-panic-modes"
impact_targets = ["axvisor:aarch64"]
name = "QEMU aarch64 · Panic modes"
timeout_minutes = 30
command = '''
echo "==> axvisor aarch64 backtrace panic"
cargo xtask axvisor test qemu --arch aarch64 --test-case backtrace-panic
echo "==> axvisor aarch64 no-backtrace panic"
cargo xtask axvisor test qemu --arch aarch64 --test-case no-backtrace
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "aarch64"
cases = ["backtrace-panic", "no-backtrace"]

[[check]]
id = "test-axvisor-aarch64-qemu-http-control-plane"
impact_targets = ["axvisor:aarch64"]
name = "QEMU aarch64 · HTTP control-plane"
timeout_minutes = 30
command = '''
echo "==> pull qemu-aarch64 image"
cargo xtask image pull qemu-aarch64 --extract-dir tmp/axbuild/images
echo "==> axvisor aarch64 HTTP control-plane (incl. pause/resume)"
cargo xtask axvisor test qemu --arch aarch64 --test-case http-control-plane
echo "==> axvisor aarch64 browser console"
cargo xtask axvisor test qemu --arch aarch64 --test-case browser-console
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "aarch64"
cases = ["http-control-plane", "browser-console"]

[[check]]
id = "test-axvisor-riscv64-qemu-smoke-panic-modes"
impact_targets = ["axvisor:riscv64"]
name = "QEMU riscv64 · Smoke + IPI + panic modes"
timeout_minutes = 30
command = '''
echo "==> axvisor riscv64 smoke"
cargo xtask axvisor test qemu --arch riscv64 --test-case smoke
echo "==> axvisor riscv64 IPI cross-test"
cargo xtask cross-test --arch riscv64 \
  --package riscv_vcpu --package axvm \
  --features axvm/host-test --no-default-features --lib ipi
echo "==> axvisor riscv64 VSEIP unbound-state cross-test"
cargo xtask cross-test --arch riscv64 --package riscv_vcpu --lib \
  controller_vseip_line_updates_saved_state_while_unbound
echo "==> axvisor riscv64 backtrace panic"
cargo xtask axvisor test qemu --arch riscv64 --test-case backtrace-panic
echo "==> axvisor riscv64 no-backtrace panic"
cargo xtask axvisor test qemu --arch riscv64 --test-case no-backtrace
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "riscv64"
cases = ["smoke", "backtrace-panic", "no-backtrace"]

[[check]]
id = "test-axvisor-loongarch64-qemu"
impact_targets = ["axvisor:loongarch64"]
name = "QEMU loongarch64 · Suites"
runner = "ubuntu-axvisor-lvz"
cache_key = "test-axvisor-loongarch64"
download_xtask_bin_artifact = true
command = '''
target/debug/tg-xtask axvisor test qemu --arch loongarch64
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "loongarch64"
cases = ["smoke"]

[[check]]
id = "test-axvisor-qemu-ivc"
impact_targets = ["axvisor:aarch64"]
name = "QEMU aarch64 · IVC"
timeout_minutes = 30
command = '''
echo "==> pull IVC Message V1 image"
export TGOS_IMAGE_DOWNLOAD_DIR="$PWD/tmp/ivc-images"
export TGOS_IMAGE_EXTRACT_DIR="$PWD/tmp/axbuild/rootfs"
cargo xtask image pull \
  --registry "https://raw.githubusercontent.com/baitwo02/tgosimages/4ae69e079f0d2a39b2f5d1b210cc093ffc5bad07/registry/ivc-message-v1-3ce6ae8a.toml" \
  "rootfs-aarch64-alpine-ivc-message-v1.img:0.0.12-ivc-message-v1-3ce6ae8a"
echo "==> axvisor aarch64 IVC"
cargo xtask axvisor test qemu --arch aarch64 --test-group normal --test-case qemu-ivc
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "aarch64"
cases = ["qemu-ivc"]

[[check]]
