[[check]]
id = "test-axvisor-self-hosted-board-orangepi-5-plus-linux-starry"
impact_targets = ["axvisor:aarch64", "starry:aarch64"]
name = "Board OrangePi 5 Plus · Linux + StarryOS"
runner = "board"
timeout_minutes = 90
command = '''
echo "==> axvisor OrangePi 5 Plus Linux guest"
cargo xtask axvisor test board --board orangepi-5-plus-linux --test-case smoke
echo "==> build the StarryOS guest from this checkout"
cargo xtask starry build --config test-suit/starryos/board-orangepi-5-plus/build-aarch64-unknown-none-softfloat.toml --smp 1
echo "==> axvisor OrangePi 5 Plus StarryOS guest"
cargo xtask axvisor test board --board orangepi-5-plus-starry
'''

[[check.suite]]
kind = "axvisor-board"
board = "orangepi-5-plus-linux"
cases = ["smoke"]

[[check.suite]]
kind = "axvisor-board"
board = "orangepi-5-plus-starry"

