[[check]]
id = "test-axvisor-self-hosted-board-asus-nuc15crh-linux"
impact_targets = ["axvisor:x86_64"]
name = "Board ASUS NUC15CRH · Linux guest"
runner = "board"
timeout_minutes = 45
download_xtask_bin_artifact = true
command = '''
TARGET_DIR="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
STAGING_DIR="$TARGET_DIR/axbuild/board-assets/asus-nuc15crh-linux"
mkdir -p "$STAGING_DIR"
target/debug/tg-xtask image pull qemu-x86_64 --extract-dir "$STAGING_DIR"
target/debug/tg-xtask image pull initramfs-x86_64-busybox.cpio.gz --extract-dir "$STAGING_DIR"
target/debug/tg-xtask axvisor test board --board asus-nuc15crh-linux
'''

[[check.suite]]
kind = "axvisor-board"
board = "asus-nuc15crh-linux"

