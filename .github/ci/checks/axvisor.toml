[[check]]
id = "test-axloader-http-smoke"
impact_packages = ["axloader", "someboot"]
impact_targets = ["arceos:x86_64", "starry:x86_64", "axvisor:x86_64"]
name = "UEFI x86_64 · AxLoader 3OS HTTP boot"
runner = "kvm-intel"
cache_key = ""
# Cold runners may spend most of the original 45-minute budget on checkout and builds.
timeout_minutes = 90
command = '''
rustup target add x86_64-unknown-uefi
cargo xtask axloader test qemu --target x86_64-unknown-uefi
'''

[[check]]
id = "test-axloader-loongarch64-efi"
impact_packages = ["axloader", "someboot"]
name = "UEFI loongarch64 · AxLoader HTTP boot"
runner = "ubuntu-axvisor-lvz"
cache_key = ""
timeout_minutes = 90
command = '''
if ! command -v mmd >/dev/null 2>&1; then
  if [ "${TGOSKITS_PREBUILT_CONTAINER:-}" = 1 ]; then
    echo "error: prepared container is missing mtools; rebuild the CI image" >&2
    exit 1
  fi
  apt-get update
  apt-get install -y --no-install-recommends mtools
fi
python3 bootloader/axloader/scripts/loong-qemu-smoke.py
'''

[[check]]
id = "test-axloader-riscv64-efi"
impact_packages = ["axloader", "someboot"]
impact_targets = ["arceos:riscv64"]
name = "UEFI riscv64 · AxLoader HTTP boot and OTA"
