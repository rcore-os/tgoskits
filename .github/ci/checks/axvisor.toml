schema_version = 3
phase = "test"
group = "AxVisor"
default_runner = "qcs"

[[check]]
id = "test-axvisor-aarch64-qemu-smoke-axtest"
impact_targets = ["axvisor:aarch64"]
name = "QEMU aarch64 · Smoke + virtio-blk guest + axtest"
timeout_minutes = 30
command = '''
echo "==> axvisor aarch64 smoke"
cargo xtask axvisor test qemu --arch aarch64 --test-case smoke
echo "==> axvisor aarch64 net-l2-uplink compile"
FEATURES=net-l2-uplink cargo xtask axvisor build --arch aarch64 --config os/axvisor/configs/board/qemu-aarch64.toml
echo "==> axvisor aarch64 host initramfs"
cargo xtask axvisor test qemu --arch aarch64 --test-group normal --test-case qemu-host-initramfs
echo "==> axvisor aarch64 virtio-blk ArceOS guest"
timeout 240s apps/arceos/virtio-blk-test/run.sh
echo "==> axvisor aarch64 axtest"
cargo xtask ktest qemu -p axvisor --test axtest --arch aarch64 \
  --config os/axvisor/tests/build-memory-root-aarch64.toml \
  --qemu-config os/axvisor/tests/qemu-memory-root-aarch64.toml
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "aarch64"
cases = ["smoke", "qemu-host-initramfs"]

[[check]]
id = "test-axvisor-aarch64-qemu-http-control-plane-browser-console-ivc"
impact_targets = ["axvisor:aarch64"]
name = "QEMU aarch64 · HTTP control-plane + browser console"
timeout_minutes = 30
command = '''
echo "==> axvisor aarch64 HTTP control-plane (incl. pause/resume)"
cargo xtask axvisor test qemu --arch aarch64 --test-case http-control-plane
echo "==> axvisor aarch64 browser console"
cargo xtask axvisor test qemu --arch aarch64 --test-case browser-console
# Disabled until the Linux IVC guest image matches the v2 publisher protocol.
# echo "==> axvisor aarch64 IVC"
# cargo xtask axvisor test qemu --arch aarch64 --test-group normal --test-case qemu-ivc
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "aarch64"
cases = [
  "http-control-plane",
  "browser-console",
  # "qemu-ivc", # Linux guest image uses IVC v3; ArceOS publisher uses v2.
]

[[check]]
id = "test-axvisor-riscv64-qemu-smoke-ipi"
impact_targets = ["axvisor:riscv64"]
name = "QEMU riscv64 · Smoke + IPI"
timeout_minutes = 30
command = '''
echo "==> axvisor riscv64 smoke"
cargo xtask axvisor test qemu --arch riscv64 --test-case smoke
echo "==> axvisor riscv64 IPI cross-test"
cargo xtask cross-test --arch riscv64 \
  --package axvm \
  --features axvm/host-test --no-default-features --lib ipi
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "riscv64"
cases = ["smoke"]

[[check]]
id = "test-axvisor-loongarch64-qemu"
impact_targets = ["axvisor:loongarch64"]
name = "QEMU loongarch64 · Suites"
runner = "ubuntu-axvisor-lvz"
cache_key = "test-axvisor-loongarch64"
download_xtask_bin_artifact = true
command = '''
target/debug/tg-xtask axvisor test qemu --arch loongarch64
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "loongarch64"
cases = ["smoke"]

[[check]]
id = "test-axvisor-self-hosted-x86-64-svm"
impact_targets = ["axvisor:x86_64"]
name = "SVM x86_64 · Smoke, ACPI and PCI"
runner = "kvm-amd"
cache_key = ""
timeout_minutes = 120
command = '''
cargo xtask axvisor test qemu --arch x86_64 --test-case smoke-svm,direct-acpi-svm,ovmf-acpi-svm,pci-enumeration-svm,pci-block-rw-svm,pci-block-ro-svm
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "x86_64"
cases = ["smoke-svm", "direct-acpi-svm", "ovmf-acpi-svm", "pci-enumeration-svm", "pci-block-rw-svm", "pci-block-ro-svm"]

[[check]]
id = "test-axvisor-self-hosted-x86-64-vmx"
impact_targets = ["axvisor:x86_64"]
name = "VMX x86_64 · Smoke, ACPI and PCI"
runner = "kvm-intel"
timeout_minutes = 120
