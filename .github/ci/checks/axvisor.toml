schema_version = 3
phase = "test"
group = "AxVisor"
default_runner = "qcs"

[[check]]
id = "test-axvisor-aarch64-qemu-smoke-axtest"
impact_targets = ["axvisor:aarch64"]
name = "QEMU aarch64 · Smoke + virtio-blk guest + axtest"
timeout_minutes = 30
command = '''
echo "==> axvisor aarch64 smoke + host initramfs"
cargo xtask axvisor test qemu --arch aarch64 --test-case smoke,qemu-host-initramfs
echo "==> axvisor aarch64 virtio-blk ArceOS guest"
timeout 240s apps/arceos/virtio-blk-test/run.sh
echo "==> axvisor aarch64 five virtio-net guest vCPUs on two host CPUs"
timeout 600s apps/arceos/virtio-net-peer/run.sh --vcpus
echo "==> axvisor aarch64 axtest"
cargo xtask ktest qemu -p axvisor --test axtest --arch aarch64 \
  --config os/axvisor/tests/build-memory-root-aarch64.toml \
  --qemu-config os/axvisor/tests/qemu-memory-root-aarch64.toml
echo "==> axvm aarch64 provided-DTB CPU map regression"
run_axvm_cross_test() {
  local output
  output="$(cargo xtask cross-test "$@" 2>&1)" || {
    printf '%s\n' "$output"
    return 1
  }
  printf '%s\n' "$output"
  printf '%s\n' "$output" | grep -Eq 'test result: ok\. [1-9][0-9]* passed;' || {
    echo "cross-test filter matched no passing test" >&2
    return 1
  }
}
run_axvm_cross_test --arch aarch64 --package axvm \
  --features axvm/host-test --no-default-features --lib arch::aarch64::fdt
echo "==> axvm aarch64 cloned CPU identity regression"
run_axvm_cross_test --arch aarch64 --package axvm \
  --features axvm/host-test --no-default-features --lib tree_clones_missing_guest_cpu_nodes_with_fresh_phandles
echo "==> axvm riscv64 cloned CPU identity regression"
run_axvm_cross_test --arch riscv64 --package axvm \
  --features axvm/host-test --no-default-features --lib tree_clones_missing_guest_cpu_nodes_with_fresh_phandles
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "aarch64"
cases = ["smoke", "qemu-host-initramfs"]

[[check]]
id = "test-axvisor-aarch64-qemu-http-control-plane-browser-console-ivc"
impact_targets = ["axvisor:aarch64"]
name = "QEMU aarch64 · HTTP control-plane + browser console + ArceOS IVC"
timeout_minutes = 30
command = '''
echo "==> axvisor web UI typecheck, unit tests, and bundle"
(
  cd os/axvisor/web-ui
  if ! command -v npm >/dev/null 2>&1; then
    test "$(id -u)" = 0
    apt-get update
    apt-get install -y --no-install-recommends nodejs npm
    rm -rf /var/lib/apt/lists/*
  fi
  node --version
  npm --version
  npm ci
  npm test
  npm run build
)
echo "==> axvisor aarch64 HTTP control-plane (incl. pause/resume)"
cargo xtask axvisor test qemu --arch aarch64 --test-case http-control-plane
echo "==> axvisor aarch64 browser console"
cargo xtask axvisor test qemu --arch aarch64 --test-case browser-console
echo "==> axvisor aarch64 ArceOS IVC owner teardown"
cargo xtask axvisor test qemu --arch aarch64 --test-group normal --test-case qemu-ivc-arceos
# Disabled until the Linux IVC guest image matches the v2 publisher protocol.
# echo "==> axvisor aarch64 IVC"
# cargo xtask axvisor test qemu --arch aarch64 --test-group normal --test-case qemu-ivc
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "aarch64"
cases = [
  "http-control-plane",
  "browser-console",
  "qemu-ivc-arceos",
  # "qemu-ivc", # Linux guest image uses IVC v3; ArceOS publisher uses v2.
]

