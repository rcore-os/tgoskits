schema_version = 3
phase = "static"
group = "Static"

[[check]]
id = "check-formatting"
name = "Formatting + publish dry-run"
runner = "qcs"
command = '''
cargo fmt --all -- --check
cargo publish --workspace --dry-run --no-verify
'''

[[check]]
id = "run-sync-lint"
name = "Synchronization lint"
fetch_depth = "full"
upload_xtask_bin_artifact = true
command = '''
cargo xtask sync-lint --since "$SINCE_REF"
'''

[[check]]
id = "test-aicp-host-protocol"
name = "AICP host protocol and service tests"
runner = "qcs"
timeout_minutes = 10
command = '''
make -C apps/ai-rtos-demo test
cargo test -p aicp-rust-protocol --all-features
'''
