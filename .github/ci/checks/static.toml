schema_version = 3
phase = "static"
group = "Static"

[[check]]
id = "check-formatting"
name = "Formatting + publish dry-run"
runner = "qcs"
command = '''
cargo fmt --all -- --check
cargo publish --workspace --dry-run --no-verify
'''

[[check]]
id = "run-sync-lint"
name = "Incremental synchronization lint"
fetch_depth = "full"
upload_xtask_bin_artifact = true
command = '''
cargo xtask sync-lint --since "$SINCE_REF"
'''

[[check]]
id = "run-lock-lint"
name = "Locking policy"
command = '''
cargo xtask lock-lint
'''
