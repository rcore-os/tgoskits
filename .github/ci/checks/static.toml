schema_version = 3
phase = "static"
group = "Static"

[[check]]
id = "check-formatting"
name = "Formatting + publish dry-run"
runner = "qcs"
command = '''
cargo fmt --all -- --check
python3 scripts/test/publish_preflight.py
'''

[[check]]
id = "run-sync-lint"
name = "Synchronization lint"
fetch_depth = "full"
upload_xtask_bin_artifact = true
command = '''
cargo xtask sync-lint --since "$SINCE_REF"
'''
