[[check]]
id = "test-orangepi-5-plus-robot-real-suite"
impact_targets = ["axvisor:aarch64", "starry:aarch64"]
name = "Board OrangePi 5 Plus robot USB · native, AxVisor StarryOS and Linux guests"
runner = "board"
cache_key = ""
resource_group = "orangepi-5-plus-robot"
timeout_minutes = 90
command = '''
cargo xtask starry test board --board orangepi-5-plus-robot-real
cargo xtask axvisor app board \
  -t board-orangepi-5-plus/robot-real-starry,board-orangepi-5-plus/robot-real-linux \
  --board orangepi-5-plus-robot-real-starry,orangepi-5-plus-robot-real-linux
'''

[[check.suite]]
kind = "starry-board"
board = "orangepi-5-plus-robot-real"

[[check.suite]]
kind = "axvisor-board"
board = "orangepi-5-plus-robot-real-starry"

[[check.suite]]
kind = "axvisor-board"
board = "orangepi-5-plus-robot-real-linux"
