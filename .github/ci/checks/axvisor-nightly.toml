schema_version = 3
phase = "nightly"
group = "AxVisor"
default_runner = "qcs"

# AxVisor checks that only run on the nightly schedule. They are kept apart
# from `axvisor.toml` so the default main CI matrix never schedules them.
# Every check in a `nightly` manifest is nightly-only by construction; do not
# add a `nightly_only = true` field.
#
# The case files for these checks live under `apps/axvisor/`; commands select
# them by `--board`/`--test-case` name, so no command embeds the path.

[[check]]
id = "test-axvisor-aarch64-qemu-timer-stress"
impact_targets = ["axvisor:aarch64"]
name = "QEMU aarch64 · GICv2 + GICv3 timer stress"
timeout_minutes = 30
command = '''
echo "==> axvisor aarch64 gicv2 timer stress"
cargo xtask axvisor test qemu --arch aarch64 --test-case gicv2-timer-stress
echo "==> axvisor aarch64 gicv3 timer stress"
cargo xtask axvisor test qemu --arch aarch64 --test-case gicv3-timer-stress
'''

[[check.suite]]
kind = "axvisor-qemu"
arch = "aarch64"
cases = ["gicv2-timer-stress", "gicv3-timer-stress"]

[[check]]
id = "test-axvisor-self-hosted-board-orangepi-5-plus-arceos-net"
impact_targets = ["axvisor:aarch64"]
name = "Board OrangePi 5 Plus · 64 ArceOS peers and Linux observer"
runner = "board"
cache_key = ""
resource_group = "orangepi-5-plus"
timeout_minutes = 90
command = '''
app=apps/axvisor/normal/board-orangepi-5-plus/virtio-net-peer
# Build this checkout with one MAC-derived identity binary for all peers.
AXVIRTIO_IDENTITY_FROM_MAC=1 cargo xtask arceos build -p arceos-virtio-net-peer -c "$app/arceos-guest-build.toml"
mkdir -p target/axvisor-arceos-net-images
cp target/aarch64-unknown-linux-musl/release/arceos-virtio-net-peer.bin target/axvisor-arceos-net-images/orangepi-5-plus
bash "$app/vcpus/orangepi-arceos-virtio-net-test.sh" gen --with-removal --images-dir target/axvisor-arceos-net-images
cargo xtask axvisor test board -g normal --board orangepi-5-plus-arceos-net -c smoke --board-type BallPick-Robot-Rk3588
'''

[[check.suite]]
kind = "axvisor-board"
board = "orangepi-5-plus-arceos-net"
cases = ["smoke"]

[[check]]
id = "test-axvisor-self-hosted-board-orangepi-5-plus-linux-ping"
impact_targets = ["axvisor:aarch64"]
name = "Board OrangePi 5 Plus · Linux PCI network ping"
runner = "board"
cache_key = ""
resource_group = "orangepi-5-plus"
timeout_minutes = 90
command = '''
# --board selects the case; --board-type selects the registered physical board.
cargo xtask axvisor test board --board orangepi-5-plus-linux --test-case board-orangepi-5-plus/pci-network/ping --board-type BallPick-Robot-Rk3588
'''

[[check.suite]]
kind = "axvisor-board"
board = "orangepi-5-plus-linux"
cases = ["board-orangepi-5-plus/pci-network/ping"]

[[check]]
id = "test-orangepi-5-plus-robot-real-suite"
impact_targets = ["axvisor:aarch64", "starry:aarch64"]
name = "Board OrangePi 5 Plus robot USB · native, AxVisor StarryOS and Linux guests"
runner = "board"
cache_key = ""
resource_group = "orangepi-5-plus-robot"
timeout_minutes = 90
command = '''
cargo xtask starry test board --board orangepi-5-plus-robot-real
cargo xtask axvisor test board \
  --board orangepi-5-plus-robot-real-starry,orangepi-5-plus-robot-real-linux
'''

[[check.suite]]
kind = "starry-board"
board = "orangepi-5-plus-robot-real"

[[check.suite]]
kind = "axvisor-board"
board = "orangepi-5-plus-robot-real-starry"

[[check.suite]]
kind = "axvisor-board"
board = "orangepi-5-plus-robot-real-linux"
