schema_version = 3
phase = "test"
group = "Workspace"
default_runner = "qcs"

[[check]]
id = "run-clippy"
name = "Incremental Clippy"
fetch_depth = "100"
download_xtask_bin_artifact = true
command = '''
cargo xtask clippy --since "$SINCE_REF"
'''

[[check]]
id = "test-with-std"
name = "std tests"
# command and pull_request_command are identical after the first line, which
# only differs by the incremental `--since` entry point. Change trailing
# commands in both fields together.
command = '''
cargo xtask test
bash apps/starry/linux-perf/test-download.sh
cargo xtask cross-test --arch aarch64 -p task-switch --no-default-features
cargo test -p qperf --test reg
python3 tools/qperf/tests/prebuild.py
'''
pull_request_command = '''
cargo xtask test --since "$SINCE_REF"
bash apps/starry/linux-perf/test-download.sh
cargo xtask cross-test --arch aarch64 -p task-switch --no-default-features
cargo test -p qperf --test reg
python3 tools/qperf/tests/prebuild.py
'''

[[check]]
id = "test-orangepi5plus-selfbuild-scripts"
name = "Orange Pi 5 Plus · Self-build script contracts"
runner = "ubuntu-base"
container_preflight = "none"
timeout_minutes = 20
command = '''
apt-get update
apt-get install -y --no-install-recommends picocom python3-serial
cargo fetch --locked
command -v picocom
python3 -c 'import serial'
bash apps/starry/orangepi-5-plus-selfbuild/tests/script_smoke.sh
'''
