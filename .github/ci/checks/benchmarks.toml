[[check]]
id = "test-axvisor-self-hosted-board-orangepi-5-plus-vcpu-perf"
group = "AxVisor"
impact_targets = ["axvisor:aarch64"]
name = "Board OrangePi 5 Plus · Single ArceOS guest performance"
runner = "board"
cache_key = ""
resource_group = "orangepi-5-plus"
timeout_minutes = 15
command = '''
cargo xtask axvisor test board --board orangepi-5-plus-vcpu-perf
'''

[[check.suite]]
kind = "axvisor-board"
board = "orangepi-5-plus-vcpu-perf"

[[check]]
id = "test-axvisor-self-hosted-board-orangepi-5-plus-task-switch"
group = "AxVisor"
impact_targets = ["axvisor:aarch64"]
name = "Board OrangePi 5 Plus · Task switch"
runner = "board"
cache_key = ""
resource_group = "orangepi-5-plus"
timeout_minutes = 90
command = '''
echo "==> axvisor OrangePi 5 Plus task switch"
cargo xtask axvisor test board --board orangepi-5-plus-task-switch
'''

[[check.suite]]
kind = "axvisor-board"
board = "orangepi-5-plus-task-switch"

# ---------------------------------------------------------------------------
# Starry Apps performance checks (group = "Starry Apps")
# ---------------------------------------------------------------------------

[[check]]
id = "starry-performance-block-io-x86-64"
group = "Starry Apps"
name = "Starry performance · block I/O"
runner = "qcs"
timeout_minutes = 15
download_xtask_bin_artifact = true
command = '''
target/debug/tg-xtask starry app qemu -t benchmark/block-io-bench --arch x86_64
'''

[[check.suite]]
kind = "starry-app-qemu"
arch = "x86_64"
cases = ["block-io-bench"]

[[check]]
id = "starry-performance-compile-sim"
group = "Starry Apps"
name = "Starry performance · compile simulation"
runner = "qcs"
timeout_minutes = 35
download_xtask_bin_artifact = true
command = '''
target/debug/tg-xtask starry app qemu \
  -t benchmark/qemu/compile-sim-bench \
  --arch x86_64 \
  --qemu-config qemu-x86_64-benchmark.toml
'''

[[check.suite]]
kind = "starry-app-qemu"
arch = "x86_64"
cases = ["qemu/compile-sim-bench"]

