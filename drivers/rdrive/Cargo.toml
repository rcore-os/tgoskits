[package]
authors = ["周睿 <zrufo747@outlook.com>"]
categories = ["embedded", "no-std"]
description = "A dyn driver manager."
edition.workspace = true
keywords = ["os", "driver"]
license = "MIT"
name = "rdrive"
repository.workspace = true
version = "0.23.9"

[dependencies]
acpi = "6.1.1"
axtest = { workspace = true, optional = true }
ax-sync = { workspace = true }
ax-lazyinit.workspace = true
fdt-edit.workspace = true
fdt-raw.workspace = true
log = "0.4"
mmio-api.workspace = true
paste = "1"
thiserror = { version = "2", default-features = false }

pcie.workspace = true

rdif-base = { workspace = true }
rdif-clk = { workspace = true }
rdif-pinctrl = { workspace = true, features = ["fdt"] }
rdif-power = { workspace = true }
rdif-reset = { workspace = true }
rdrive-macros.workspace = true
rdif-pcie = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86.workspace = true

[dev-dependencies]
# Keep this path-only so Cargo strips the test-only reverse edge when publishing.
# `ax-runtime` depends on `rdrive`; inheriting its workspace version would make
# the two crates a publish-time dependency cycle.
ax-runtime = { path = "../../os/arceos/modules/axruntime", features = ["host-test"] }

[features]
axtest = ["dep:axtest"]
# Keep the host-test feature explicit for the std-test runner. The integration
# tests link ax-runtime as the sole synchronization provider.
host-test = ["ax-sync/host-test"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(axtest)'] }
