[package]
name = "sdhci-host"
version = "0.6.0"
repository.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "IRQ-driven ADMA2 SDHCI host controller backend"
keywords = ["sd", "sdhci", "embedded", "no_std"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
sdmmc-host = { workspace = true, features = ["rdif"] }
log.workspace = true
dma-api.workspace = true
mmio-api.workspace = true
rdif-block.workspace = true
tock-registers.workspace = true

[features]
default = []
