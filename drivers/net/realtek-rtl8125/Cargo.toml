[package]
name = "realtek-rtl8125"
version = "0.3.4"
authors = ["周睿 <zrufo747@outlook.com>"]
categories = ["embedded", "hardware-support", "no-std"]
description = "Minimal Realtek RTL8125 PCIe Ethernet driver"
edition.workspace = true
keywords = ["realtek", "rtl8125", "ethernet", "driver"]
license = "MIT"
repository.workspace = true

[dependencies]
ax-sync.workspace = true
dma-api.workspace = true
log.workspace = true
mbarrier = "0.1"
mmio-api.workspace = true
rdif-eth.workspace = true
thiserror = { version = "2", default-features = false }
tock-registers = "0.10"

[dev-dependencies]
# Host tests link their own `ax_sync` lock backend through this macro; the
# kernel builds never see it.
ax-crate-interface.workspace = true
