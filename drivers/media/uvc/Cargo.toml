[package]
name = "media-uvc"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ax-media = { workspace = true }
crab-usb = { workspace = true }
ax-sync = { workspace = true, features = ["sleep"] }
ax-task = { workspace = true }
axpoll = { workspace = true }
log = { workspace = true }
