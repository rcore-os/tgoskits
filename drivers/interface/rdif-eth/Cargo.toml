[package]
authors = ["周睿 <zrufo747@outlook.com>"]
categories = ["embedded", "no-std"]
description = "Driver Interface net definition."
edition.workspace = true
keywords = ["os", "driver"]
license = "MIT"
name = "rdif-eth"
repository.workspace = true
version = "0.5.0"

[dependencies]
dma-api = { workspace = true }
rdif-base = { workspace = true }
thiserror = { version = "2", default-features = false }
zeroize.workspace = true

[dev-dependencies]
dma-api = { workspace = true, features = ["pool"] }

[features]

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
# Path-only test support is stripped from published packages, avoiding a cycle
# through the runtime's driver dependencies.
ax-runtime = { path = "../../../os/arceos/modules/axruntime", features = ["host-test"] }
