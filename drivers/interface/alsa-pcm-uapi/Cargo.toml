[package]
name = "alsa-pcm-uapi"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-2.0-or-later WITH Linux-syscall-note"
description = "Linux ALSA PCM wire layouts for 64-bit little-endian capture clients"
categories = ["no-std", "os"]
keywords = ["alsa", "pcm", "uapi"]

[[package.metadata.clippy.configurations]]
name = "riscv64"
target = "riscv64gc-unknown-none-elf"

[dependencies]
bytemuck = { version = "1.23", default-features = false, features = ["derive", "min_const_generics"] }
