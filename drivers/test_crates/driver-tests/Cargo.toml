[package]
name = "driver-tests"
version = "0.1.0"
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true
autotests = false

[dependencies]

[dev-dependencies]
ax-driver = { path = "../../ax-driver", features = ["serial"] }
ax-lazyinit = { path = "../../../components/ax-lazyinit" }
ax-sync = { path = "../../../os/arceos/modules/axsync", features = ["host-test"] }
axklib = { path = "../../../components/axklib" }
dma-api = { path = "../../../memory/dma-api" }
eth-intel = { path = "../../net/eth-intel" }
fdt-edit.workspace = true
pcie = { path = "../../pci/pcie" }
rdif-intc = { path = "../../interface/rdif-intc" }
rdif-serial = { path = "../../interface/rdif-serial" }
rdrive = { path = "../../rdrive" }
rockchip-soc = { path = "../../soc/rockchip/rockchip-soc" }
some-serial = { path = "../../serial/some-serial" }
num-align = "0.1.0"

[[test]]
name = "serial_fdt"
path = "tests/serial_fdt.rs"

# These bare-test cases stay disabled by default. To run one manually, add the
# required bare-test dependency in this test crate and enable the matching
# [[test]] target locally.
