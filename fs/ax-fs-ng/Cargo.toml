[package]
name = "ax-fs-ng"
version = "0.9.0"
repository = "https://github.com/rcore-os/tgoskits"
edition.workspace = true
authors = ["Mivik <mivikq@gmail.com>"]
description = "ArceOS filesystem module"
license.workspace = true

[features]
axtest = []
host-test = ["ax-sync/host-test"]
fat = ["dep:fatfs"]
ext4 = ["dep:rsext4"]
vfs = ["ax-sync/sleep"]
lockdep = ["axfs-ng-vfs/lockdep"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(axtest)'] }

[dependencies]
axfs-ng-vfs = { workspace = true }
ax-io = { workspace = true, features = ["alloc"] }
ax-lazyinit.workspace = true
ax-sync = { workspace = true, features = ["sleep"] }
bitflags = "2.10"
cfg-if = { workspace = true }
chrono = { workspace = true }
dma-api = { workspace = true }
intrusive-collections = "0.9"
irq-framework = { workspace = true }
log = { workspace = true }
lru = "0.16"
rdif-block = { workspace = true }
scope-local = { workspace = true }
slab = { version = "0.4", default-features = false }
thiserror.workspace = true

[dependencies.rsext4]
workspace = true
optional = true

[dependencies.fatfs]
package = "starry-fatfs"
version = "0.4.1-preview.2"
default-features = false
optional = true
features = ["alloc", "lfn", "log_level_trace", "unicode"]

[[test]]
name = "axtest"
path = "tests/axtest.rs"
harness = false
required-features = ["axtest"]

[dev-dependencies.axtest]
path = "../../components/axtest/axtest"

[dev-dependencies.ax-std]
path = "../../os/arceos/ulib/axstd"
features = ["default"]

[dev-dependencies.ax-hal]
path = "../../os/arceos/modules/axhal"
