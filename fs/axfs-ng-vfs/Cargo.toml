[package]
name = "axfs-ng-vfs"
version = "0.6.1"
edition.workspace = true
authors = ["Mivik <mivikq@gmail.com>", "朝倉水希 <asakuramizu111@gmail.com>"]
description = "Virtual filesystem layer for ArceOS"
keywords = ["vfs", "filesystem", "ax-fs-ng", "arceos"]
repository = "https://github.com/Starry-OS/axfs-ng-vfs"
license = "Apache-2.0"

[features]
default = []
host-test = ["ax-sync/host-test"]
lockdep = []

[dependencies]
ax-sync = { workspace = true, features = ["sleep"] }
bitflags = "2.10"
cfg-if = "1"
hashbrown = "0.16"
inherit-methods-macro = "0.1"
log = "0.4"
smallvec = "1.15"
thiserror.workspace = true

[dev-dependencies]
ax-sync = { workspace = true, features = ["host-test"] }

[[test]]
name = "std"
path = "tests/std.rs"
required-features = ["host-test"]
