args = [
    "-nographic",
    "-machine",
    "virt,gic-version=3,its=on",
    "-m",
    "512M",
    "-cpu",
    "cortex-a53",
    "-smp",
    "4",
    "-device",
    "nvme,serial=deadbeef,drive=nvm,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=nvm,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:"
test_commands = [
    "exec /usr/bin/starry-run-system-tests",
]
grouped_command_selection = "preserve_all"
success_regex = ["(?m)^STARRY_GROUPED_TESTS_PASSED\\s*$"]
fail_regex = ['(?i)\bpanic(?:ked)?\b', "(?m)^lockdep fatal violation\\s*$", '(?m)^STARRY_GROUPED_TEST_FAILED:']
timeout = 1800
