board_type = "AKA-00-SG2002"
dtb_file = "os/StarryOS/configs/board/aka-00-sg2002.dtb"
kernel_load_addr = "0x80200000"
fit_load_addr = "0x82200000"
bootm_addr = "0x82200000"
fail_regex = ['(?m)^SG2002_AUDIO_FAILED(?:\s|$)', '(?i)\bpanic(?:ked)?\b', '(?i)segmentation fault']
timeout = 600

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = '''
marker=SG2002_AUDIO
ready=0
for attempt in $(seq 1 30); do
  if wget -T 5 -O /tmp/sg2002-audio-check '${sessionFile:bin/sg2002-audio-check}'; then
    ready=1
    break
  fi
  sleep 1
done
if [ "$ready" = 1 ] && chmod +x /tmp/sg2002-audio-check &&
   timeout 30 /tmp/sg2002-audio-check --lifecycle 16000 &&
   timeout 30 /tmp/sg2002-audio-check --lifecycle 48000; then
  echo "${marker}_BOTH_RATES_PASSED"
else
  echo "${marker}_FAILED"
fi
'''
success_regex = ['(?m)^SG2002_AUDIO_BOTH_RATES_PASSED\s*$']
