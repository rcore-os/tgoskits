board_type = "AKA-00-SG2002"
dtb_file = "os/StarryOS/configs/board/aka-00-sg2002.dtb"
kernel_load_addr = "0x80200000"
fit_load_addr = "0x82200000"
bootm_addr = "0x82200000"
fail_regex = [
  '(?m)^STARRY_VDEC_FAILED(?:\s|$)',
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)segmentation fault",
  "(?i)SIGSEGV",
  "exit with code: 139",
  "failed to determine root device",
]
timeout = 600

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = '''
marker=STARRY_VDEC
ready=0
for attempt in $(seq 1 30); do
  if wget -T 5 -O /tmp/starry-vdec '${sessionFile:bin/starry-vdec}'; then
    ready=1
    break
  fi
  sleep 1
done
if [ "$ready" = 1 ] && chmod +x /tmp/starry-vdec; then
  /tmp/starry-vdec || echo "${marker}_FAILED"
else
  echo "${marker}_FAILED"
fi
'''
success_regex = ["(?m)^STARRY_VDEC_PASSED\\s*$"]
