# Build-time config template for StarryOS on SG2002, scoped to the `usb2-lsusb` case.
target = "riscv64gc-unknown-none-elf"
features = [
  "starry-kernel/sg2002",
  "starry-kernel/sg2002-cvi-usb-camera",
  "axplat-dyn/thead-mae",
  "ax-driver/serial",
  "ax-driver/sg2002-dwc2",
  "ax-driver/cv181x-sdhci",
  # Wi-Fi is intentionally omitted: this USB enumeration case never uses the AIC8800
  # radio, and the shared Wi-Fi firmware startup can panic before `lsusb` runs.
]
log = "Info"
max_cpu_num = 1

# Board runtime values kept identical to the shared SG2002 board configuration.
cmdline = 'root=/dev/mmcblk0p2 rootwait rw console=ttyS0,115200 earlycon=sbi riscv.fwsz=0x80000 release loglevel=0 init=/bin/sh HOME=/root USER=root HOSTNAME=starry -- -c "cd /root; export PS1=$USER@$HOSTNAME:~#; exec /bin/sh -i"'
board_type = "AKA-00-SG2002"
dtb_file = "os/StarryOS/configs/board/aka-00-sg2002.dtb"
kernel_load_addr = "0x80200000"
fit_load_addr = "0x82200000"
bootm_addr = "0x82200000"
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)segmentation fault",
  "(?i)SIGSEGV",
  "exit with code: 139",
  "failed to determine root device",
  "(?m)^(?:\\x1b\\[[0-9;]*m)*unable to initialize libusb: .*$",
  "(?i)(lsusb|tee|grep|sh): .*not found",
  "(?m)^(?:\\x1b\\[[0-9;]*m)*lsusb: .*",
  "(?m)^(?:\\x1b\\[[0-9;]*m)*STARRY_AKA_USB2_ROOT_HUB_MISSING\\s*$",
  "(?m)^(?:\\x1b\\[[0-9;]*m)*STARRY_AKA_USB2_DEVICE_MISSING\\s*$",
]
timeout = 600
