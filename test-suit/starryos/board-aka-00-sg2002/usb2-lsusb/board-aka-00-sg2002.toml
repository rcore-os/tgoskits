board_type = "AKA-00-SG2002"
dtb_file = "os/StarryOS/configs/board/aka-00-sg2002.dtb"
kernel_load_addr = "0x80200000"
fit_load_addr = "0x82200000"
bootm_addr = "0x82200000"
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)segmentation fault",
  "(?i)SIGSEGV",
  "exit with code: 139",
  "failed to determine root device",
  "(?m)^(?:\\x1b\\[[0-9;]*m)*unable to initialize libusb: .*$",
  "(?i)(lsusb|tee|grep|sh): .*not found",
  "(?m)^(?:\\x1b\\[[0-9;]*m)*lsusb: .*",
  "(?m)^(?:\\x1b\\[[0-9;]*m)*STARRY_AKA_USB2_ROOT_HUB_MISSING\\s*$",
  "(?m)^(?:\\x1b\\[[0-9;]*m)*STARRY_AKA_USB2_DEVICE_MISSING\\s*$",
]
timeout = 600

[[shell_check_steps]]
shell_prefix = "root@starry:"
# The AKA-00 board lab may attach either a Genesys USB2 hub or the Realtek UVC camera.
shell_cmd = "sleep 5; echo STARRY_AKA_USB2_LSUSB_BEGIN; lsusb > /tmp/starry-aka-usb2-lsusb.out; cat /tmp/starry-aka-usb2-lsusb.out; if ! grep -Eq 'ID 1d6b:0002' /tmp/starry-aka-usb2-lsusb.out; then echo STARRY_AKA_USB2_ROOT_HUB_MISSING; elif ! grep -Eq 'ID (05e3:06(10|20)|0bda:5856)' /tmp/starry-aka-usb2-lsusb.out; then echo STARRY_AKA_USB2_DEVICE_MISSING; else echo STARRY_AKA_USB2_LSUSB_OK; fi"
success_regex = ["(?m)^(?:\\x1b\\[[0-9;]*m)*STARRY_AKA_USB2_LSUSB_OK\\s*$"]
