board_type = "AKA-00-SG2002"
dtb_file = "os/StarryOS/configs/board/aka-00-sg2002.dtb"
kernel_load_addr = "0x80200000"
fit_load_addr = "0x82200000"
bootm_addr = "0x82200000"
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  '(?i)segmentation fault|SIGSEGV',
  '(?m)^STARRY_AKA_WIFI_DHCP_FAILED\s*$',
  '(?m)^STARRY_AKA_WIFI_NETWORK_SMOKE_FAILED\s*$',
  '(?i)(curl|chmod|ip|grep|sh): .*not found',
  '(?i)WPA2 .*failed|AIC .*failed|DHCP .*failed',
]
timeout = 600

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = '''
marker=STARRY_AKA_WIFI_NETWORK_SMOKE
ready=0
attempt=1
while [ "$attempt" -le 30 ]; do
  if command -v curl >/dev/null 2>&1 && mkdir -p /tmp/network-smoke &&
    curl --connect-timeout 2 --max-time 5 -fsSL '${sessionFile:bin/upload-source}' -o /tmp/network-smoke/upload-source &&
    curl --connect-timeout 2 --max-time 5 -fsSL '${sessionFile:bin/curl-smoke.sh}' -o /tmp/network-smoke/curl-smoke.sh &&
    curl --connect-timeout 2 --max-time 5 -fsSL '${sessionFile:bin/network-smoke.sh}' -o /tmp/network-smoke/network-smoke.sh; then ready=1; fi
  if [ "$ready" = 1 ]; then break; fi
  sleep 1
  attempt=$((attempt + 1))
done
if [ "$ready" = 1 ] && chmod +x /tmp/network-smoke/*; then
  PATH="/tmp/network-smoke:$PATH" /tmp/network-smoke/network-smoke.sh '${boardServerIp}'
else
  echo "${marker}_FAILED"
fi
'''
success_regex = ['(?m)^STARRY_AKA_WIFI_NETWORK_SMOKE_PASSED\s*$']
