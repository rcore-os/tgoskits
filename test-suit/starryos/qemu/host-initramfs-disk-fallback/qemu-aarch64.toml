cmdline = 'root=/dev/nvme0n1 init=/bin/sh HOST_ENV=ready -- -c "echo STARRY_DISK_INIT_PASSED; exec /sbin/init"'
args = [
  "-machine", "virt",
  "-cpu", "cortex-a53",
  "-m", "512M",
  "-smp", "1",
  "-nographic",
  "-serial", "mon:stdio",
  "-device", "nvme,drive=disk0,serial=tgoskits",
  "-drive", "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-aarch64-alpine.img",
]
uefi = false
to_bin = true
fail_regex = ["STARRY_INITRAMFS_FAILED", "ARCEOS_PANIC_EMERGENCY"]
timeout = 90

[[shell_check_steps]]
success_regex = ["STARRY_DISK_INIT_PASSED"]

[[shell_check_steps]]
success_regex = ["root@starry:~#"]
