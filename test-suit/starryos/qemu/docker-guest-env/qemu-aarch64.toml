args = [
    "-nographic",
    "-cpu",
    "cortex-a53",
    "-m",
    "1G",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-aarch64-debian.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
]
uefi = false
to_bin = true
shell_check_steps = [
  {
    shell_prefix = "root@starry:",
    shell_cmd = "/usr/bin/docker-guest-env-smoke.sh",
    success_regex = ["(?m)^DOCKER_GUEST_ENV_PASSED\\s*$"],
  },
]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?m)^lockdep fatal violation\\s*$",
  "(?m)^DOCKER_GUEST_ENV_FAILED:",
  "(?m)^DOCKER_GUEST_ENV_PROBE_FAILED:",
  "(?m)^DGE_SHELL_FAIL",
]
timeout = 1200
