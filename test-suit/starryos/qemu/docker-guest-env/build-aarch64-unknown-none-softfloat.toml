# Build config for the Debian container-host rootfs. That image carries its own
# BusyBox `/sbin/init` + `/etc/init.d/rcS` instead of Starry's OpenRC assets, so
# select the built-in init shell (`legacy-board-init`) like the board images.
features = [
  "legacy-board-init",
  "ax-runtime/display",
  "ax-runtime/rtc",
  "ax-driver/serial",
  "ax-driver/nvme",
  "ax-driver/virtio-net",
  "ax-driver/virtio-gpu",
  "ax-driver/virtio-input",
  "ax-driver/virtio-socket",
  "ax-driver/xhci-pci",
]
max_cpu_num = 4
log = "Warn"
target = "aarch64-unknown-none-softfloat"