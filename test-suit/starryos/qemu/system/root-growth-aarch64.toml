# Only the disposable injected copy grows; the source/cache ext4 stays unchanged.
rootfs_growth_bytes = 268435456
cmdline = "root=/dev/nvme0n1 rw"
args = [
    "-nographic", "-machine", "virt,gic-version=3,its=on",
    "-m", "512M", "-cpu", "cortex-a53,pmu=on", "-smp", "4",
    "-device", "nvme,serial=deadbeef,drive=nvm,max_ioqpairs=64,msix_qsize=65",
    "-drive", "id=nvm,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-aarch64-alpine.img",
]
uefi = false
to_bin = true
test_commands = ['test -n "$STARRY_ROOT_EXPECTED_BYTES" || exit 1; exec /usr/bin/starry-run-system-tests']
fail_regex = ['(?i)\bpanic(?:ked)?\b', "(?m)^lockdep fatal violation\\s*$", '(?m)^STARRY_GROUPED_TEST_FAILED:']
timeout = 180
