args = [
    "-machine",
    "virt",
    "-cpu",
    "la464",
    "-nographic",
    "-m",
    "2G",
    "-smp",
    "4",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-loongarch64-alpine.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
    "-device",
    "virtio-gpu-pci",
    "-device",
    "virtio-keyboard-pci",
    "-device",
    "virtio-tablet-pci",
]
# The std/PIC test image must be loaded through the LoongArch UEFI handoff.
uefi = true
to_bin = true
shell_prefix = "root@starry:"
test_commands = [
    '''
total=0
passed=0
failed=0
system_fail_marker=STARRY_SYSTEM_TEST_FAILED
group_fail_marker=STARRY_GROUPED_TEST_FAILED
output_file=/tmp/starry-system-test-output.$$
suite_start=$(date +%s 2>/dev/null || printf 0)
for bin in /usr/bin/starry-test-suit/*; do
    [ -f "$bin" ] && [ -x "$bin" ] || continue
    total=$((total + 1))
    start=$(date +%s 2>/dev/null || printf 0)
    echo "STARRY_SYSTEM_TEST_BEGIN: $bin"
    if "$bin" > "$output_file" 2>&1; then
        exit_status=0
    else
        exit_status=$?
    fi
    end=$(date +%s 2>/dev/null || printf 0)
    elapsed_s=$((end - start))
    if [ "$elapsed_s" -lt 0 ]; then
        elapsed_s=0
    fi
    if [ "$exit_status" -eq 0 ]; then
        passed=$((passed + 1))
        echo "STARRY_SYSTEM_TEST_PASSED: $bin elapsed_s=$elapsed_s"
    else
        failed=$((failed + 1))
        cat "$output_file"
        echo "$system_fail_marker: $bin status=$exit_status elapsed_s=$elapsed_s"
    fi
    rm -f "$output_file"
done
suite_end=$(date +%s 2>/dev/null || printf 0)
suite_elapsed_s=$((suite_end - suite_start))
if [ "$suite_elapsed_s" -lt 0 ]; then
    suite_elapsed_s=0
fi
rm -f "$output_file"
echo "STARRY_SYSTEM_TEST_SUMMARY: total=$total passed=$passed failed=$failed elapsed_s=$suite_elapsed_s"
if [ "$total" -eq 0 ]; then
    echo "$group_fail_marker: no SMP system tests found"
    exit 1
fi
if [ "$failed" -ne 0 ]; then
    echo "$group_fail_marker: one or more SMP system tests failed"
    exit 1
fi
echo "STARRY_GROUPED_TESTS_PASSED"
''',
]
success_regex = ["(?m)^STARRY_GROUPED_TESTS_PASSED\\s*$"]
fail_regex = ['(?i)\bpanic(?:ked)?\b', "(?m)^lockdep fatal violation\\s*$", '(?m)^STARRY_GROUPED_TEST_FAILED:']
timeout = 1800

[host_http_server]
bind = "127.0.0.1"
port = 18383
body_size = 20971520
body_byte = 97
