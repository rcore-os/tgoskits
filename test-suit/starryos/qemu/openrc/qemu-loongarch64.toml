args = [
    "-machine",
    "virt",
    "-cpu",
    "la464",
    "-nographic",
    "-m",
    "2G",
    "-smp",
    "4",
    "-device",
    "nvme,serial=deadbeef,drive=nvm,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=nvm,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-loongarch64-alpine.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
    "-device",
    "virtio-gpu-pci",
    "-device",
    "virtio-keyboard-pci",
    "-device",
    "virtio-tablet-pci",
]
# This dynamic LoongArch test uses the same UEFI handoff as the Starry kernel test image.
uefi = true
to_bin = true
shell_check_steps = [
  { shell_prefix = "root@starry:", shell_cmd = "/usr/bin/openrc-test.sh", success_regex = ["(?m)^STARRY_OPENRC_PASSED\\s*$"] },
  { shell_prefix = "root@starry:", shell_cmd = "exit", success_regex = ["Welcome to Starry OS!"] },
  { shell_prefix = "root@starry:", shell_cmd = "poweroff", success_regex = ["(?m)^STARRY_OPENRC_SERVICE_STOPPED\\s*$"] },
]
fail_regex = ["STARRY_OPENRC_FAILED", "(?i)panic"]
timeout = 180
