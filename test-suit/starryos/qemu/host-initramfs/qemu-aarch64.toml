cmdline = "root=/dev/sda rdinit=/init HOST_ENV=ready -- from-dashes"
args = [
  "-machine", "virt",
  "-cpu", "cortex-a53",
  "-m", "512M",
  "-smp", "1",
  "-nographic",
  "-serial", "mon:stdio",
]
uefi = false
to_bin = true
fail_regex = ["STARRY_INITRAMFS_FAILED", "(?i)\\bpanic(?:ked)?\\b"]
timeout = 45

[[shell_check_steps]]
success_regex = ["STARRY_INITRAMFS_PASSED"]
