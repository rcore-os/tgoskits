board_type = "OrangePi-5-Plus"
timeout = 300
fail_regex = ['(?i)\bpanic(?:ked)?\b', '(?m)^STARRY_RKNPU_RESOURCES_FAILED\b', '(?i)segmentation fault']

[[shell_check_steps]]
shell_prefix = "root@starry:/root #"
shell_cmd = '''
marker=STARRY_RKNPU_RESOURCES
ready=0
attempt=1
while [ "$attempt" -le 30 ]; do
  if curl --connect-timeout 2 --max-time 5 -fsSL '${sessionFile:usr/bin/starry-test-suit/syscall-test-rknpu-resources}' -o /tmp/starry-rknpu-resources; then
    ready=1
    break
  fi
  sleep 1
  attempt=$((attempt + 1))
done
if [ "$ready" = 1 ] && chmod +x /tmp/starry-rknpu-resources; then
  /tmp/starry-rknpu-resources || echo "${marker}_FAILED"
else
  echo "${marker}_FAILED"
fi
'''
success_regex = ['(?m)^STARRY_RKNPU_RESOURCES_OK\s*$']
