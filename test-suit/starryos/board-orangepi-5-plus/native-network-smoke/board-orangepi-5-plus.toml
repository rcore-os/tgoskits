board_type = "OrangePi-5-Plus"
session_files = [
  "iperf-smoke.sh",
]
shell_prefix = "root@starry:/root #"
shell_init_cmd = '''
suite=STARRY_NATIVE_NETWORK
iperf_marker=STARRY_IPERF_SMOKE
rtnl_marker=STARRY_RTNL
ok=1

printf '\nRTL8125_NET_TEST_BEGIN\n'
gateway_ready=0
attempt=1

while [ "$attempt" -le 30 ]; do
  ip link show dev eth0 >/tmp/rtl8125-link 2>&1 || true
  ip -4 addr show dev eth0 >/tmp/rtl8125-addr 2>&1 || true
  ip route show default >/tmp/rtl8125-route 2>&1 || true
  gateway=$(awk '/^default / { print $3; exit }' /tmp/rtl8125-route)

  if grep -Eq 'inet [0-9]' /tmp/rtl8125-addr && [ -n "$gateway" ]; then
    if ping -c 3 -W 2 "$gateway" >/tmp/rtl8125-ping 2>&1; then
      gateway_ready=1
      break
    fi
  fi

  echo "RTL8125_NET_WAIT attempt=$attempt gateway=${gateway:-missing}"
  attempt=$((attempt + 1))
  sleep 2
done

cat /tmp/rtl8125-link
cat /tmp/rtl8125-addr
cat /tmp/rtl8125-route
if [ -f /tmp/rtl8125-ping ]; then
  cat /tmp/rtl8125-ping
fi

if [ "$gateway_ready" = "1" ]; then
  echo "RTL8125_NET_READY attempt=$attempt gateway=$gateway"
  printf '%s%s\n' RTL8125_NET_TEST_ PASSED
else
  printf '%s%s: %s\n' RTL8125_NET_TEST_ FAILED 'eth0 did not reach its default gateway'
  ok=0
fi

server_ip='${boardServerIp}'
url='${sessionFile:iperf-smoke.sh}'
script=/tmp/iperf-smoke.sh

download_script() {
  if command -v curl >/dev/null 2>&1; then
    curl --connect-timeout 2 --max-time 5 -fsSL "$url" -o "$script"
  elif command -v wget >/dev/null 2>&1; then
    wget -T 5 -O "$script" "$url"
  else
    return 1
  fi
}

downloaded=0
attempt=1
while [ "$attempt" -le 30 ]; do
  if download_script; then
    downloaded=1
    break
  fi
  sleep 1
  attempt=$((attempt + 1))
done
if [ "$downloaded" != "1" ]; then
  echo "${iperf_marker}_FAILED"
  ok=0
elif ! chmod +x "$script" || ! "$script" "$server_ip"; then
  echo "${iperf_marker}_FAILED"
  ok=0
fi

printf '\n%s_BEGIN\n' "$rtnl_marker"
rtnl_ok=1
ip addr del 192.168.10.2/24 dev eth1 >/tmp/starry-rtnl-cleanup 2>&1 || true
ip link show dev eth1 || rtnl_ok=0
if ip link show dev starry_missing0 >/tmp/starry-rtnl-missing 2>&1; then
  echo "${rtnl_marker}_BAD_MISSING_LINK"
  rtnl_ok=0
else
  cat /tmp/starry-rtnl-missing
fi

ip addr add 192.168.10.2/24 dev eth1 || rtnl_ok=0
ip -o addr show dev eth1 || rtnl_ok=0
ip addr del 192.168.10.2/24 dev eth1 || rtnl_ok=0
if ip addr del 192.168.10.2/24 dev eth1 >/tmp/starry-rtnl-del-missing 2>&1; then
  echo "${rtnl_marker}_BAD_DELADDR_MISSING"
  rtnl_ok=0
else
  cat /tmp/starry-rtnl-del-missing
fi

if ip -o addr show dev eth1 | grep -q '192\.168\.10\.2/24'; then
  echo "${rtnl_marker}_BAD_DELADDR"
  rtnl_ok=0
fi

ip addr add 192.168.10.2/24 dev eth1 || rtnl_ok=0
ip -o addr show dev eth1 || rtnl_ok=0

if [ "$rtnl_ok" = "1" ]; then
  echo "${rtnl_marker}_OK"
else
  echo "${rtnl_marker}_FAILED"
  ok=0
fi
printf '\n%s_DONE\n' "$rtnl_marker"

if [ "$ok" = "1" ]; then
  echo ${suite}_OK
else
  echo ${suite}_FAILED
fi
'''
success_regex = ['STARRY_NATIVE_NETWORK_OK']
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  '(?i)segmentation fault',
  '(?i)SIGSEGV',
  'exit with code: 139',
  '(?m)^RTL8125_NET_TEST_FAILED\b',
  '(?m)^STARRY_IPERF_SMOKE_FAILED\s*$',
  "(?i)(awk|cat|grep|ip|ping|sh|sleep): .*not found",
  '(?m)^STARRY_RTNL_BAD_[A-Z_]+\s*$',
  '(?m)^STARRY_RTNL_FAILED\s*$',
  '(?m)^STARRY_NATIVE_NETWORK_FAILED\s*$',
]
timeout = 300
