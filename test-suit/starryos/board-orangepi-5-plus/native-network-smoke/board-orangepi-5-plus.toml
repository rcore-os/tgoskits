board_type = "OrangePi-5-Plus"
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  '(?i)segmentation fault',
  '(?i)SIGSEGV',
  'exit with code: 139',
  '(?m)^RTL8125_NET_TEST_FAILED\b',
  '(?m)^STARRY_NETWORK_SMOKE_FAILED\s*$',
  "(?i)(cat|sh): .*not found",
  '(?m)^STARRY_RTNL_BAD_[A-Z_]+\s*$',
  '(?m)^STARRY_RTNL_FAILED\s*$',
  '(?m)^STARRY_NATIVE_NETWORK_FAILED\s*$',
]
timeout = 300

[[shell_check_steps]]
shell_prefix = "root@starry:~#"
shell_cmd = '''
marker=STARRY_NETWORK_SMOKE
ready=0
attempt=1
while [ "$attempt" -le 30 ]; do
  if command -v curl >/dev/null 2>&1 && mkdir -p /tmp/network-smoke &&
    curl --connect-timeout 2 --max-time 5 -fsSL '${sessionFile:bin/upload-source}' -o /tmp/network-smoke/upload-source &&
    curl --connect-timeout 2 --max-time 5 -fsSL '${sessionFile:bin/curl-smoke.sh}' -o /tmp/network-smoke/curl-smoke.sh &&
    curl --connect-timeout 2 --max-time 5 -fsSL '${sessionFile:bin/network-smoke.sh}' -o /tmp/network-smoke/network-smoke.sh &&
    curl --connect-timeout 2 --max-time 5 -fsSL '${sessionFile:bin/board-smoke.sh}' -o /tmp/network-smoke/board-smoke.sh; then ready=1; fi
  if [ "$ready" = 1 ]; then break; fi
  sleep 1
  attempt=$((attempt + 1))
done
if [ "$ready" = 1 ] && chmod +x /tmp/network-smoke/*; then
  PATH="/tmp/network-smoke:$PATH" /tmp/network-smoke/board-smoke.sh '${boardServerIp}'
else
  echo "${marker}_FAILED"
fi
'''
success_regex = ['STARRY_NATIVE_NETWORK_OK']
