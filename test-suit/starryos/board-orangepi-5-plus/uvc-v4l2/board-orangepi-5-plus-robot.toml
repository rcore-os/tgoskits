# Keep the virtual robot check selector in the file name while running this UVC
# check on the ordinary OrangePi 5 Plus board type.
# Select the test shell on existing board images without replacing their init files.
cmdline = 'root=/dev/mmcblk0p2 rw console=ttyS2,1500000 earlycon=uart8250,mmio32,0xfeb50000 rootwait rootfstype=ext4 init=/bin/sh HOME=/root USER=root HOSTNAME=starry -- -c "cd /root; export PS1=$USER@$HOSTNAME:~#; exec /bin/sh -i"'
board_type = "OrangePi-5-Plus"
timeout = 180
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  '(?m)^STARRY_UVC_V4L2_FAILED\b',
  '(?i)segmentation fault',
]

[[shell_check_steps]]
shell_prefix = "root@starry:~#"
shell_cmd = '''u='${sessionFile:usr/bin/starry-test-suit/uvc-v4l2}'; p=/tmp/uvc-v4l2; n=0; while [ "$n" -lt 12 ]; do if curl --connect-timeout 3 --max-time 10 -fsSL "$u" -o "$p.part" && [ -s "$p.part" ]; then mv "$p.part" "$p"; break; fi; n=$((n+1)); sleep 2; done; if [ -s "$p" ] && chmod +x "$p"; then "$p"; else m=STARRY_UVC_V4L2; echo "${m}_FAILED stage=download"; fi'''
success_regex = ['(?m)^STARRY_UVC_V4L2_OK frames=5 bytes=[1-9][0-9]*\s*$']
