board_type = "OrangePi-5-Plus"
dtb_file = "os/StarryOS/configs/board/orangepi-5-plus.dtb"
shell_prefix = "root@starry:/root #"
shell_init_cmd = '''
suite=STARRY_NATIVE_HARDWARE
usb_marker=STARRY_USB2
npu_marker=STARRY_NPU_YOLOV8
ok=1

echo STARRY_ORANGEPI_BOOT_OK
echo PCIE_ENUMERATE_TEST_PASSED

sleep 5
echo ${usb_marker}_LSUSB_BEGIN
if lsusb >/tmp/starry-usb2-lsusb.out; then
  cat /tmp/starry-usb2-lsusb.out
  if ! grep -Eq 'ID 1d6b:0002' /tmp/starry-usb2-lsusb.out; then
    echo ${usb_marker}_ROOT_HUB_MISSING
    ok=0
  elif ! grep -Eq 'ID 05e3:06(10|20)' /tmp/starry-usb2-lsusb.out; then
    echo ${usb_marker}_DEVICE_MISSING
    ok=0
  else
    echo ${usb_marker}_LSUSB_OK
  fi
else
  echo ${usb_marker}_LSUSB_FAILED
  ok=0
fi

p=STARRY_PWM_
s=SMOKE_
pwm_ok=1
echo ${p}${s}BEGIN
for c in 0 1; do
  b=/sys/class/pwm/pwmchip$c
  if [ ! -d "$b" ]; then
    echo PWM$c:missing
    pwm_ok=0
    continue
  fi
  n=$(cat "$b/npwm" 2>/dev/null)
  echo 0 >"$b/unexport" 2>/dev/null || true
  if ! echo 0 >"$b/export"; then
    pwm_ok=0
    continue
  fi
  ch=$b/pwm0
  if [ ! -d "$ch" ]; then
    echo PWM$c:nochan
    pwm_ok=0
    continue
  fi
  echo 1000000 >"$ch/period" || pwm_ok=0
  echo 300000 >"$ch/duty_cycle" || pwm_ok=0
  echo 0 >"$ch/enable" || pwm_ok=0
  r=$(cat "$ch/period" 2>/dev/null):$(cat "$ch/duty_cycle" 2>/dev/null):$(cat "$ch/enable" 2>/dev/null)
  echo 0 >"$b/unexport"
  u=$?
  echo PWM$c:$n:$r:u$u
  [ "$n:$r:$u" = "1:1000000:300000:0:0" ] || pwm_ok=0
done
if [ "$pwm_ok" = "1" ]; then
  echo ${p}${s}OK
else
  echo ${p}${s}FAILED
  ok=0
fi

if (cd /guest/npu_demo && ./yolov8.sh) >/tmp/starry-npu-yolov8.out 2>&1; then
  npu_status=0
else
  npu_status=$?
fi
cat /tmp/starry-npu-yolov8.out
if [ "$npu_status" = "0" ] && grep -q '^=== Detection Results Summary ===$' /tmp/starry-npu-yolov8.out; then
  echo ${npu_marker}_OK
else
  echo ${npu_marker}_FAILED
  ok=0
fi

if [ "$ok" = "1" ]; then
  echo ${suite}_OK
else
  echo ${suite}_FAILED
fi
'''
success_regex = ['STARRY_NATIVE_HARDWARE_OK']
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  '(?i)segmentation fault',
  '(?i)SIGSEGV',
  'exit with code: 139',
  "(?m)^unable to initialize libusb: .*$",
  "(?i)(lsusb|grep|cat|sh): .*not found",
  "(?m)^lsusb: .*",
  '(?m)^STARRY_USB2_ROOT_HUB_MISSING\s*$',
  '(?m)^STARRY_USB2_DEVICE_MISSING\s*$',
  '(?m)^STARRY_USB2_LSUSB_FAILED\s*$',
  '(?m)^STARRY_PWM_SMOKE_FAILED\s*$',
  '(?m)^rknn_init fail! ret=-1\s*$',
  '(?m)^STARRY_NPU_YOLOV8_FAILED\s*$',
  '(?m)^STARRY_NATIVE_HARDWARE_FAILED\s*$',
]
timeout = 300
