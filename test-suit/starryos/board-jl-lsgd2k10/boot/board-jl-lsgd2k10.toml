# Select the test shell on existing board images without replacing their init files.
cmdline = 'earlycon init=/bin/sh HOME=/root USER=root HOSTNAME=starry -- -c "cd /root; export PS1=$USER@$HOSTNAME:~#; exec /bin/sh -i"'
board_type = "JL-LSGD2K10"
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)segmentation fault",
  "(?i)SIGSEGV",
  "exit with code: 139",
  "failed to determine root device",
]
timeout = 600

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = "echo STARRY_JL_LSGD2K10_BOOT_OK"
success_regex = ["(?m)^STARRY_JL_LSGD2K10_BOOT_OK\\s*$"]
