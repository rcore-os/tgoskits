args = [
    "-nographic",
    "-m",
    "512M",
    "-smp",
    "4",
    "-device",
    "nvme,serial=deadbeef,drive=nvm,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=nvm,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-x86_64-alpine.img",
    "-device",
    "virtio-sound-pci,audiodev=pcm-capture,streams=2",
]
uefi = true
to_bin = true
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "(?m)^VIRTIO_SOUND_[A-Z_]+_FAILED:",
]
timeout = 300

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = '/usr/bin/starry-test-suit/virtio-sound-tools-check && /usr/bin/starry-test-suit/virtio-sound-capture || { s=$?; echo "VIRTIO_SOUND_CAPTURE_FAILED: command exited $s"; exit "$s"; }'
success_regex = ["(?m)^VIRTIO_SOUND_CAPTURE_PASSED\\s*$"]

[host_pcm_input]
frequency_hz = 997
