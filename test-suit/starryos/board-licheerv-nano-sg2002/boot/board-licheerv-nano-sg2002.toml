# Select the test shell on existing board images without replacing their init files.
cmdline = 'root=/dev/mmcblk0p2 rootwait rw console=ttyS0,115200 earlycon=sbi riscv.fwsz=0x80000 release loglevel=0 init=/bin/sh HOME=/root USER=root HOSTNAME=starry -- -c "cd /root; export PS1=$USER@$HOSTNAME:~#; exec /bin/sh -i"'
board_type = "LicheeRV-Nano-SG2002"
dtb_file = "os/StarryOS/configs/board/licheerv-nano-sg2002.dtb"
kernel_load_addr = "0x80200000"
fit_load_addr = "0x82200000"
bootm_addr = "0x82200000"
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)segmentation fault",
  "(?i)SIGSEGV",
  "exit with code: 139",
  "failed to determine root device",
]
timeout = 600

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = "echo STARRY_SG2002_BOOT_OK"
success_regex = ["(?m)^STARRY_SG2002_BOOT_OK\\s*$"]
