# Select the test shell on existing board images without replacing their init files.
cmdline = 'console=ttyS0,115200 debug rootwait earlycon=sbi init=/bin/sh HOME=/root USER=root HOSTNAME=starry -- -c "cd /root; export PS1=$USER@$HOSTNAME:~#; exec /bin/sh -i"'
board_type = "VisionFive2"
fail_regex = [
  "(?i)segmentation fault",
  "(?i)SIGSEGV",
  "exit with code: 139",
  "failed to determine root device from available block devices",
]
timeout = 600

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = "echo STARRY_VISIONFIVE2_SHELL_OK"
success_regex = ["(?m)^(?:\\x1b\\[[0-9;]*m)*STARRY_VISIONFIVE2_SHELL_OK\\s*$"]
