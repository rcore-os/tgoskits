# Keep the Cargo identity aligned with the QEMU smoke case so both cases reuse
# one AxVisor ELF while retaining independent runtime initramfs preparation
# (`web-ui` rides along for the same reason the smoke build carries it).
features = ["ax-driver/nvme", "web-ui"]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = []
