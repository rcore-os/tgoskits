# Vm base info configs
#
[base]
# Guest vm id.
id = 2
# Guest vm name.
name = "arceos-ivshmem-peer"
# Virtualization type.
guest_type = "virtualized"
# The number of virtual CPUs.
cpu_num = 1
# Guest vm physical cpu ids.
phys_cpu_ids = [2]

#
# Vm kernel configs
#
[kernel]
cmdline = "axvisor.pci_case=ivshmem-suite-arceos"
# The entry point of the kernel image.
entry_point = 0x8020_0000
# The location of image: "memory" | "fs".
image_location = "memory"
# The file path of the kernel image built by axbuild before host compilation.
kernel_path = "${workspace}/target/aarch64-unknown-linux-musl/release/arceos-ivshmem-pci.bin"
# The load address of the kernel image.
kernel_load_addr = 0x8020_0000
# The load address of the device tree blob (DTB).
dtb_load_addr = 0x8000_0000

# Memory regions with format (`base_paddr`, `size`, `flags`, `map_type`).
# For `map_type`, 0 means `MAP_ALLOC`, 1 means `MAP_IDENTICAL`, 2 means `MAP_RESERVED`.
memory_regions = [
  [0x8000_0000, 0x2000_0000, 0x7, 0], # System RAM 512M MAP_ALLOC
]

#
# Device specifications
#
[devices]
# The host PCIe bridge would otherwise reach the generated guest DTB and
# conflict with the virtual ECAM host the AArch64 plan injects.
disabled = [
  { path = "/pcie@10000000" },
]

# The ArceOS peer joins the Linux primary and portable peers on one link.
[[devices.virtual]]
id = "ivshmem0"
model = "ivshmem-pci"
link_id = 4
peer_id = 1
max_peers = 3
common_size = 0
output_size = 0x5000
