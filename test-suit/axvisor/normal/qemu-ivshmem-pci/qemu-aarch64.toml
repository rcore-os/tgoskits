args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-m",
  "4g",
  "-append",
  "axvisor.vm_start=1",
]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?m)^ARCEOS_IVSHMEM_PCI_FAIL(?:\\s|$)",
]
timeout = 120
to_bin = true
uefi = false

# Attach to the explicitly started guest before checking ECAM discovery,
# ivshmem identity, BAR2 decode and the write/read round trip.
[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"
success_regex = [
  "(?m)^(?:\\x1b\\[[0-9;]*m)*(?:\\[VM 1\\] )?ARCEOS_IVSHMEM_PCI_PASS\\s*$",
]
