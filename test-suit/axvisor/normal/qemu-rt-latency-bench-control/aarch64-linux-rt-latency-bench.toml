[base]
id = 1
name = "linux-rt-latency-bench-control"
guest_type = "passthrough"
cpu_num = 2
# Keep vCPU0 and vCPU1 on distinct host CPUs while CPU0 remains available to
# the AxVisor management and device paths.
phys_cpu_sets = [2, 4]
phys_cpu_ids = [1, 2]

[kernel]
entry_point = 0x8020_0000
image_location = "memory"
kernel_path = "${workspace}/tmp/axbuild/images/qemu-aarch64/linux/linux-qemu"
kernel_load_addr = 0x8020_0000
dtb_load_addr = 0x8000_0000
ramdisk_path = "${workspace}/tmp/axbuild/axvisor/qemu-rt-latency-bench-control/initramfs-aarch64.cpio.gz"
ramdisk_load_addr = 0x8400_0000
cmdline = "console=ttyAMA0 rdinit=/init devtmpfs.mount=1 loglevel=7 axvisor.timer_case=rt-latency-bench-control"
memory_regions = [
  [0x8000_0000, 0x4000_0000, 0x7, 0],
]

[devices]
passthrough = []
disabled = []
