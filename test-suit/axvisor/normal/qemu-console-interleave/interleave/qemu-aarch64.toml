args = [
    "-nographic",
    "-cpu",
    "cortex-a72",
    "-machine",
    "virt,virtualization=on,gic-version=3",
    "-smp",
    "4",
    "-m",
    "512M",
]
fail_regex = ["(?m)^rm:"]
timeout = 60
to_bin = true
uefi = false

[[shell_check_steps]]
success_regex = [":CONSOLE_INTERLEAVE_HOST_LOG"]
