[base]
id = 3
name = "linux-ivshmem-subscriber-2"
guest_type = "virtualized"
cpu_num = 1
phys_cpu_ids = [3]

[kernel]
entry_point = 0x8020_0000
image_location = "memory"
kernel_path = "${workspace}/target/axbuild/images/qemu-aarch64/linux/linux-qemu"
kernel_load_addr = 0x8020_0000
dtb_load_addr = 0x8000_0000
ramdisk_path = "${workspace}/tmp/axbuild/axvisor/qemu-ivshmem-message/initramfs-aarch64.cpio.gz"
ramdisk_load_addr = 0x8400_0000
cmdline = "console=ttyAMA0 rdinit=/init devtmpfs.mount=1 loglevel=7 initcall_blacklist=ahci_pci_driver_init,virtio_pci_driver_init axvisor.pci_case=ivshmem-message-subscriber"
memory_regions = [[0x8000_0000, 0x2000_0000, 0x7, 0]]

[devices]
passthrough = []
disabled = [{ path = "/pcie@10000000" }]

[[devices.virtual]]
id = "ivshmem0"
model = "ivshmem-pci"
link_id = 5
peer_id = 2
max_peers = 3
common_size = 0
output_size = 0x1000
