# Backend-neutral Linux guest baseline for the generic vPCI enumeration case.
# The endpoint is the ordinary configured VirtIO block PCI model: the generic
# enumeration path is what the case asserts, so it needs a real function with a
# real BAR and capability chain rather than a purpose-built fixture. The guest
# command line blacklists `virtio_pci_driver_init`, which keeps the function
# enumerated but unbound. The runner generates a BusyBox initramfs from the
# managed rootfs (see AXVISOR_TEST_BUSYBOX_INITRAMFS); its /init consumes
# kernel-published sysfs PCI state to assert the enumeration postconditions and
# prints the case markers itself.
[base]
id = 1
name = "linux-x86-pci-enumeration"
guest_type = "passthrough"
cpu_num = 1
phys_cpu_ids = [1]

[kernel]
entry_point = 0x8000
kernel_path = "${workspace}/target/axbuild/images/qemu-x86_64/linux/linux-qemu"
kernel_load_addr = 0x20_0000
ramdisk_path = "${workspace}/tmp/axbuild/axvisor/qemu-pci-enumeration/initramfs-x86_64.cpio.gz"
ramdisk_load_addr = 0x0800_0000
enable_bios = false
boot_protocol = "direct"
cmdline = "console=ttyS0 rdinit=/init devtmpfs.mount=1 loglevel=7 nox2apic no_timer_check initcall_blacklist=ahci_pci_driver_init,virtio_pci_driver_init axvisor.pci_case=enumeration"
memory_regions = [
    [0x0000_0000, 0x2000_0000, 0x7, 0],
]

[devices]
passthrough = []
disabled = []

[[devices.virtual]]
id = "pci-enumeration-blk"
model = "virtio-blk"
transport = "pci"
backend = "ramdisk"
capacity = "2MiB"
read_only = true
