args = [
    "-nographic",
    "-cpu",
    "rv64",
    "-machine",
    "virt",
    "-smp",
    "1",
    "-m",
    "512M",
]
# Positive case: backtrace feature enabled (test-backtrace-panic = ["backtrace"])
# The panic path must stream raw frames without allocating.
fail_regex = ["(?s)BACKTRACE_BEGIN(?-u:\\b).*(?-u:\\b)alloc=true(?-u:\\b)"]
success_regex = ["(?s)ARCEOS_PANIC_EMERGENCY(?-u:\\b).*(?-u:\\b)BACKTRACE_BEGIN(?-u:\\b).*(?-u:\\b)kind=panic(?-u:\\b).*(?-u:\\b)alloc=false(?-u:\\b).*(?-u:\\b)BT 0(?-u:\\b).*(?-u:\\b)BACKTRACE_END"]
timeout = 60
to_bin = true
uefi = false
