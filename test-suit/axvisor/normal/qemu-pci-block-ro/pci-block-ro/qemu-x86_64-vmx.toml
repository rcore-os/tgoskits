args = [
  "-no-user-config",
  "-display",
  "none",
  "-serial",
  "stdio",
  "-monitor",
  "none",
  "-cpu",
  "host,-la57,+vmx-ept,+vmx-unrestricted-guest,+vmx-flexpriority",
  "-machine",
  "q35,smbus=off,usb=off,graphics=off",
  "-smp",
  "2",
  "-accel",
  "kvm",
  "-m",
  "1G",
  "-net",
  "none",
  "-vga",
  "none",
]
timeout = 600
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "(?i)page fault",
  "(?i)vm exit failure",
  "(?i)failed to initialize guest VM",
  "(?m)^AXVISOR_X86_PCI_BLOCK_FAILED\\s*$",
  "(?m)^AXVISOR_GUEST_ASSERTION_CASE_UNKNOWN\\s*$",
]
to_bin = true
uefi = true
cmdline = "axvisor.vm_start=1"

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"
success_regex = ["(?m)^AXVISOR_X86_PCI_BLOCK_RO_PASSED\\s*$"]

# The first passthrough start releases the host filesystem. Recreate the
# builtin guest afterwards to prove its immutable boot assets remain available
# from the retained initramfs namespace while the host disk stays released.
[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "\u0018h"
success_regex = ["detached VM\\[1\\] console"]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm delete --force 1"
success_regex = ["(?m)^✓ VM\\[1\\] deleted completely\\s*$"]
timeout = 120

[[shell_check_steps]]
shell_cmd = "vm start 1"
success_regex = ["(?m)^✓ VM\\[1\\] started successfully\\s*$"]
timeout = 120
