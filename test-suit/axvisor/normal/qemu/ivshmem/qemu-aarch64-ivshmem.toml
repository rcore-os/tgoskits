args = [
    "-nographic",
    "-cpu",
    "cortex-a72",
    "-machine",
    "virt,virtualization=on,gic-version=3",
    "-smp",
    "4",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-append",
    "console=ttyAMA0",
    "-m",
    "8g",
]
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)kernel panic",
    "(?i)unhandled page fault",
    "(?i)page fault",
    "Failed to initialize guest VM",
    "(?m)^(\\[VM [0-9]+\\] )?ivshmem bar2 smoke failed:",
    "(?m)^(\\[VM [0-9]+\\] )?ivshmem message protocol failed:",
    "(?m)^(\\[VM [0-9]+\\] )?Zephyr ivshmem failed:",
]
success_regex = [
    "(?m)^(\\[VM [0-9]+\\] )?ivshmem message protocol pass\\s*$",
]
to_bin = true
uefi = false
