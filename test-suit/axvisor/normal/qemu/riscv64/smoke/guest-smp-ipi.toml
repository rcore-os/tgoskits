# Three-vCPU SBI IPI regression using the maintained virtualized Linux boot contract.
# The original CPU placement and IPI assertions are retained by the suite.
[base]
id = 3
name = "linux-qemu-smp3-ipi"
guest_type = "virtualized"
cpu_num = 3
phys_cpu_ids = [0, 1, 2]
phys_cpu_sets = [1, 2, 4]

[kernel]
entry_point = 0x9020_0000
kernel_path = "${workspace}/target/axbuild/images/qemu-riscv64/linux/linux-qemu"
kernel_load_addr = 0x9020_0000
dtb_load_addr = 0x9300_0000
ramdisk_path = "${workspace}/target/axbuild/images/initramfs-riscv64-busybox.cpio.gz/initramfs-riscv64-busybox.cpio.gz"
ramdisk_load_addr = 0x9400_0000
cmdline = "console=ttyS0,115200 rdinit=/init devtmpfs.mount=1"
memory_regions = [
    [0x9000_0000, 0x4000_0000, 0x7, 0],
]

[devices]
passthrough = []
# The host PCI bridge and NVMe rootfs remain owned by Axvisor. The guest uses
# only the dedicated virtio-mmio block device declared below.
disabled = [{ path = "/soc/pci@30000000" }]

[[devices.virtual]]
id = "virtblk0"
model = "virtio-blk"
path = "/guest/rootfs-riscv64-alpine-0.img"
filesystem = "ext4"
