# See the aarch64 unified QEMU build for why `web-ui` rides along here.
features = [
    "ax-driver/nvme",
    "web-ui",

    "sstc",
]
log = "Info"
target = "riscv64gc-unknown-none-elf"
vm_configs = [
    "os/axvisor/configs/vms/qemu/riscv64/linux-virtio-blk.toml",
    "os/axvisor/configs/vms/qemu/riscv64/linux-virtio-blk-vm2.toml",
]
max_cpu_num = 4
