timeout = 600

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm start 6"
success_regex = ["(?m)^✓ VM\\[6\\] started successfully\\s*$"]
timeout = 120

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 6"
success_regex = [
    "(?m)^AXVISOR_X86_PCI_BLOCK_RO_PASSED\\s*$",
]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm delete --force 6"
success_regex = ["(?m)^✓ VM\\[6\\] deleted completely\\s*$"]
timeout = 120
