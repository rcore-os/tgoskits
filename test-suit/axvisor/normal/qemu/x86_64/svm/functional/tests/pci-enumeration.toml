timeout = 600

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm start 4"
success_regex = ["(?m)^✓ VM\\[4\\] started successfully\\s*$"]
timeout = 120

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 4"
success_regex = [
    "(?m)^AXVISOR_X86_VPCI_ENUMERATION_PASSED\\s*$",
]

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "\u0018h"
success_regex = ["detached VM\\[4\\] console"]
timeout = 60

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm delete --force 4"
success_regex = ["(?m)^✓ VM\\[4\\] deleted completely\\s*$"]
timeout = 120
