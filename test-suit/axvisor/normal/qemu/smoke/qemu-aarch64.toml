args = [
  "-nographic",
  "-snapshot",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-device",
  "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-aarch64-alpine.img",
  "-append",
  "root=/dev/nvme0n1 rw init=/bin/sh axvisor.vm_start=1,2",
  "-m",
  "8g",
]
fail_regex = [
    "(?m)^VIRTIO_BLK_MOUNT_FAIL:",
    "(?i)I/O error",
    "(?i)filesystem resource is busy",
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)login incorrect",
    "(?i)permission denied",
    "(?m)^(?:echo|cat|rm): (?:can't (?:open|remove) |cannot remove |/tmp/axvisor-nvme-rw:)",
]
timeout = 300
to_bin = true
uefi = false

# Drive the real serial editor; match command output, never its redraw/echo.
[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "echox\u001b[999999999999999999999~\u001b[<0;16;41M\u001b[D\u001b[3~ SHELL_CSI_OK"
success_regex = ['(?m)^SHELL_CSI_OK\s*$']
timeout = 15

[[shell_check_steps]]
shell_cmd = "SHELL_HOME_END_\u001b[Hecho \u001b[FOK"
success_regex = ['(?m)^SHELL_HOME_END_OK\s*$']

[[shell_check_steps]]
# QEMU -nographic consumes Ctrl+A as its escape prefix; double it to send one.
shell_cmd = "discard\u0015SHELL_CTRL_OK wrong\u0017\u0001\u0001echo \u0005tail\u001b[D\u001b[D\u001b[D\u001b[D\u000b"
success_regex = ['(?m)^SHELL_CTRL_OK\s*$']

[[shell_check_steps]]
shell_cmd = "bad-command\u0003ech\t SHELL_COMPLETE_OK"
success_regex = ['(?m)^SHELL_COMPLETE_OK\s*$']

[[shell_check_steps]]
shell_cmd = "ech SHELL_MID_OK\u001b[H\u001b[C\u001b[C\u001b[C\t\u001b[F"
success_regex = ['(?m)^SHELL_MID_OK\s*$']

[[shell_check_steps]]
shell_cmd = "echo SHELL_WORD_OK\u001b[H\u001b[C\u001b[C\u001b[C\t\u001b[F"
success_regex = ['(?m)^SHELL_WORD_OK\s*$']

[[shell_check_steps]]
shell_cmd = "bad-command\u001b[\u0003echo SHELL_CANCEL_OK"
success_regex = ['(?m)^SHELL_CANCEL_OK\s*$']

[[shell_check_steps]]
# Start with a known history before checking numbering, rejection, and clearing.
shell_prefix = "axvisor:/$"
shell_cmd = "history -c"

[[shell_check_steps]]
shell_cmd = "echo AXVISOR_HISTORY_FIRST"
success_regex = ['(?m)^AXVISOR_HISTORY_FIRST\s*$']

[[shell_check_steps]]
shell_cmd = "echo AXVISOR_HISTORY_SECOND"
success_regex = ['(?m)^AXVISOR_HISTORY_SECOND\s*$']

[[shell_check_steps]]
shell_cmd = "history"
success_regex = ['(?m)^\s*1\s+echo AXVISOR_HISTORY_FIRST[ \t\r]*$\r?\n^\s*2\s+echo AXVISOR_HISTORY_SECOND[ \t\r]*$\r?\n^\s*3\s+history[ \t\r]*$']

[[shell_check_steps]]
shell_cmd = "history -c extra"
success_regex = ['(?m)^history: unsupported option or argument[ \t\r]*$\r?\n^Usage: history \[-N\] \[\| grep PATTERN\], or history -c[ \t\r]*$']

[[shell_check_steps]]
shell_cmd = "history"
success_regex = ['(?m)^\s*1\s+echo AXVISOR_HISTORY_FIRST[ \t\r]*$\r?\n^\s*2\s+echo AXVISOR_HISTORY_SECOND[ \t\r]*$\r?\n^\s*3\s+history[ \t\r]*$\r?\n^\s*4\s+history -c extra[ \t\r]*$\r?\n^\s*5\s+history[ \t\r]*$']

[[shell_check_steps]]
shell_cmd = "help"
success_regex = ['(?m)^\s+history\s+Show command history[ \t\r]*$']

[[shell_check_steps]]
shell_cmd = "help history"
success_regex = ['(?m)^Command: history[ \t\r]*$\r?\n^Description: Show command history[ \t\r]*$\r?\n^Usage: history \[-N\] \[\| grep PATTERN\], or history -c[ \t\r]*$\r?\n\r?\n^Options:[ \t\r]*$\r?\n^  -N\s+Show only the last N entries; N is a positive decimal integer[ \t\r]*$\r?\n^  \| grep PATTERN\s+Filter entries by a case-sensitive literal substring[ \t\r]*$\r?\n\r?\n^Flags:[ \t\r]*$\r?\n^  -c\s+Clear command history[ \t\r]*$']

[[shell_check_steps]]
shell_cmd = "history -c"

[[shell_check_steps]]
shell_cmd = "\u001b[Ahis\t"
success_regex = ['(?m)^\s*1\s+history[ \t\r]*$']
fail_regex = ['(?m)^\s*2\s+']

[[shell_check_steps]]
shell_cmd = "echo AXVISOR_HISTORY_REMEMBERED"
success_regex = ['(?m)^AXVISOR_HISTORY_REMEMBERED\s*$']

[[shell_check_steps]]
shell_cmd = "\u001b[A"
success_regex = ['(?m)^AXVISOR_HISTORY_REMEMBERED\s*$']

[[shell_check_steps]]
shell_cmd = "history"
success_regex = ['(?m)^\s*1\s+history[ \t\r]*$\r?\n^\s*2\s+echo AXVISOR_HISTORY_REMEMBERED[ \t\r]*$\r?\n^\s*3\s+history[ \t\r]*$']
fail_regex = ['(?m)^\s*4\s+']

[[shell_check_steps]]
# Exercise bounded listing and the single supported grep filter stage.
shell_prefix = "axvisor:/$"
shell_cmd = "history -c"

[[shell_check_steps]]
shell_cmd = "echo AXVISOR_HISTORY_VM_ALPHA"
success_regex = ['(?m)^AXVISOR_HISTORY_VM_ALPHA\s*$']

[[shell_check_steps]]
shell_cmd = "echo AXVISOR_HISTORY_VM_BETA"
success_regex = ['(?m)^AXVISOR_HISTORY_VM_BETA\s*$']

[[shell_check_steps]]
shell_cmd = "echo axvisor_history_vm_lower"
success_regex = ['(?m)^axvisor_history_vm_lower\s*$']

[[shell_check_steps]]
shell_cmd = "echo 'AXVISOR HISTORY QUOTED TERM'"
success_regex = ['(?m)^AXVISOR HISTORY QUOTED TERM\s*$']

[[shell_check_steps]]
shell_cmd = "history -1"
success_regex = ['(?m)^ {2,4}5  history -1[ \t\r]*$']
fail_regex = ['(?m)^ {2,4}(?:1|2|3|4|6)[ \t]{2}']

[[shell_check_steps]]
shell_cmd = "history -3"
success_regex = ['''(?m)^ {2,4}4  echo 'AXVISOR HISTORY QUOTED TERM'[ \t\r]*$\r?\n^ {2,4}5  history -1[ \t\r]*$\r?\n^ {2,4}6  history -3[ \t\r]*$''']
fail_regex = ['(?m)^ {2,4}(?:1|2|3|7)[ \t]{2}']

[[shell_check_steps]]
shell_cmd = "history -100"
success_regex = ['''(?m)^ {2,4}1  echo AXVISOR_HISTORY_VM_ALPHA[ \t\r]*$\r?\n^ {2,4}2  echo AXVISOR_HISTORY_VM_BETA[ \t\r]*$\r?\n^ {2,4}3  echo axvisor_history_vm_lower[ \t\r]*$\r?\n^ {2,4}4  echo 'AXVISOR HISTORY QUOTED TERM'[ \t\r]*$\r?\n^ {2,4}5  history -1[ \t\r]*$\r?\n^ {2,4}6  history -3[ \t\r]*$\r?\n^ {2,4}7  history -100[ \t\r]*$''']
fail_regex = ['(?m)^ {2,4}8[ \t]{2}']

[[shell_check_steps]]
shell_cmd = "history |grep AXVISOR_HISTORY_VM"
success_regex = ['(?m)^ {2,4}1  echo AXVISOR_HISTORY_VM_ALPHA[ \t\r]*$\r?\n^ {2,4}2  echo AXVISOR_HISTORY_VM_BETA[ \t\r]*$\r?\n^ {2,4}8  history \|grep AXVISOR_HISTORY_VM[ \t\r]*$']
fail_regex = ['(?m)^ {2,4}3[ \t]{2}']

[[shell_check_steps]]
shell_cmd = "history | grep AXVISOR_HISTORY_VM"
success_regex = ['(?m)^ {2,4}1  echo AXVISOR_HISTORY_VM_ALPHA[ \t\r]*$\r?\n^ {2,4}2  echo AXVISOR_HISTORY_VM_BETA[ \t\r]*$\r?\n^ {2,4}8  history \|grep AXVISOR_HISTORY_VM[ \t\r]*$\r?\n^ {2,4}9  history \| grep AXVISOR_HISTORY_VM[ \t\r]*$']
fail_regex = ['(?m)^ {2,4}3[ \t]{2}']

[[shell_check_steps]]
shell_cmd = "history | grep 'AXVISOR HISTORY QUOTED'"
success_regex = ['''(?m)^ {2,4}4  echo 'AXVISOR HISTORY QUOTED TERM'[ \t\r]*$\r?\n^ {2,4}10  history \| grep 'AXVISOR HISTORY QUOTED'[ \t\r]*$''']
fail_regex = ['(?m)^ {2,4}(?:1|2|3|5|6|7|8|9)[ \t]{2}']

[[shell_check_steps]]
# Adjacent quoted segments tokenize to the pattern without putting that
# contiguous text in the raw command, so this filter must print no rows. The
# echo supplies the success condition required alongside fail_regex.
shell_cmd = "history | grep 'AXVISOR''_HISTORY_ABSENT'\necho AXVISOR_HISTORY_EMPTY_FILTER_OK"
success_regex = ['(?m)^AXVISOR_HISTORY_EMPTY_FILTER_OK\s*$']
fail_regex = ['(?m)^(?: {2,4}[0-9]{1,2}[ \t]{2}(?:echo|history)|history:)']

[[shell_check_steps]]
# Taking the last three entries before filtering must leave only this command.
shell_cmd = "history -3 | grep AXVISOR_HISTORY_VM"
success_regex = ['(?m)^ {2,4}13  history -3 \| grep AXVISOR_HISTORY_VM[ \t\r]*$']
fail_regex = ['(?m)^ {2,4}(?:1|2|8|9|10|11|12)[ \t]{2}']

[[shell_check_steps]]
shell_cmd = "history -0"
success_regex = ['''(?m)^history: invalid count '-0'; expected a positive decimal integer[ \t\r]*$''']

[[shell_check_steps]]
shell_cmd = "history -999999999999999999999"
success_regex = ['''(?m)^history: invalid count '-999999999999999999999'; expected a positive decimal integer[ \t\r]*$''']

[[shell_check_steps]]
shell_cmd = "history | grep"
success_regex = ['''(?m)^history: grep requires exactly one pattern; additional arguments or pipelines are not supported[ \t\r]*$''']

[[shell_check_steps]]
shell_cmd = "history | grep a b"
success_regex = ['''(?m)^history: grep requires exactly one pattern; additional arguments or pipelines are not supported[ \t\r]*$''']

[[shell_check_steps]]
shell_cmd = "history | grep -i AXVISOR"
success_regex = ['''(?m)^history: grep options are not supported: '-i'[ \t\r]*$''']

[[shell_check_steps]]
shell_cmd = "history | foo bar"
success_regex = ['''(?m)^history: unsupported filter command 'foo'; only grep is supported[ \t\r]*$''']

[[shell_check_steps]]
shell_cmd = "history | grep a | grep b"
success_regex = ['''(?m)^history: grep requires exactly one pattern; additional arguments or pipelines are not supported[ \t\r]*$''']

[[shell_check_steps]]
shell_cmd = "history -c | grep AXVISOR"
success_regex = ['''(?m)^history: cannot combine -c with a grep filter[ \t\r]*$''']

[[shell_check_steps]]
shell_cmd = "history -1"
success_regex = ['(?m)^ {2,4}22  history -1[ \t\r]*$']
fail_regex = ['(?m)^ {2,4}(?:[1-9]|1[0-9]|2[0-1])[ \t]{2}']

[[shell_check_steps]]
shell_cmd = "echo 'AXVISOR HISTORY PIPE | TERM'"
success_regex = ['(?m)^AXVISOR HISTORY PIPE \| TERM\s*$']

[[shell_check_steps]]
shell_cmd = "history | grep 'PIPE | TERM'"
success_regex = ['''(?m)^ {2,4}23  echo 'AXVISOR HISTORY PIPE \| TERM'[ \t\r]*$\r?\n^ {2,4}24  history \| grep 'PIPE \| TERM'[ \t\r]*$''']
fail_regex = ['(?m)^ {2,4}(?:[1-9]|1[0-9]|2[0-2])[ \t]{2}']

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = """echo 'AXVISOR SHLEX' "" EMPTY"""
success_regex = ['(?m)^AXVISOR SHLEX  EMPTY\s*$']

[[shell_check_steps]]
shell_cmd = "'help' vm start"
success_regex = ['(?m)^Command: vm start\s*$']

[[shell_check_steps]]
shell_cmd = 'echo "unterminated'
success_regex = ['(?m)^Error: Invalid command syntax\s*$']

[[shell_check_steps]]
shell_cmd = "echo AXVISOR_NVME_RW_PAYLOAD > /tmp/axvisor-nvme-rw"

[[shell_check_steps]]
shell_cmd = "cat /tmp/axvisor-nvme-r\t"
success_regex = ['(?m)^AXVISOR_NVME_RW_PAYLOAD\s*$']

[[shell_check_steps]]
shell_cmd = "rm -f /tmp/axvisor-nvme-rw"

[[shell_check_steps]]
shell_cmd = "echo AXVISOR_NVME_ROOTFS_RW_PASSED"
success_regex = ['(?m)^AXVISOR_NVME_ROOTFS_RW_PASSED\s*$']

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"
success_regex = ['(?m)^test pass!\s*$']

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "mkdir -p /mnt/v"

[[shell_check_steps]]
shell_cmd = "mount -t ext4 -o rw /dev/vda /mnt/v"
success_regex = ['EXT4-fs \(vda\): mounted filesystem .* r/w ']
fail_regex = ['mount:']
timeout = 60

[[shell_check_steps]]
shell_cmd = "cat /mnt/v/etc/alpine-release"
success_regex = ['(?m)^3\.23\.6\s*$']
fail_regex = ['cat:']
timeout = 60

[[shell_check_steps]]
shell_cmd = "mkdir -p /tmp /mnt/v/tmp"

[[shell_check_steps]]
shell_cmd = "dd if=/dev/zero of=/tmp/av-ref bs=4096 count=1024 2>/tmp/av-dd-ref.log; echo AXVISOR_REF_STATUS=$?"
success_regex = ['(?m)^AXVISOR_REF_STATUS=0\s*$']
fail_regex = ['(?m)^AXVISOR_REF_STATUS=[^0]\s*$']
timeout = 120

[[shell_check_steps]]
shell_cmd = "dd if=/tmp/av-ref of=/mnt/v/tmp/av-rw bs=4096 conv=fsync 2>/tmp/av-dd-copy.log; echo AXVISOR_COPY_STATUS=$?"
success_regex = ['(?m)^AXVISOR_COPY_STATUS=0\s*$']
fail_regex = ['(?m)^AXVISOR_COPY_STATUS=[^0]\s*$']
timeout = 120

[[shell_check_steps]]
shell_cmd = "wc -c < /mnt/v/tmp/av-rw"
success_regex = ['(?m)^4194304\s*$']
timeout = 60

[[shell_check_steps]]
shell_cmd = "cmp /tmp/av-ref /mnt/v/tmp/av-rw >/dev/null 2>&1; echo AXVISOR_CMP_STATUS=$?"
success_regex = ['(?m)^AXVISOR_CMP_STATUS=0\s*$']
fail_regex = ['(?m)^AXVISOR_CMP_STATUS=[^0]\s*$']
timeout = 60

[[shell_check_steps]]
shell_cmd = "rm -f /tmp/av-ref /tmp/av-dd-ref.log /tmp/av-dd-copy.log /mnt/v/tmp/av-rw"

[[shell_check_steps]]
shell_cmd = "echo AXVISOR_VIRTIO_BLK_RW_PASSED"
success_regex = ['(?m)^AXVISOR_VIRTIO_BLK_RW_PASSED\s*$']

[[shell_check_steps]]
shell_cmd = 'printf VM1 > /mnt/v/tmp/axvisor-vm1-isolation && sync && test "$(cat /mnt/v/tmp/axvisor-vm1-isolation)" = VM1; echo AXVISOR_VM1_MARKER_STATUS=$?'
success_regex = ['(?m)^AXVISOR_VM1_MARKER_STATUS=0\s*$']
fail_regex = ['(?m)^AXVISOR_VM1_MARKER_STATUS=[^0]\s*$']

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "\u0018h"
success_regex = ['detached VM\[1\] console']
timeout = 30

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 2"
success_regex = ['Attached VM\[2\] console']
timeout = 30

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "mkdir -p /mnt/v"

[[shell_check_steps]]
shell_cmd = "mount -t ext4 -o rw /dev/vda /mnt/v"
success_regex = ['EXT4-fs \(vda\): mounted filesystem .* r/w ']
fail_regex = ['mount:']
timeout = 60

[[shell_check_steps]]
shell_cmd = "cat /mnt/v/etc/alpine-release"
success_regex = ['(?m)^3\.23\.6\s*$']
fail_regex = ['cat:']
timeout = 60

[[shell_check_steps]]
shell_cmd = "test ! -e /mnt/v/tmp/axvisor-vm1-isolation; echo AXVISOR_VM2_ISOLATED=$?"
success_regex = ['(?m)^AXVISOR_VM2_ISOLATED=0\s*$']
fail_regex = ['(?m)^AXVISOR_VM2_ISOLATED=[^0]\s*$']
