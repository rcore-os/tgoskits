args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-device",
  "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
  "-append",
  "root=/dev/nvme0n1 rw init=/bin/sh",
  "-m",
  "8g",
]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "(?i)login incorrect",
  "(?i)permission denied",
  "(?m)^(?:echo|cat|rm):",
]
success_regex = [
  "(?m)^AXVISOR SHLEX  EMPTY\\s*$",
  "(?m)^Command: vm start\\s*$",
  "(?m)^Error: Invalid command syntax\\s*$",
  "(?m)^AXVISOR_NVME_RW_PAYLOAD\\s*$",
  "(?m)^AXVISOR_NVME_ROOTFS_RW_PASSED\\s*$",
]
shell_prefix = "axvisor:/$"
shell_init_cmd = """
echo 'AXVISOR SHLEX' "" EMPTY
'help' vm start
echo "unterminated
echo AXVISOR_NVME_RW_PAYLOAD > /tmp/axvisor-nvme-rw
cat /tmp/axvisor-nvme-rw
rm -f /tmp/axvisor-nvme-rw
echo AXVISOR_NVME_ROOTFS_RW_PASSED
"""
to_bin = true
uefi = false
