args = [
  "-nographic",
  "-snapshot",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-device",
  "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
  "-append",
  "root=/dev/nvme0n1 rw init=/bin/sh",
  "-m",
  "8g",
]
fail_regex = [
    "(?m)^VIRTIO_BLK_MOUNT_FAIL:",
    "(?i)I/O error",
    "(?i)filesystem resource is busy",
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)login incorrect",
    "(?i)permission denied",
    "(?m)^(?:echo|cat|rm): (?:can't (?:open|remove) |cannot remove |/tmp/axvisor-nvme-rw:)",
]
timeout = 300
to_bin = true
uefi = false

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = """echo 'AXVISOR SHLEX' "" EMPTY"""
success_regex = ['(?m)^AXVISOR SHLEX  EMPTY\s*$']

[[shell_check_steps]]
shell_cmd = "'help' vm start"
success_regex = ['(?m)^Command: vm start\s*$']

[[shell_check_steps]]
shell_cmd = 'echo "unterminated'
success_regex = ['(?m)^Error: Invalid command syntax\s*$']

[[shell_check_steps]]
shell_cmd = "echo AXVISOR_NVME_RW_PAYLOAD > /tmp/axvisor-nvme-rw"

[[shell_check_steps]]
shell_cmd = "cat /tmp/axvisor-nvme-rw"
success_regex = ['(?m)^AXVISOR_NVME_RW_PAYLOAD\s*$']

[[shell_check_steps]]
shell_cmd = "rm -f /tmp/axvisor-nvme-rw"

[[shell_check_steps]]
shell_cmd = "echo AXVISOR_NVME_ROOTFS_RW_PASSED"
success_regex = ['(?m)^AXVISOR_NVME_ROOTFS_RW_PASSED\s*$']

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"
success_regex = ['(?m)^test pass!\s*$']

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "mkdir -p /mnt/v"

[[shell_check_steps]]
shell_cmd = "mount -t ext4 -o rw /dev/vda /mnt/v"
success_regex = ['EXT4-fs \(vda\): mounted filesystem .* r/w ']
fail_regex = ['mount:']
timeout = 60

[[shell_check_steps]]
shell_cmd = "cat /mnt/v/etc/alpine-release"
success_regex = ['(?m)^3\.23\.5\s*$']
fail_regex = ['cat:']
timeout = 60

[[shell_check_steps]]
shell_cmd = "mkdir -p /tmp /mnt/v/tmp"

[[shell_check_steps]]
shell_cmd = "dd if=/dev/zero of=/tmp/av-ref bs=4096 count=1024 2>/tmp/av-dd-ref.log; echo AXVISOR_REF_STATUS=$?"
success_regex = ['(?m)^AXVISOR_REF_STATUS=0\s*$']
fail_regex = ['(?m)^AXVISOR_REF_STATUS=[^0]\s*$']
timeout = 120

[[shell_check_steps]]
shell_cmd = "dd if=/tmp/av-ref of=/mnt/v/tmp/av-rw bs=4096 conv=fsync 2>/tmp/av-dd-copy.log; echo AXVISOR_COPY_STATUS=$?"
success_regex = ['(?m)^AXVISOR_COPY_STATUS=0\s*$']
fail_regex = ['(?m)^AXVISOR_COPY_STATUS=[^0]\s*$']
timeout = 120

[[shell_check_steps]]
shell_cmd = "wc -c < /mnt/v/tmp/av-rw"
success_regex = ['(?m)^4194304\s*$']
timeout = 60

[[shell_check_steps]]
shell_cmd = "cmp /tmp/av-ref /mnt/v/tmp/av-rw >/dev/null 2>&1; echo AXVISOR_CMP_STATUS=$?"
success_regex = ['(?m)^AXVISOR_CMP_STATUS=0\s*$']
fail_regex = ['(?m)^AXVISOR_CMP_STATUS=[^0]\s*$']
timeout = 60

[[shell_check_steps]]
shell_cmd = "rm -f /tmp/av-ref /tmp/av-dd-ref.log /tmp/av-dd-copy.log /mnt/v/tmp/av-rw"

[[shell_check_steps]]
shell_cmd = "echo AXVISOR_VIRTIO_BLK_RW_PASSED"
success_regex = ['(?m)^AXVISOR_VIRTIO_BLK_RW_PASSED\s*$']
