args = [
  "-machine",
  "virt",
  "-cpu",
  "la464",
  "-m",
  "2G",
  "-smp",
  "2",
  "-nographic",
  "-serial",
  "mon:stdio",
  "-no-reboot",
  "-device",
  "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-loongarch64-alpine.img",
]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "(?i)login incorrect",
  "(?i)permission denied",
  "(?i)failed to initialize guest VM",
  "(?m)^(?:echo|cat|rm):\\s",
]
timeout = 300
to_bin = true
uefi = true

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = """
echo AXVISOR_NVME_RW_PAYLOAD > /tmp/axvisor-nvme-rw
cat /tmp/axvisor-nvme-rw
rm -f /tmp/axvisor-nvme-rw
echo AXVISOR_NVME_ROOTFS_RW_PASSED
"""
success_regex = ["(?m)^AXVISOR_NVME_RW_PAYLOAD\\s*$", "(?m)^AXVISOR_NVME_ROOTFS_RW_PASSED\\s*$"]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "mkdir -p /mnt/v"

[[shell_check_steps]]
shell_cmd = "mount -t ext4 -o ro /dev/vda /mnt/v; echo AXVISOR_MOUNT_STATUS=$?"
success_regex = ["(?m)^AXVISOR_MOUNT_STATUS=0\\s*$"]
fail_regex = ["(?m)^AXVISOR_MOUNT_STATUS=[^0]\\s*$", "mount:"]
timeout = 60

[[shell_check_steps]]
shell_cmd = "grep -q ' /mnt/v ext4 ro' /proc/mounts; echo AXVISOR_RO_STATUS=$?"
success_regex = ["(?m)^AXVISOR_RO_STATUS=0\\s*$"]
fail_regex = ["(?m)^AXVISOR_RO_STATUS=[^0]\\s*$"]
timeout = 60

[[shell_check_steps]]
shell_cmd = "cat /mnt/v/etc/alpine-release"
success_regex = ["(?m)^3\\.23\\.5\\s*$"]
fail_regex = ["cat:"]
timeout = 60

[[shell_check_steps]]
shell_cmd = "echo AXVISOR_VIRTIO_BLK_MOUNT_RO_PASSED"
success_regex = ["(?m)^AXVISOR_VIRTIO_BLK_MOUNT_RO_PASSED\\s*$"]
