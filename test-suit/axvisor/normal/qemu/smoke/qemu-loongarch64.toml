args = [
  "-machine",
  "virt",
  "-cpu",
  "la464",
  "-m",
  "2G",
  "-smp",
  "2",
  "-nographic",
  "-serial",
  "mon:stdio",
  "-no-reboot",
  "-device",
  "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-loongarch64-alpine.img",
]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "(?i)login incorrect",
  "(?i)permission denied",
  "(?i)failed to initialize guest VM",
  "(?m)^(?:echo|cat|rm):\\s",
]
timeout = 300
to_bin = true
uefi = true

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = """
echo AXVISOR_NVME_RW_PAYLOAD > /tmp/axvisor-nvme-rw
cat /tmp/axvisor-nvme-rw
rm -f /tmp/axvisor-nvme-rw
echo AXVISOR_NVME_ROOTFS_RW_PASSED
"""
success_regex = ["(?m)^AXVISOR_NVME_RW_PAYLOAD\\s*$", "(?m)^AXVISOR_NVME_ROOTFS_RW_PASSED\\s*$"]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"
success_regex = [
  "(?m)^3\\.23\\.5\\s*$",
  "(?m)^AXVISOR_PCI_BLOCK_MOUNT_PASSED\\s*$",
]
fail_regex = ["(?m)^AXVISOR_PCI_BLOCK_MOUNT_FAILED\\s*$", "mount:"]
timeout = 60
