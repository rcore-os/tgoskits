args = [
  "-nographic",
  "-cpu",
  "rv64",
  "-machine",
  "virt",
  "-bios",
  "default",
  "-smp",
  "4",
  "-device",
  "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-riscv64-alpine.img",
  "-append",
  "root=/dev/nvme0n1 rw init=/bin/sh",
  "-m",
  "4G",
]
fail_regex = [
  "(?m)^VIRTIO_BLK_MOUNT_FAIL:",
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "(?i)login incorrect",
  "(?i)permission denied",
  "(?m)^(?:echo|cat|rm):\\s",
]
timeout = 300
to_bin = true
uefi = false

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = '''
echo AXVISOR_NVME_RW_PAYLOAD > /tmp/axvisor-nvme-rw
cat /tmp/axvisor-nvme-rw
rm -f /tmp/axvisor-nvme-rw
echo AXVISOR_NVME_ROOTFS_RW_PASSED
'''
success_regex = ['(?m)^AXVISOR_NVME_ROOTFS_RW_PASSED\s*$']

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"
success_regex = ['(?m)^test pass!\s*$']

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "mkdir -p /mnt/v"

[[shell_check_steps]]
shell_cmd = "mount -t ext4 -o ro /dev/vda /mnt/v"
success_regex = ['EXT4-fs \(vda\): mounted filesystem .* ro ']
fail_regex = ['mount:']
timeout = 60

[[shell_check_steps]]
shell_cmd = "cat /mnt/v/etc/alpine-release"
success_regex = ['(?m)^3\.23\.6\s*$']
fail_regex = ['cat:']
timeout = 60

[[shell_check_steps]]
shell_cmd = "mount -o remount,rw /mnt/v; echo AXVISOR_VM1_REMOUNT_STATUS=$?"
success_regex = ['(?m)^AXVISOR_VM1_REMOUNT_STATUS=0\s*$']
fail_regex = ['(?m)^AXVISOR_VM1_REMOUNT_STATUS=[^0]\s*$']

[[shell_check_steps]]
shell_cmd = 'mkdir -p /mnt/v/tmp && printf VM1 > /mnt/v/tmp/axvisor-vm1-isolation && sync && test "$(cat /mnt/v/tmp/axvisor-vm1-isolation)" = VM1; echo AXVISOR_VM1_MARKER_STATUS=$?'
success_regex = ['(?m)^AXVISOR_VM1_MARKER_STATUS=0\s*$']
fail_regex = ['(?m)^AXVISOR_VM1_MARKER_STATUS=[^0]\s*$']

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "\u0018h"
success_regex = ['detached VM\[1\] console']
timeout = 30

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 2"
success_regex = ['Attached VM\[2\] console']
timeout = 30

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "mkdir -p /mnt/v"

[[shell_check_steps]]
shell_cmd = "mount -t ext4 -o ro /dev/vda /mnt/v"
success_regex = ['EXT4-fs \(vda\): mounted filesystem .* ro ']
fail_regex = ['mount:']
timeout = 60

[[shell_check_steps]]
shell_cmd = "cat /mnt/v/etc/alpine-release"
success_regex = ['(?m)^3\.23\.6\s*$']
fail_regex = ['cat:']
timeout = 60

[[shell_check_steps]]
shell_cmd = "test ! -e /mnt/v/tmp/axvisor-vm1-isolation; echo AXVISOR_VM2_ISOLATED=$?"
success_regex = ['(?m)^AXVISOR_VM2_ISOLATED=0\s*$']
fail_regex = ['(?m)^AXVISOR_VM2_ISOLATED=[^0]\s*$']
