timeout = 300

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm list"
success_regex = [
    "(?m)^VM ID\\s+NAME\\s+STATUS",
]
timeout = 60

[[shell_check_steps]]
shell_cmd = "vm suspend 1"
success_regex = [
    "(?m)^\\[.*VM\\[1\\] paused\\s*$",
    "(?m)^✓ VM\\[1\\] suspended\\s*$",
    "(?m)^  1/1 VCpu task\\(s\\) parked at the VMExit boundary\\s*$",
]
timeout = 60

[[shell_check_steps]]
shell_cmd = "vm resume 1"
success_regex = [
    "(?m)^\\[.*VM\\[1\\] resumed\\b",
    "(?m)^✓ VM\\[1\\] resumed successfully\\s*$",
]
timeout = 60

[[shell_check_steps]]
shell_cmd = "echo CONSOLE_INTERLEAVE_OK"
success_regex = [
    "(?m)^CONSOLE_INTERLEAVE_OK\\s*$",
]
timeout = 30
