timeout = 300

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm show --full 1"
success_regex = [
    "(?m)^=== VM Details: 1 ===\\s*$",
    "(?m)^VCPU Details:\\s*$",
]
timeout = 60

[[shell_check_steps]]
shell_cmd = "help"
success_regex = [
    "(?m)^ArceOS Shell - Available Commands:\\s*$",
]
timeout = 30

[[shell_check_steps]]
shell_cmd = "vm list"
success_regex = [
    "(?m)^VM ID\\s+NAME\\s+STATUS",
]
timeout = 30

[[shell_check_steps]]
shell_cmd = "vm console 1"
success_regex = [
    "(?m)^test pass!\\s*$",
]
timeout = 120

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "echo CONSOLE_ATOMIC_OUTPUT_OK"
success_regex = [
    "(?m)^CONSOLE_ATOMIC_OUTPUT_OK\\s*$",
]
timeout = 30
