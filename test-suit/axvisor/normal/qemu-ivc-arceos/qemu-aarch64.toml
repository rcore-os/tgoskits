args = [
    "-nographic",
    "-cpu",
    "cortex-a72",
    "-machine",
    "virt,virtualization=on,gic-version=3",
    "-smp",
    "4",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-device",
    "virtio-blk-device,drive=guestdisk",
    "-drive",
    "id=guestdisk,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-append",
    "root=/dev/nvme0n1 rw init=/bin/sh",
    "-m",
    "8g",
]
timeout = 300
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)kernel panic",
    "(?i)unhandled page fault",
    "(?i)page fault",
    "VM\\[\\d+\\] boot failed",
    "ivc publish failed",
    "ivc subscribe failed",
    "ivc validation failed",
    "ivc recv error",
    "ivc send error",
]
to_bin = true
uefi = false

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 2"

[[shell_check_steps]]
# Both ArceOS tasks must finish after sending all Data and the final ACK.
success_regex = [
    "(?m)^(?:\\x1b\\[[0-9;]*m)*(?:\\[VM 2\\] )?ivc subscriber full-duplex demo complete\\s*$",
]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"

[[shell_check_steps]]
success_regex = [
    "(?m)^(?:\\x1b\\[[0-9;]*m)*(?:\\[VM 1\\] )?ivc ack seq=5 msg=ack from arceos subscriber\\s*$",
]
