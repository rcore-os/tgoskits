# Vm base info configs
#
[base]
# Guest vm id.
id = 2
# Guest vm name.
name = "arceos-ivc-subscriber"
# Virtualization type.
# The subscriber needs no host physical devices; the publisher owns their SPI routes.
guest_type = "virtualized"
# The number of virtual CPUs.
cpu_num = 1
# Guest vm physical cpu ids.
phys_cpu_ids = [1]

#
# Vm kernel configs
#
[kernel]
# The entry point of the kernel image.
entry_point = 0x8020_0000
# Built from this workspace before staging guest assets; never use the rootfs copy.
kernel_path = "${workspace}/target/aarch64-unknown-linux-musl/release/arceos-ivc-subscriber.bin"
# The load address of the kernel image.
kernel_load_addr = 0x8020_0000
# The load address of the device tree blob (DTB).
dtb_load_addr = 0x8000_0000

# Memory regions with format (`base_paddr`, `size`, `flags`, `map_type`).
# For `map_type`, 0 means `MAP_ALLOC`, 1 means `MAP_IDENTICAL`, 2 means `MAP_RESERVED`.
memory_regions = [
  [0x8000_0000, 0x4000_0000, 0x7, 1], # System RAM 1G MAP_IDENTICAL
]

#
# Device specifications
#
[devices]
# Devices that are not desired to be passed through to the guest.
disabled = [
  { path = "/virtio_mmio@a003000" },
  { path = "/virtio_mmio@a003200" },
  { path = "/virtio_mmio@a003400" },
  { path = "/virtio_mmio@a003600" },
  { path = "/virtio_mmio@a003800" },
  { path = "/virtio_mmio@a003a00" },
  { path = "/virtio_mmio@a003c00" },
  { path = "/virtio_mmio@a003e00" },
  { path = "/pcie@10000000" },
]

# Virtual devices.
[[devices.virtual]]
id = "ivc0"
model = "ivc-channel"
