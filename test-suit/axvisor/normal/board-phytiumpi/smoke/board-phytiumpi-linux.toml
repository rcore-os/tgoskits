board_type = "PhytiumPi"
cmdline = "root=/dev/mmcblk0p1 rootfstype=ext4 rootwait rw axvisor.vm_start=1"
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "(?i)login incorrect",
  "(?i)permission denied",
]
shell_check_steps = [
  { shell_prefix = "axvisor:/$", shell_cmd = "vm console 1", success_regex = ["(?m)^phytiumpi login:"], fail_regex = ["(?i)\\bpanic(?:ked)?\\b", "(?i)kernel panic", "(?i)login incorrect", "(?i)permission denied"] },
]
timeout = 300
