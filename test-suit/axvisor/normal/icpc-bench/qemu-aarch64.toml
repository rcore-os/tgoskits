args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-device",
  "virtio-blk-device,drive=disk0",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
  "-append",
  "root=/dev/vda rw init=/bin/sh",
  "-m",
  "8g",
]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "ICPC_PEER_ETH_FAIL",
  "icpc-bench: failures=",
  "(?m)^icpc-bench fail\\s*$",
]
success_regex = [
  "(?m)^ICPC_BENCH_SUMMARY msgs=20 ok=20 fail=0\\b",
  "(?m)^icpc-bench pass\\s*$",
]
shell_prefix = "~ #"
shell_init_cmd = "mount -t proc proc /proc; mount -t sysfs sys /sys; echo 1 > /proc/sys/net/ipv6/conf/all/disable_ipv6; ip link set eth0 up; ip addr flush dev eth0; ip addr add 10.0.9.2/24 dev eth0; sleep 8; ping -c 1 -W 5 10.0.9.3 >/dev/null 2>&1 || true; /usr/local/bin/icpc-bench 20 && echo 'icpc-bench pass' || echo 'icpc-bench fail'"
to_bin = true
uefi = false
timeout = 120
