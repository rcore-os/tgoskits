# Converged HTTP control-plane build for the axum management API test
# (http-control-plane).
# `no-auto-start` registers the default VM in Ready for HTTP start control.
# Boot files are packaged into the host initramfs, installed on the NVMe root,
# and reused by the HTTP delete/recreate/start resource lifecycle regression.
features = [
    "http-axum",
    "ax-driver/nvme",
    "no-auto-start",
]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = ["test-suit/axvisor/normal/qemu-http-control-plane/http-control-plane/vm-memory.toml"]

# Control-plane auth + bind. The mutating routes require
# `Authorization: Bearer <token>`; the typed probe sends this same token
# (`[host_http_probe] token`), and hostfwd reachability requires binding all
# interfaces. The BusyBox initramfs is generated from the managed rootfs into
# the path the fixture's `ramdisk_path` points at.
[env]
AXVM_HTTP_TOKEN = "axvisor-http-test-token"
AXVM_HTTP_BIND = "0.0.0.0:8080"
