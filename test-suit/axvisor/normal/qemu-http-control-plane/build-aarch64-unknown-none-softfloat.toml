# Converged HTTP control-plane build for the axum management API test
# (http-control-plane).
# `no-auto-start` keeps the default VM (`http-control-plane/vm-linux-alpine.toml`)
# in `Ready` (registered but not booted); the typed probe drives the full
# lifecycle through the HTTP control API. `fs` + `ax-driver/nvme` are what make
# the guest possible: the hypervisor reads the guest kernel from its own
# filesystem on the QEMU NVMe disk, and the guest roots from an ext4 image in
# that same filesystem. Nothing about the guest is embedded in the hypervisor
# binary. CI runs `cargo xtask image pull` before the test to provision the QEMU
# images and the managed rootfs.
features = [
    "http-axum",
    "ax-driver/nvme",
    "fs",
    "no-auto-start",
]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = ["test-suit/axvisor/normal/qemu-http-control-plane/http-control-plane/vm-linux-alpine.toml"]

# Control-plane bind. The control plane has no authentication, so no token is
# configured; hostfwd reachability requires binding all interfaces.
[env]
AXVM_HTTP_BIND = "0.0.0.0:8080"
