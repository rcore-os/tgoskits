args = [
    "-nographic",
    "-cpu",
    "cortex-a72",
    "-machine",
    "virt,virtualization=on,gic-version=3",
    "-smp",
    "4",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-device",
    "virtio-blk-device,drive=guestdisk",
    "-drive",
    "id=guestdisk,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-append",
    "root=/dev/nvme0n1 rw init=/bin/sh",
    "-m",
    "8g",
]
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)kernel panic",
    "(?i)unhandled page fault",
    "(?i)page fault",
    "ivc publish failed",
    "(?m)^linux ivc demo failed\\s*$",
]
to_bin = true
uefi = false

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 2"
success_regex = ["(?m)^(?:\\x1b\\[[0-9;]*m)*linux ivc demo pass\\s*$"]
fail_regex = ["(?m)^linux ivc demo failed\\s*$"]
