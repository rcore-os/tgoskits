[base]
id = 1
name = "linux-7.1-loongson-3a6000"
guest_type = "virtualized"
cpu_num = 1
phys_cpu_ids = [0]

[kernel]
kernel_path = "${workspace}/target/axbuild/loongson-3a6000/vmlinux"
ramdisk_path = "${workspace}/target/axbuild/images/initramfs-loongarch64-busybox.cpio.gz/initramfs-loongarch64-busybox.cpio.gz"
ramdisk_load_addr = 0x0800_0000
boot_protocol = "direct"
cmdline = "console=ttyS0,115200 earlycon=uart8250,mmio,0x1fe001e0,115200 rdinit=/init devtmpfs.mount=1 nokaslr swiotlb=1024 pci=nomsi"
memory_regions = [
  [0x0000_0000, 0x1000_0000, 0x7, 0],
  [0x8000_0000, 0x3000_0000, 0x7, 0],
]

[devices]
[[devices.virtual]]
id = "virtblk0"
model = "virtio-blk"
transport = "pci"
path = "${workspace}/target/axbuild/loongson-3a6000/block.img"
filesystem = "ext4"
