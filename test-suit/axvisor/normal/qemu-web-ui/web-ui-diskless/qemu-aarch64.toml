# Diskless dashboard verification: same feature build as the NVMe case, but no
# host root disk is attached and no `root=` is requested, so Axvisor keeps the
# initramfs memory root and must serve `/guest/builtin/web-ui` straight from it.
args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "2",
  "-m",
  "512M",
]
# Dashboard verification via the case's host-side probe asset. `[host_http_probe]`
# makes the runner append hostfwd netdev + virtio-net-pci device and execute the
# probe asset (`http_probe.py`, next to this file) over real TCP. The asset
# asserts the dashboard served from the memory root (shell, full hashed-asset
# graph, CSP/cache headers, no SPA catch-all, the manifest, and the management
# lane), then quits QEMU over QMP; the runner collects the asset's exit code as
# the verdict. `success_regex` is empty because the probe result, not serial
# output, is the verdict; a panic still fails via `fail_regex`.
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
]
success_regex = []
timeout = 180
to_bin = true
uefi = false

[host_http_probe]
request_timeout_secs = 15
