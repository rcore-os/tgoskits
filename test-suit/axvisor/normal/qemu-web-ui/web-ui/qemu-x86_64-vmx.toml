cmdline = "root=/dev/nvme0n1 rw"
args = [
  "-nographic",
  "-cpu", "host",
  "-machine", "q35",
  "-smp", "2",
  "-accel", "kvm",
  "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
  "-drive", "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-x86_64-alpine.img",
  "-m", "2G",
]
fail_regex = ["(?i)\\bpanic(?:ked)?\\b", "(?i)kernel panic"]
success_regex = []
timeout = 600
to_bin = true
uefi = true

[host_http_probe]
nic_model = "e1000"
request_timeout_secs = 30
probe_script = "default_guest_probe.py"
