# Guest #3 of a three-guest browser-console layout.
#
# ArceOS, read from `/guest/arceos/arceos-qemu` in the hypervisor's own
# filesystem (`image_location = "fs"`): the case exists to give the dashboard
# three independent guest consoles at once, and a kernel that prints a banner and
# exits gives it three honest console lanes with no disk, no userland and nothing
# to keep alive. Only `base.id` / `name` / `phys_cpu_ids` differ between the
# three, so each guest is independent of the other two.
#
# `virtualized` with no passthrough devices keeps the guest's platform devices
# virtual. A passthrough guest makes the hypervisor hand over its own filesystem,
# and this case has to keep reading guest kernels from that filesystem.
[base]
id = 3
name = "guest-3"
guest_type = "virtualized"
cpu_num = 1
phys_cpu_ids = [3]

#
# Vm kernel configs
#
[kernel]
# The entry point of the kernel image.
entry_point = 0x8020_0000
# The location of image: "fs" reads the kernel from the guest filesystem.
image_location = "fs"
# The path of the kernel image inside the hypervisor filesystem.
kernel_path = "/guest/arceos/arceos-qemu"
# The load address of the kernel image.
kernel_load_addr = 0x8020_0000
# The load address of the device tree blob (DTB).
dtb_load_addr = 0x8000_0000

# Memory regions with format (`base_paddr`, `size`, `flags`, `map_type`).
# MAP_ALLOC (0) maps guest GPA 0x80000000 to hypervisor-allocated host pages.
memory_regions = [
  [0x8000_0000, 0x1000_0000, 0x7, 0], # System RAM 256M MAP_ALLOC
]

#
# Device specifications
#

# Physical-device selection. Virtual platform devices are machine-owned.
[devices]
passthrough = []
disabled = []
