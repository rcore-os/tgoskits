board_type = "BananaPi-K3"
kernel_load_addr = "0x102200000"
fit_load_addr = "0x140000000"
bootm_addr = "0x140000000"
# Cached copy of /guest/axvisor-host.cpio.gz from the board. The FIT supplies
# this memory root; guest paths remain /guest/linux and /guest/starry.
initramfs = "${workspace}/target/axbuild/board-assets/bananapi-k3/host-root.cpio.gz"
cmdline = "earlycon=sbi axvisor.vm_start=1,2"
timeout = 300
fail_regex = [
    '(?i)\bpanic(?:ked)?\b',
    'failed to start selected builtin VMs',
    'vCPU hardware attempt failed',
    '(?m)^K3_MULTI_GUEST_FAILED\s*$',
]
uboot_cmd = [
    'setexpr.l sm10_dline *0xd4282bf0',
    'setexpr sm10_dline $sm10_dline "|" 0x10001',
    'mw.l 0xd4282bf0 $sm10_dline 1',
    'setenv tftpwindowsize 1 && setenv tftpblocksize 1024',
    'setenv netretry no && setenv autoload no && dhcp && setenv autoload yes',
]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"
success_regex = ['Attached VM\[1\] console']

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = '''
if test "$(/bin/busybox uname -s)" = Linux && test "$(/bin/busybox uname -m)" = riscv64 && test "$(/bin/busybox cat /sys/devices/system/cpu/online)" = 0-1; then
    echo K3_LINUX_"READY"
else
    echo K3_MULTI_GUEST_"FAILED"
fi
'''
success_regex = ['(?m)^K3_LINUX_READY\s*$']

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "\u0018h"
success_regex = ['detached VM\[1\] console']

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 2"
success_regex = ['Attached VM\[2\] console']

[[shell_check_steps]]
shell_prefix = "starry-bpi> "
shell_cmd = '''
if test "$(/bin/busybox uname -m)" = riscv64 && test "$(/bin/busybox cat /sys/devices/system/cpu/online)" = 0-1; then
    echo K3_STARRY_"READY"
else
    echo K3_MULTI_GUEST_"FAILED"
fi
'''
success_regex = ['(?m)^K3_STARRY_READY\s*$']

[[shell_check_steps]]
shell_prefix = "starry-bpi> "
shell_cmd = "\u0018h"
success_regex = ['detached VM\[2\] console']

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"

# Reattaching does not redraw the guest prompt. Send after the attach marker.
[[shell_check_steps]]
shell_prefix = "Attached VM[1] console"
shell_cmd = 'echo K3_MULTI_GUEST_"PASSED"'
success_regex = ['(?m)^K3_MULTI_GUEST_PASSED\s*$']

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "\u0018h"
success_regex = ['detached VM\[1\] console']
