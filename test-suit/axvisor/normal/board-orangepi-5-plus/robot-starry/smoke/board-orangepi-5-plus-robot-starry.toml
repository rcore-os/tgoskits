board_type = "OrangePi-5-Plus-robot"
# Trigger while login is still printing its environment. Sending the command
# also sends a newline, so the shell is actively woken instead of relying on a
# prompt with no trailing newline.
shell_prefix = "HOSTNAME=starry"
shell_init_cmd = '''
marker=ROBOT_CI
cd /home/orangepi/robot/aka-rk3588 &&
./run_robot_ci_once.sh 15.0 || {
  status=$?
  echo "[${marker}] HARNESS=FAIL target=starry-guest status=${status}"
}
'''
success_regex = [
  '(?m)^\[ROBOT_CI\] RESULT=PASS attempts=[12]\s*$',
]
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  "Failed to initialize guest VM",
  '(?i)segmentation fault',
  '(?i)SIGSEGV',
  "exit with code: 139",
  '(?m)^\[ROBOT_CI\] RESULT=FAIL .*$',
  '(?m)^\[ROBOT_CI\] HARNESS=FAIL .*$',
]
timeout = 600
