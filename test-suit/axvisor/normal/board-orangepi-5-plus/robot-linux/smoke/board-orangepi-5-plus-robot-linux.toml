board_type = "OrangePi-5-Plus-robot"
timeout = 900
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  'Failed to initialize guest VM',
  'VFS: Cannot open root device',
  'Waiting for root device',
  '(?i)segmentation fault',
  '(?i)SIGSEGV',
  'exit with code: 139',
  '(?m)^\[ROBOT_CI\] RESULT=FAIL .*$',
  '(?m)^\[ROBOT_CI\] HARNESS=FAIL .*$',
]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"

[[shell_check_steps]]
shell_prefix = "orangepi@orangepi5plus:~"
shell_cmd = 'd=/home/orangepi/robot-ci/aka-rk3588; m=ROBOT_CI'

[[shell_check_steps]]
shell_prefix = "orangepi@orangepi5plus:~"
# Fixed by this test configuration; change this argument to revise the FPS gate.
shell_cmd = 'cd "$d" && FEETECH_DEV=auto ./run_robot_ci_once.sh 28.0 || echo "[${m}] HARNESS=FAIL status=$?"'
success_regex = ['(?m)^\[ROBOT_CI\] RESULT=PASS attempts=[12](?:[ \t\r]*$|\[\s*\d+\.\d+\].*$)']
