[base]
id = 1
name = "linux-perf30"
guest_type = "passthrough"
cpu_num = 1
# Guest MPIDR identity is deliberately separate from host placement.  The
# guest vCPU is exposed as CPU4 while the explicit bitmap pins it to host CPU4
# (the first RK3588 A76 big core).  CPU5 is the controlled A/B alternative.
phys_cpu_ids = [0x400]
phys_cpu_sets = [0x10]

[kernel]
entry_point = 0x2_4008_0000
kernel_load_addr = 0x2_4008_0000
# The first perf30 profile uses the production 6.1.99 image.  It obtains
# physical CPU performance from the host profile; a future virt-cpufreq image
# can be selected here without changing the board test protocol.
kernel_path = "/guest/linux/orangepi-5-plus-6.1.99"
cmdline = "root=/dev/mmcblk0p2 rw console=ttyS2,1500000 earlycon=uart8250,mmio32,0xfeb50000 cpuidle.off=1 rodata=off rootwait rootfstype=ext4 ignore_loglevel loglevel=8 cma=128M"
dtb_load_addr = 0x2_4000_0000
ramdisk_path = "/guest/linux/initramfs.cpio"
ramdisk_load_addr = 0xc000_0000
memory_regions = [
    [0xb000_0000, 0x1000_0000, 0x7, 2],
    [0xc000_0000, 0x3000_0000, 0x7, 2],
    [0x2_4000_0000, 0x8000_0000, 0x7, 1],
]

[devices]
passthrough = []
disabled = []
