[[shell_check_steps]]
shell_cmd = "p=LINUX; [ -r /proc/cpuinfo ] || mount -t proc proc /proc; grep -qs ' /sys sysfs ' /proc/mounts || mount -t sysfs sysfs /sys; [ -r /proc/cpuinfo ] && grep -qs ' /sys sysfs ' /proc/mounts && echo ${p}_MOUNTS_PASS || echo ${p}_MOUNTS_FAIL"
success_regex = ['(?m)^LINUX_MOUNTS_PASS\s*$']
