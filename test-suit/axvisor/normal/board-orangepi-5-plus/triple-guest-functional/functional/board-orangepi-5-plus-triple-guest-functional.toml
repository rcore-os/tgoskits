timeout = 30

[[shell_check_steps]]
shell_cmd = "n=$(awk -F'[ :]+' '$2!=\"lo\"{print $2; exit}' /root/.axv-if); [ -n \"$n\" ] && { echo ${p}_IFNAME_PASS ${p}_IFNAME_PASS; echo $n; } || echo ${p}_IFNAME_FAIL ${p}_IFNAME_FAIL"
success_regex = ['LINUX_IFNAME_PASS']
