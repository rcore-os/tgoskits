timeout = 300

# The chain keeps exchanging heartbeats after the checks above, so this asserts
# that the peer side of the last session is still alive while still attached to
# VM24.
[[shell_check_steps]]
success_regex = ['VM24_VIRTIO_NET_HB_RX']
