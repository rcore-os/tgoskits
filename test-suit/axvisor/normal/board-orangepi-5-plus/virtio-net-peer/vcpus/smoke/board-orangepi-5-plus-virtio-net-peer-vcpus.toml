board_type = "OrangePi-5-Plus"
# 24 guests share the eight cores of the board, three VMs per physical CPU, so
# the guest-to-guest chain converges slowly and the later VMs print their pass
# markers long before the runner attaches to them. Every step therefore asserts
# a line that repeats for the whole run: VM1 is checked on the heartbeat it
# sends (which needs the acknowledgement of VM2), and every other VM on the
# heartbeat it answers. That keeps each check independent of attach timing.
timeout = 3600
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  'Failed to initialize guest VM',
  '(?m)^VM[0-9]{1,2}_VIRTIO_NET_FAIL\s*$',
]

# VM1 (10.0.2.15) only has a client session towards VM2, so it proves the
# client role and the first session of the chain.
[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"
success_regex = ['VM1_VIRTIO_NET_HB_TX.*ack="ACK VM2 seq=']
timeout = 300

[[shell_check_steps]]
shell_prefix = "VM1_VIRTIO_NET_HB_TX"
shell_cmd = "\u0018h"
timeout = 120

# VM2 answers VM1 and connects to VM3; one heartbeat here proves the
# whole session 1 -> 2.
[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 2"
success_regex = ['VM2_VIRTIO_NET_HB_RX']
timeout = 300

[[shell_check_steps]]
shell_prefix = "VM2_VIRTIO_NET_HB_RX"
shell_cmd = "\u0018h"
timeout = 120

# VM3 answers VM2 and connects to VM4; one heartbeat here proves the
# whole session 2 -> 3.
