features = [
  "ax-driver/rk3588-cpufreq",
  "ax-driver/rockchip-dwmmc",
  "ax-driver/rockchip-sdhci",
  "fs",
]
log = "Info"
# The case spreads 24 vCPUs over the eight RK3588 cores, three VMs per physical
# CPU, so the host brings every core online.
max_cpu_num = 8
target = "aarch64-unknown-none-softfloat"
# These 24 vm configs are generated by orangepi-arceos-virtio-net-test.sh into
# `target/axvisor-vcpus-gen`; run it with `gen` (or `build`) before building.
# Every guest image is embedded into this AxVisor build (`image_location =
# "memory"`), so the guests are built first as well.
vm_configs = [
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm1.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm2.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm3.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm4.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm5.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm6.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm7.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm8.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm9.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm10.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm11.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm12.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm13.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm14.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm15.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm16.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm17.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm18.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm19.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm20.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm21.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm22.toml",
  "target/axvisor-vcpus-gen/arceos-virtio-net-peer-vm23.toml",
