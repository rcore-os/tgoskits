features = [
  "ax-driver/rk3588-cpufreq",
  "ax-driver/rockchip-dwmmc",
  "ax-driver/rockchip-sdhci",
  "fs",
]
log = "Info"
target = "aarch64-unknown-none-softfloat"
# All four guest images are embedded into this AxVisor build (`image_location =
# "memory"`), so build them first with `orangepi-arceos-virtio-net-test.sh` in
# this directory.
vm_configs = [
  "test-suit/axvisor/normal/board-orangepi-5-plus/virtio-net-peer/vcpus/arceos-virtio-net-peer-vm1.toml",
  "test-suit/axvisor/normal/board-orangepi-5-plus/virtio-net-peer/vcpus/arceos-virtio-net-peer-vm2.toml",
  "test-suit/axvisor/normal/board-orangepi-5-plus/virtio-net-peer/vcpus/arceos-virtio-net-peer-vm3.toml",
  "test-suit/axvisor/normal/board-orangepi-5-plus/virtio-net-peer/vcpus/arceos-virtio-net-peer-vm4.toml",
]
