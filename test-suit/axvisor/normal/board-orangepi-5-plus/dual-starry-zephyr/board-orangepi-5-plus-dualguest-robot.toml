board_type = "OrangePi-5-Plus-Robot-UART6"
uboot_cmd = [
  "setenv bootargs root=/dev/mmcblk0p2 rw console=ttyS2,1500000 console=tty1 splash=verbose consoleblank=0 earlycon=uart8250,mmio32,0xfeb50000 cpuidle.off=1 rodata=off rootwait rootfstype=ext4 loglevel=8 usb-storage.quirks= cma=128M cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory swapaccount=1 cpufreq.default_governor=performance axvisor.vm_start=1,2",
  "mw.l 0xfd7c03cc 0x7e000000",
  "mw.l 0xfd7c03d0 0x00080129",
  "mw.l 0xfd7c03d4 0x00030001",
  "mw.l 0xfd7c0830 0x00800000",
  "mw.l 0xfd7c0834 0x10000000",
  "mw.l 0xfd5f8020 0x00ff00aa",
  "mw.l 0xfd5f9110 0x000f000f",
  "mw.l 0xfd5f9020 0x00ff0066",
]
timeout = 300

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"

[[shell_check_steps]]
shell_prefix = "root@starry:"
# Require a guest-produced acknowledgement before starting the workload.
shell_cmd = '''if test -x /home/orangepi/robot-ci/aka-rk3588-dual/run_dual_pick_ci_once.sh; then printf '\n%s_%s guest=starry-zephyr\n' DUAL_PICK_SETUP OK; else printf '\n%s_%s guest=starry-zephyr\n' DUAL_PICK_SETUP FAIL; fi'''
success_regex = [
  '(?m)^DUAL_PICK_SETUP_OK guest=starry-zephyr\r?$',
]
fail_regex = [
  '(?m)^DUAL_PICK_SETUP_FAIL guest=starry-zephyr\r?$',
  '(?i)\bpanic(?:ked)?\b',
]
timeout = 10

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = '''if /home/orangepi/robot-ci/aka-rk3588-dual/run_dual_pick_ci_once.sh --min-fps 28 && sync; then printf '\n%s_%s guest=starry-zephyr\n' DUAL_PICK_CI PASS; else r=$?; sync; printf '\n%s_%s guest=starry-zephyr status=%s\n' DUAL_PICK_CI FAIL "$r"; fi'''
success_regex = [
  '(?m)^DUAL_PICK_CI_PASS guest=starry-zephyr\s*$',
]
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  "Failed to initialize guest VM",
  "Failed to start VM",
  '(?i)segmentation fault',
  '(?m)^DUAL_PICK_CI_FAIL guest=starry-zephyr .*$'
]
