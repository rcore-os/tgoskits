[base]
id = 2
name = "zephyr"
guest_type = "virtualized"
cpu_num = 1
phys_cpu_ids = [0x200]

[kernel]
entry_point = 0x4000_100c
kernel_load_addr = 0x4000_0000
kernel_path = "${env:AXVISOR_GUEST_ASSETS}/zephyr/orangepi-robot-control-sdk"
dtb_path = "${env:AXVISOR_GUEST_ASSETS}/zephyr/orangepi-robot-control-sdk.dtb"
# DTB GPA is selected automatically from the prepared guest memory layout.

memory_regions = [
  [0x4000_0000, 0x0800_0000, 0x7, 0],
]

[devices]
passthrough = [{ path = "/serial@feb90000" }]
disabled = []

[[devices.virtual]]
id = "robot-ivc"
model = "ivc-channel"
