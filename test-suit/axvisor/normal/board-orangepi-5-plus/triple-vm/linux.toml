[base]
id = 1
name = "linux-triple"
guest_type = "passthrough"
cpu_num = 1
phys_cpu_ids = [0x100]

[kernel]
entry_point = 0x2_4008_0000
image_location = "fs"
kernel_load_addr = 0x2_4008_0000
# Load the native kernel copy and matching initrd from the case directory.
kernel_path = "/home/orangepi/axvisor-tests/triple-vm-test/linux-Image"
dtb_load_addr = 0x2_4000_0000
ramdisk_path = "/home/orangepi/axvisor-tests/triple-vm-test/linux-initrd.img"
ramdisk_load_addr = 0xc000_0000
# Physical PCI MSI/ITS assignment is not wired into the AxVM host backend.
# This case exercises the PCIe controller's physical INTx cascade instead.
cmdline = "root=/dev/vda rw console=ttyS2,1500000 earlycon=uart8250,mmio32,0xfeb50000 cpuidle.off=1 rodata=off rootwait rootfstype=ext4 cma=128M pci=nomsi clk_ignore_unused pd_ignore_unused"
memory_regions = [
    [0xb000_0000, 0x1000_0000, 0x7, 2],
    [0xc000_0000, 0x3000_0000, 0x7, 2],
    [0x2_4000_0000, 0x8000_0000, 0x7, 1],
]

[devices]
# Preserve UART numbering and complete GPIO/SCMI provider subtrees.
# The firmware dependency walker does not follow Rockchip-specific GRF references.
passthrough = [
    { path = "/aliases" },
    { path = "/clocks" },
    { path = "/firmware" },
    { path = "/power-management@fd8d8000" },
    { path = "/pinctrl" },
    { path = "/syscon@fd5f0000" },
    { path = "/syscon@fd5b0000" },
    { path = "/syscon@fd5bc000" },
    { path = "/syscon@fd5c4000" },
    { path = "/vcc3v3-pcie-eth" },
    { path = "/pcie@fe180000" },
    { path = "/pcie@fe190000" },
]
disabled = [{ path = "/mmc@fe2c0000" }, { path = "/mmc@fe2e0000" }]

[[devices.virtual]]
id = "rootdisk"
model = "virtio-blk"
backend = "file"
path = "/home/orangepi/axvisor-tests/triple-vm-test/linux-rootfs.ext4"
filesystem = "ext4"
