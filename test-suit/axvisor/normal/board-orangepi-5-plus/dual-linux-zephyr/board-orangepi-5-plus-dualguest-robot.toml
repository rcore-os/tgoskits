board_type = "OrangePi-5-Plus-Robot-UART6"
uboot_cmd = [
  "setenv bootargs root=/dev/mmcblk0p2 rw console=ttyS2,1500000 console=tty1 splash=verbose consoleblank=0 earlycon=uart8250,mmio32,0xfeb50000 cpuidle.off=1 rodata=off rootwait rootfstype=ext4 loglevel=8 usb-storage.quirks= cma=128M cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory swapaccount=1 cpufreq.default_governor=performance axvisor.vm_start=1",
  "mw.l 0xfd7c03cc 0x7e000000",
  "mw.l 0xfd7c03d0 0x00080129",
  "mw.l 0xfd7c03d4 0x00030001",
  "mw.l 0xfd7c0830 0x00800000",
  "mw.l 0xfd7c0834 0x10000000",
  "mw.l 0xfd5f8020 0x00ff00aa",
  "mw.l 0xfd5f9110 0x000f000f",
  "mw.l 0xfd5f9020 0x00ff0066",
]
timeout = 300

# The Zephyr SDK subscribes non-blocking and validates the publisher header.
# Boot it only after Linux has initialized that header, so an early probe cannot
# strand a closed subscriber mapping on a VM with assigned DMA-capable devices.
[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"

[[shell_check_steps]]
shell_prefix = "orangepi@orangepi5plus:~"
shell_cmd = 'd=/home/orangepi/robot-ci/aka-rk3588-dual; m=DUAL_PICK_CI; g=linux-zephyr'

[[shell_check_steps]]
shell_prefix = "orangepi@orangepi5plus:~"
shell_cmd = '''{
# Keep perception output off the live serial sink. BEGIN waiting is emitted
# only after publish and ring initialization, and is explicitly flushed.
ready=0
if log=$(mktemp /tmp/dual-pick-ci.XXXXXX); then
    sudo -n "$d/run_dual_pick_ci_once.sh" --min-fps 28 >"$log" 2>&1 &
    p=$!
    i=0
    while [ "$i" -lt 300 ] && kill -0 "$p" 2>/dev/null; do
        if grep -q '^ROBOT_CONFIG_WAIT type=1 ' "$log"; then
            ready=1
            break
        fi
        sleep 0.1
        i=$((i + 1))
    done
    if [ "$ready" -eq 0 ]; then
        wait "$p"
        cat "$log"
        rm -f "$log"
        sync
    fi
fi
if [ "$ready" -eq 1 ]; then
    printf "\n%s_PUBLISHER_READY guest=%s\n" "$m" "$g"
else
    printf "\n%s_FAIL guest=%s stage=publisher-ready\n" "$m" "$g"
fi
}'''
success_regex = ['(?m)^DUAL_PICK_CI_PUBLISHER_READY guest=linux-zephyr\s*$']
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  "Failed to initialize guest VM",
  "Failed to start VM",
  "VFS: Cannot open root device",
  "Waiting for root device",
  '(?i)segmentation fault',
  '(?m)^DUAL_PICK_CI_FAIL guest=linux-zephyr .*$',
]

[[shell_check_steps]]
shell_prefix = "orangepi@orangepi5plus:~"
shell_cmd = "\u0018h"

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm start 2"

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"

[[shell_check_steps]]
# Reattaching does not make an already waiting guest shell redraw its prompt.
shell_prefix = "Attached VM[1] console"
shell_cmd = '''{
wait "$p"
r=$?
cat "$log" || r=1
rm -f "$log" || r=1
sync || r=1
if [ "$r" -eq 0 ]; then
    printf "\n%s_PASS guest=%s\n" "$m" "$g"
else
    printf "\n%s_FAIL guest=%s status=%s\n" "$m" "$g" "$r"
fi
}'''
success_regex = ['(?m)^DUAL_PICK_CI_PASS guest=linux-zephyr\s*$']
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  "Failed to initialize guest VM",
  "Failed to start VM",
  "VFS: Cannot open root device",
  "Waiting for root device",
  '(?i)segmentation fault',
  '(?m)^DUAL_PICK_CI_FAIL guest=linux-zephyr .*$',
]
