args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-device",
  "virtio-blk-device,drive=disk0",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
  "-append",
  "root=/dev/vda rw init=/bin/sh",
  "-m",
  "8g",
]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "ICPC_PEER_ETH_FAIL",
  "ICPC_ACL_LEAK",
  "icpc-acl-deny: .* failed",
  "(?m)^icpc-acl-deny fail\\s*$",
]
success_regex = ["(?m)^icpc-acl-deny pass\\s*$"]
shell_prefix = "~ #"
shell_init_cmd = "mount -t proc proc /proc; mount -t sysfs sys /sys; echo 1 > /proc/sys/net/ipv6/conf/all/disable_ipv6; ip link set eth0 up; ip addr flush dev eth0; ip addr add 10.0.9.2/24 dev eth0; sleep 10; /usr/local/bin/icpc-acl-deny && echo 'icpc-acl-deny pass' || echo 'icpc-acl-deny fail'"
to_bin = true
uefi = false
timeout = 120
