timeout = 120
requires = ["prepare-smp-ipi.toml"]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 3"

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "mount -t proc proc /proc 2>/dev/null || true; [ \"$(nproc)\" -ge 3 ] && dmesg | grep -q 'SBI IPI extension detected' && grep -Eq 'IPI[^:]*:.*[1-9]' /proc/interrupts && echo 'guest smp ipi pass!' || exit 1"
success_regex = [
    "(?m)^guest smp ipi pass!\\s*$",
]
fail_regex = [
    "(?m)^(?:echo|cat|rm):",
    "(?i)IPI extension is not available",
]
