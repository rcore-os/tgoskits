args = [
    "-machine",
    "virt",
    "-cpu",
    "la464",
    "-m",
    "4G",
    "-smp",
    "3",
    "-nographic",
    "-serial",
    "mon:stdio",
    "-no-reboot",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-loongarch64-alpine.img",
]
cmdline = "root=/dev/nvme0n1 earlycon=uart8250,mmio,0x1fe001e0,115200 axvisor.vm_start=1,2"
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)kernel panic",
    "(?i)login incorrect",
    "(?i)permission denied",
    "(?i)failed to initialize guest VM",
    "(?m)^(?:echo|cat|rm):\\s",
]
timeout = 300
to_bin = true
uefi = true

[axbuild]
checks = [
    "tests/shell-and-block.toml",
]
