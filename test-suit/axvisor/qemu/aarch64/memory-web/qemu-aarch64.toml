args = [
    "-machine",
    "virt,virtualization=on,gic-version=3",
    "-cpu",
    "cortex-a72",
    "-m",
    "512M",
    "-smp",
    "1",
    "-nographic",
    "-serial",
    "mon:stdio",
]
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)kernel panic",
]
success_regex = []
timeout = 270
to_bin = true
uefi = false

[axbuild]
checks = [
    "tests/memory-root.toml",
    "tests/dashboard.toml",
]
