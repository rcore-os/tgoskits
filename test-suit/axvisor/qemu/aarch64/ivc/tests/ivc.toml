[[shell_check_steps]]
# QEMU carries `axvisor.vm_start=1,2`; no test step starts either guest.
success_regex = ["Builtin VM startup selector started 2 guest\\(s\\)"]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 2"
success_regex = ["Attached VM\\[2\\] console"]

[[shell_check_steps]]
# The subscriber emits this only after a real UIO MSI-X interrupt.
success_regex = [
    "(?m)^(?:\\x1b\\[[0-9;]*m)*(?:\\[VM 2\\] )?linux ivc irq backend=ivshmem-pci source=uio-msix actual=1\\s*$",
]

[[shell_check_steps]]
# Completion also requires 5 requests, 3 data messages, and 5 acknowledgements.
success_regex = [
    "(?m)^(?:\\x1b\\[[0-9;]*m)*(?:\\[VM 2\\] )?linux ivc demo pass backend=ivshmem-pci\\s*$",
]

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "\u0018h"
success_regex = ["detached VM\\[2\\] console"]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"
success_regex = [
    "(?m)^(?:\\x1b\\[[0-9;]*m)*(?:\\[VM 1\\] )?ivc ack seq=5 msg=ack from linux subscriber\\s*$",
]

[[shell_check_steps]]
success_regex = [
    "(?m)^(?:\\x1b\\[[0-9;]*m)*(?:\\[VM 1\\] )?ivc session marker=complete backend=ivshmem-pci role=publisher peer=0\\s*$",
]

[[shell_check_steps]]
success_regex = [
    "(?m)^(?:\\x1b\\[[0-9;]*m)*(?:\\[VM 1\\] )?ivc full-duplex demo complete backend=ivshmem-pci\\s*$",
]
