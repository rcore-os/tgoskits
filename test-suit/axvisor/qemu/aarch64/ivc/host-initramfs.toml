# Reuse the proven ivc-local guests and their generated BusyBox archive. The
# Linux guest configuration names this shared path as its ramdisk.
vm_configs = [
    "test-suit/axvisor/qemu/aarch64/ivc-local/configs/arceos-ivc-publisher.toml",
    "test-suit/axvisor/qemu/aarch64/ivc-local/configs/linux-ivc-subscriber.toml",
]
busybox_initramfs = "tmp/axbuild/axvisor/qemu/aarch64/ivc-local/initramfs-aarch64.cpio.gz"
linux_ivshmem_subscriber = true
