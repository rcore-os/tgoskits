args = [
    "-nographic",
    "-snapshot",
    "-cpu",
    "cortex-a72",
    "-machine",
    "virt,virtualization=on,gic-version=3",
    "-smp",
    "4",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-append",
    "root=/dev/nvme0n1 rw init=/bin/sh",
    "-m",
    "8g",
]
fail_regex = [
    "(?m)^VIRTIO_BLK_MOUNT_FAIL:",
    "(?i)I/O error",
    "(?i)filesystem resource is busy",
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)login incorrect",
    "(?i)permission denied",
    "(?m)^(?:echo|cat|rm): (?:can't (?:open|remove) |cannot remove |/tmp/axvisor-nvme-rw:)",
    "(?i)unhandled page fault",
    "ivc publish failed",
    "ivc subscribe failed",
    "(?i)kernel panic",
]
timeout = 2400
to_bin = true
uefi = false

[axbuild]
checks = [
    "tests/shell-and-block.toml",
    "tests/pool.toml",
    "tests/ivc.toml",
    "tests/pool-http.toml",
    "tests/dashboard.toml",
]
