[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm start 1"
success_regex = ["VM\\[1\\] started successfully"]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"
success_regex = ["Attached VM\\[1\\] console"]

[[shell_check_steps]]
shell_prefix = "phase=before-peer"
shell_cmd = "\u0018h"
success_regex = ["detached VM\\[1\\] console"]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm start 2"
success_regex = ["VM\\[2\\] started successfully"]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 2"
# The subscriber emits this marker only after 5 requests, 3 data messages,
# 5 acknowledgements, and a real ivshmem doorbell interrupt have completed.
success_regex = ["Attached VM\\[2\\] console"]

[[shell_check_steps]]
success_regex = [
    "(?m)^(?:\\x1b\\[[0-9;]*m)*(?:\\[VM 2\\] )?linux ivc demo pass backend=ivshmem-pci\\s*$",
]

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "\u0018h"
success_regex = ["detached VM\\[2\\] console"]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"
success_regex = [
    "(?m)^(?:\\x1b\\[[0-9;]*m)*(?:\\[VM 1\\] )?ivc ack seq=5 msg=ack from linux subscriber\\s*$",
]

[[shell_check_steps]]
success_regex = [
    "(?m)^(?:\\x1b\\[[0-9;]*m)*(?:\\[VM 1\\] )?ivc session marker=complete backend=ivshmem-pci role=publisher peer=0\\s*$",
]

[[shell_check_steps]]
success_regex = [
    "(?m)^(?:\\x1b\\[[0-9;]*m)*(?:\\[VM 1\\] )?ivc full-duplex demo complete backend=ivshmem-pci\\s*$",
]
