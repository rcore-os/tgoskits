timeout = 600

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm start 2"
success_regex = ["(?m)^✓ VM\\[2\\] started successfully\\s*$"]
timeout = 120

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 2"
success_regex = [
    "(?m)^AXVISOR_X86_MP_FALLBACK_PASSED\\s*$",
]

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "\u0018h"
success_regex = ["detached VM\\[2\\] console"]
timeout = 60

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm delete --force 2"
success_regex = ["(?m)^✓ VM\\[2\\] deleted completely\\s*$"]
timeout = 120
