args = [
    "-no-user-config",
    "-display",
    "none",
    "-serial",
    "stdio",
    "-monitor",
    "none",
    "-cpu",
    "host,-la57,+vmx-ept,+vmx-unrestricted-guest,+vmx-flexpriority",
    "-machine",
    "q35,smbus=off,usb=off,graphics=off",
    "-smp",
    "2",
    "-accel",
    "kvm",
    "-m",
    "1G",
    "-net",
    "none",
    "-vga",
    "none",
]
timeout = 600
fail_regex = [
    "(?i)kernel panic",
    "(?m)^AXVISOR_X86_ACPI_FAILED\\s*$",
    "(?m)^AXVISOR_GUEST_ASSERTION_CASE_UNKNOWN\\s*$",
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)page fault",
    "(?i)vm exit failure",
    "(?i)failed to initialize guest VM",
    "(?m)^AXVISOR_X86_VPCI_ENUMERATION_FAILED\\s*$",
    "(?m)^AXVISOR_X86_PCI_BLOCK_FAILED\\s*$",
]
to_bin = true
uefi = true
cmdline = ""


[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm start 5"
success_regex = ["(?m)^✓ VM\\[5\\] started successfully\\s*$"]
timeout = 120

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 5"
success_regex = [
    "(?m)^AXVISOR_X86_PCI_BLOCK_RW_PASSED\\s*$",
]

[[shell_check_steps]]
shell_prefix = "~ #"
shell_cmd = "\u0018h"
success_regex = ["detached VM\\[5\\] console"]
timeout = 60

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm delete --force 5"
success_regex = ["(?m)^✓ VM\\[5\\] deleted completely\\s*$"]
timeout = 120

[axbuild]
id = "qemu/x86_64/vmx/functional/pci-block-rw"
