timeout = 300

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"

[[shell_check_steps]]
shell_prefix = "orangepi@orangepi5plus:~"
shell_cmd = "d=/home/orangepi/robot-ci/aka-rk3588-dual; m=DUAL_PICK_CI; g=linux-zephyr"

[[shell_check_steps]]
shell_prefix = "orangepi@orangepi5plus:~"
shell_cmd = "{\n# Keep perception output off the live serial sink. BEGIN waiting is emitted\n# only after publish and ring initialization, and is explicitly flushed.\nready=0\nif log=$(mktemp /tmp/dual-pick-ci.XXXXXX); then\n    sudo -n \"$d/run_dual_pick_ci_once.sh\" --min-fps 28 >\"$log\" 2>&1 &\n    p=$!\n    i=0\n    while [ \"$i\" -lt 300 ] && kill -0 \"$p\" 2>/dev/null; do\n        if grep -q '^ROBOT_CONFIG_WAIT type=1 ' \"$log\"; then\n            ready=1\n            break\n        fi\n        sleep 0.1\n        i=$((i + 1))\n    done\n    if [ \"$ready\" -eq 0 ]; then\n        wait \"$p\"\n        cat \"$log\"\n        rm -f \"$log\"\n        sync\n    fi\nfi\nif [ \"$ready\" -eq 1 ]; then\n    printf \"\\n%s_PUBLISHER_READY guest=%s\\n\" \"$m\" \"$g\"\nelse\n    printf \"\\n%s_FAIL guest=%s stage=publisher-ready\\n\" \"$m\" \"$g\"\nfi\n}"
success_regex = [
    "(?m)^DUAL_PICK_CI_PUBLISHER_READY guest=linux-zephyr\\s*$",
]
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "Failed to initialize guest VM",
    "Failed to start VM",
    "VFS: Cannot open root device",
    "Waiting for root device",
    "(?i)segmentation fault",
    "(?m)^DUAL_PICK_CI_FAIL guest=linux-zephyr .*$",
]

[[shell_check_steps]]
shell_prefix = "orangepi@orangepi5plus:~"
shell_cmd = "\u0018h"

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm start 2"

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"

[[shell_check_steps]]
shell_prefix = "Attached VM[1] console"
shell_cmd = "{\nwait \"$p\"\nr=$?\ncat \"$log\" || r=1\nrm -f \"$log\" || r=1\nsync || r=1\nif [ \"$r\" -eq 0 ]; then\n    printf \"\\n%s_PASS guest=%s\\n\" \"$m\" \"$g\"\nelse\n    printf \"\\n%s_FAIL guest=%s status=%s\\n\" \"$m\" \"$g\" \"$r\"\nfi\n}"
success_regex = [
    "(?m)^DUAL_PICK_CI_PASS guest=linux-zephyr\\s*$",
]
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "Failed to initialize guest VM",
    "Failed to start VM",
    "VFS: Cannot open root device",
    "Waiting for root device",
    "(?i)segmentation fault",
    "(?m)^DUAL_PICK_CI_FAIL guest=linux-zephyr .*$",
]
