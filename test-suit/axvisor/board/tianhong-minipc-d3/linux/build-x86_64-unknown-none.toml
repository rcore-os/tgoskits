# AxVisor selects the VMX or SVM backend from runtime CPUID. This physical
# AMD board must not request either backend as a Cargo feature.
# This no-passthrough smoke consumes ACPI tables and root callbacks without
# loading the D3 AML namespace.
env = { RDRIVE_ACPI_LOAD_AML = "0" }
features = []
log = "Info"
target = "x86_64-unknown-none"
vm_configs = ["test-suit/axvisor/board/tianhong-minipc-d3/linux/guest-linux.toml"]
