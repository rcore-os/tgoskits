args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-device",
  "virtio-blk-device,drive=disk0",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
  "-append",
  "root=/dev/vda rw init=/bin/sh",
  "-m",
  "8g",
]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "ARCEOS_TEST_FAIL",
]
success_regex = ["RT_LATENCY_PASS"]
shell_prefix = "~ #"
shell_init_cmd = "for i in 1 2 3 4 5 6 7 8; do sh -c 'while true; do :; done' & done; echo TASK1_STRESS_STRONG_STARTED"
to_bin = true
uefi = false
timeout = 2400
