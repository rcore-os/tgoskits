board_type = "OrangePi-5-Plus"
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)kernel panic",
    "ARCEOS_TEST_FAIL",
]
success_regex = ["RT_LATENCY_PASS"]
shell_prefix = "~ #"
shell_init_cmd = "for i in 1 2 3 4; do sh -c 'while true; do :; done' & done; echo TASK1_BOARD_STRESS_STARTED"
timeout = 1200
