args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-device",
  "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
  "-append",
  "root=/dev/nvme0n1 rw init=/bin/sh",
  "-m",
  "8g",
]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "ARCEOS_TEST_FAIL",
]
success_regex = ["RT_LATENCY_PASS"]
shell_prefix = "~ #"
# Alpine rootfs has no stress-ng; spin 4 CPU-bound loops (≈ stress-ng --cpu 2 --fork 4).
shell_init_cmd = "for i in 1 2 3 4; do sh -c 'while true; do :; done' & done; echo TASK1_STRESS_STARTED"
to_bin = true
uefi = false
timeout = 2400
