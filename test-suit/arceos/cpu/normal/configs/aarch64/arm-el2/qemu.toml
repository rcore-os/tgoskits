args = ["-machine", "virt,virtualization=on,gic-version=3", "-cpu", "cortex-a53", "-m", "1G", "-smp", "4", "-display", "none", "-serial", "mon:stdio"]
timeout = 60
uefi = false
to_bin = true
fail_regex = ["(?i)\\bpanic(?:ked)?\\b"]

[[shell_check_steps]]
success_regex = ["(?m)^CPU_BATCH_OK batch=arm-el2 selection=all\\s*$"]
