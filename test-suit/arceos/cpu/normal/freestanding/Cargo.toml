[package]
name = "arceos-cpu-normal-freestanding"
version = "0.1.0"
edition.workspace = true
publish = false
build = "../build.rs"

[[bin]]
name = "arceos-cpu-normal-freestanding"
path = "../main.rs"

[dependencies]
cpu-tests = { package = "arceos-cpu-tests", path = "../.." }
ax-std = { workspace = true, default-features = false, features = ["alloc", "paging", "uspace", "ipi", "smp"] }
ax-alloc = { workspace = true, features = ["global-allocator"] }

[build-dependencies]
anyhow.workspace = true
serde = { version = "1.0", features = ["derive"] }
toml = { workspace = true, features = ["parse", "serde"] }

[package.metadata.docs.rs]
targets = ["aarch64-unknown-none-softfloat", "riscv64gc-unknown-none-elf", "loongarch64-unknown-none-softfloat"]

[package.metadata.clippy.cpu_suite]
path = "../suite.toml"
image = "freestanding"

[package.metadata.clippy.board_suite]
path = "../../../board-orangepi-5-plus/suite.toml"
