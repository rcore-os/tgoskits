schema_version = 1

# One batch is one boot; member order is execution order.
run_order = [
    "arm-el1",
    "arm-pmu-max",
    "arm-el2",
    "riscv-standard",
    "riscv-nofault",
    "riscv-no-h",
    "riscv-sstc",
    "riscv-no-sstc",
    "x86-svm",
    "x86-vmx",
    "x86-fxsave",
    "x86-pge",
    "loong-standard",
    "loong-nofault",
    "loong-boot-trap"
]

[execution]
batch_env = "AX_CPU_TEST_BATCH"
members_env = "AX_CPU_TEST_CASE"
all_members_value = ""
completion = "CPU_BATCH_OK batch={batch} selection={selection}"
selection_mode = "single"
feature_scope = "selected"

[batches.arm-el1]
package = "arceos-cpu-normal-freestanding"
arch = "aarch64"
image = "freestanding"
mode = "normal"
build_config = "configs/aarch64/arm-el1/build.toml"
qemu_config = "configs/aarch64/arm-el1/qemu.toml"
pin_to_boot_cpu = true
features = []

[[batches.arm-el1.tests]]
id = "paging"
name = "页表、缓存与TLB"
entry = "cpu_tests::paging::run"
features = ["cpu-tests/paging"]
aliases = ["paging"]

[[batches.arm-el1.tests]]
id = "fp-context"
name = "FP寄存器保存恢复"
entry = "cpu_tests::fp_context::run"
features = ["cpu-tests/fp-context"]
aliases = ["fp-context"]

[[batches.arm-el1.tests]]
id = "pmu"
name = "PMU生命周期和中断"
entry = "cpu_tests::pmu::run"
features = ["cpu-tests/pmu"]
aliases = ["pmu"]

[[batches.arm-el1.tests]]
id = "user-entry"
name = "ARM用户态进入与恢复"
entry = "cpu_tests::user_entry::run"
features = ["cpu-tests/user-entry"]
aliases = ["user-entry"]

[batches.arm-pmu-max]
package = "arceos-cpu-normal-std"
arch = "aarch64"
image = "std"
mode = "normal"
build_config = "configs/aarch64/arm-pmu-max/build.toml"
qemu_config = "configs/aarch64/arm-pmu-max/qemu.toml"
pin_to_boot_cpu = false
features = []

[[batches.arm-pmu-max.tests]]
id = "pmu"
name = "PMU生命周期和中断"
entry = "cpu_tests::pmu::run"
features = ["cpu-tests/pmu"]
aliases = ["pmu-max"]

[batches.arm-el2]
package = "arceos-cpu-normal-std"
arch = "aarch64"
image = "std"
mode = "normal"
build_config = "configs/aarch64/arm-el2/build.toml"
qemu_config = "configs/aarch64/arm-el2/qemu.toml"
pin_to_boot_cpu = true
features = ["cpu-tests/hv", "cpu-tests/stage2-tlb"]

[[batches.arm-el2.tests]]
id = "paging"
name = "页表、缓存与TLB"
entry = "cpu_tests::paging::run"
features = ["cpu-tests/paging"]
aliases = ["paging-el2"]

[[batches.arm-el2.tests]]
id = "virtualization-lifecycle"
name = "虚拟化资源生命周期"
entry = "cpu_tests::virtualization_lifecycle::run"
features = ["cpu-tests/virtualization-lifecycle"]
aliases = ["virtualization-lifecycle"]

[[batches.arm-el2.tests]]
id = "guest-entry"
name = "实际guest进入退出及宿主状态保持"
entry = "cpu_tests::guest_entry::run"
features = ["cpu-tests/guest-entry"]
aliases = ["guest-entry", "guest-entry-stage2"]

