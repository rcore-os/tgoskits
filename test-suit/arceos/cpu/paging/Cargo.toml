[package]
name = "arceos-cpu-paging"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = ["ax-std"]
boot-trap = ["ax-std"]
hv = ["ax-std", "ax-std/hv"]
ax-std = ["dep:ax-std", "ax-std/arceos"]

[dependencies]
ax-cpu.workspace = true
someboot.workspace = true
ax-hal = { workspace = true, features = ["paging"] }
ax-mm.workspace = true
ax-std = { workspace = true, optional = true, features = ["default", "paging", "ipi"] }

[package.metadata.docs.rs]
targets = ["aarch64-unknown-linux-musl", "riscv64gc-unknown-linux-musl", "loongarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
