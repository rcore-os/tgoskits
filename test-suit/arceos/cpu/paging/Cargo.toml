[package]
name = "arceos-cpu-paging"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = ["ax-std"]
boot-trap = []
hv = ["ax-std/hv"]
ax-std = ["dep:ax-std", "ax-std/arceos"]

[dependencies]
ax-cpu.workspace = true
someboot.workspace = true
ax-hal = { workspace = true, features = ["paging"] }
ax-mm.workspace = true
ax-std = { workspace = true, optional = true, features = ["default", "paging", "ipi"] }
