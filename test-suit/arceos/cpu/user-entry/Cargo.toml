[package]
name = "arceos-cpu-user-entry"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = ["ax-std"]
ax-std = ["dep:ax-std"]

[dependencies]
ax-alloc = { workspace = true, features = ["global-allocator"] }
ax-cpu = { workspace = true, features = ["uspace", "pmu"] }
ax-std = { workspace = true, optional = true, default-features = false, features = ["alloc", "paging", "uspace", "ipi", "smp"] }

[package.metadata.docs.rs]
targets = ["aarch64-unknown-none-softfloat"]
