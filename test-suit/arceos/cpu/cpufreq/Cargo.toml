[package]
name = "arceos-cpu-cpufreq"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = ["ax-std"]
ax-std = ["dep:ax-std", "ax-std/arceos", "ax-std/rk3588-cpufreq"]

[dependencies]
ax-cpu = { workspace = true, features = ["pmu"] }
ax-driver = { workspace = true, features = ["rk3588-cpufreq-thermal-test"] }
ax-runtime = { workspace = true, features = ["rk3588-cpufreq"] }
ax-std = { workspace = true, optional = true, features = ["default", "ipi"] }

[package.metadata.docs.rs]
targets = ["aarch64-unknown-linux-musl"]
features = ["ax-std"]
