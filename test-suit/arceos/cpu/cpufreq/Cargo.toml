[package]
name = "arceos-cpu-cpufreq"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = ["ax-std"]
ax-std = ["dep:ax-std"]

[dependencies]
cpu-tests = { package = "arceos-cpu-tests", path = "..", features = ["cpufreq"] }
ax-std = { workspace = true, optional = true, features = ["default", "arceos", "ipi"] }

[package.metadata.docs.rs]
targets = ["aarch64-unknown-linux-musl"]
features = ["ax-std"]
