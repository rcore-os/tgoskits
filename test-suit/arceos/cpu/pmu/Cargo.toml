[package]
name = "arceos-cpu-pmu"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = ["ax-std"]
ax-std = ["dep:ax-std", "ax-std/arceos"]

[dependencies]
ax-cpu = { workspace = true, features = ["pmu"] }
ax-std = { workspace = true, optional = true, features = ["default", "ipi"] }

[package.metadata.docs.rs]
targets = ["aarch64-unknown-linux-musl"]
