[package]
name = "arceos-cpu-virtualization-lifecycle"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
expect-svm = ["ax-std"]
default = ["ax-std"]
ax-std = ["dep:ax-std", "ax-std/arceos"]

[dependencies]
ax-alloc.workspace = true
ax-hal.workspace = true
ax-cpu = { workspace = true, features = ["virtualization"] }
ax-std = { workspace = true, optional = true, features = ["default", "hv"] }

[package.metadata.docs.rs]
targets = ["aarch64-unknown-linux-musl", "loongarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
