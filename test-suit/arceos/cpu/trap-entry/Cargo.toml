[package]
name = "arceos-cpu-trap-entry"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = ["ax-std"]
ax-std = ["dep:ax-std", "ax-std/arceos"]

[dependencies]
ax-cpu = { workspace = true, features = ["context"] }
ax-std = { workspace = true, optional = true, features = ["default"] }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-musl"]
