[package]
name = "arceos-test-acpica-interpreter"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = ["ax-std"]
ax-std = ["dep:ax-std", "ax-std/alloc", "ax-std/paging", "ax-std/ipi"]

[dependencies]
acpica-interpreter.workspace = true
ax-alloc = { workspace = true, features = ["global-allocator"] }
ax-hal.workspace = true
ax-std = { workspace = true, optional = true, default-features = false }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-none"]
features = ["ax-std"]
