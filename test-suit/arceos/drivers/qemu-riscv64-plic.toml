args = [
  "-machine", "virt,aia=none", "-m", "256M", "-smp", "2", "-cpu", "rv64", "-nographic",
  "-device", "virtio-rng-device,bus=virtio-mmio-bus.0,event_idx=off",
]
uefi = false
to_bin = true
timeout = 30
fail_regex = ['(?i)\bpanic(?:ked)?\b']

[[shell_check_steps]]
success_regex = ['(?m)^DRIVERS_BATCH_OK batch=riscv-plic selection=all\s*$']
