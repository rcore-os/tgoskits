args = [
    "-machine", "q35",
    "-cpu", "max",
    "-m", "512M",
    "-smp", "1",
    "-display", "none",
    "-serial", "mon:stdio",
    "-device", "intel-hda",
    "-device", "hda-duplex,audiodev=pcm-capture",
]

timeout = 120
uefi = true
to_bin = true
fail_regex = ["(?i)\\bpanic(?:ked)?\\b", "ACPICA_TEST_FAIL"]

[[shell_check_steps]]
success_regex = ["(?m)^DRIVERS_BATCH_OK batch=x86-q35 selection=all\\s*$"]

[host_pcm_waveform]
frames = 4096
