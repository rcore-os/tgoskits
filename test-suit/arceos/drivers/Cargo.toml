[package]
name = "arceos-driver-tests"
version = "0.1.0"
edition.workspace = true
publish = false
[features]
default = ["ax-std"]
ax-std = ["dep:ax-std"]
[dependencies]
ax-alloc = { workspace = true, features = ["global-allocator"] }
ax-hal.workspace = true
ax-std = { workspace = true, optional = true, default-features = false, features = ["alloc", "ipi", "paging"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
acpica-interpreter.workspace = true
ax-driver = { workspace = true, features = ["intel-hda", "list-pci-devices"] }

[target.'cfg(target_arch = "riscv64")'.dependencies]
ax-std = { workspace = true, optional = true, default-features = false, features = ["hv", "smp"] }
ax-crate-interface.workspace = true
ax-mm.workspace = true
ax-plat.workspace = true
ax-sync.workspace = true
rdrive.workspace = true
somehal.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-none", "riscv64gc-unknown-none-elf"]
features = ["ax-std"]

[build-dependencies]
arceos-test-build = { path = "../build-support" }

[package.metadata.clippy.batch_suite]
path = "suite.toml"

[package.metadata.axbuild]
qemu_suite = "suite.toml"
