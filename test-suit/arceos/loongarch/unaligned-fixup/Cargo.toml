[package]
name = "arceos-loongarch-unaligned-fixup"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = ["ax-std"]
ax-std = ["dep:ax-hal", "dep:ax-std", "ax-std/arceos"]

[dependencies]
ax-cpu = { workspace = true, features = ["exception-table"] }
ax-hal = { workspace = true, optional = true }
ax-std = { workspace = true, optional = true, features = ["default"] }
