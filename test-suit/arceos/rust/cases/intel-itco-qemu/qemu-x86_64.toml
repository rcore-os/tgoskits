args = [
    "-machine", "q35",
    "-m", "512M",
    "-accel", "tcg,thread=single",
    "-display", "none",
    "-serial", "mon:stdio",
]

timeout = 120
uefi = true
to_bin = true
fail_regex = ["(?i)\\bpanic(?:ked)?\\b", "ARCEOS_TEST_FAIL"]

[[shell_check_steps]]
success_regex = ["ICH9_ITCO_QEMU_STATE=halted_no_reboot"]

[[shell_check_steps]]
success_regex = ["INTEL_ITCO_QEMU_OK"]

[[shell_check_steps]]
success_regex = ["ArceOS test suite run OK!"]
