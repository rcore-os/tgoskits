schema_version = 3

# Default startup order. Every named batch must appear exactly once.
run_order = [
    "general",
    "task-cpu-lifecycle",
    "iommu-dma",
    "x86-devices",
    "serial-rx",
    "virtio-block-lifecycle",
    "net-unix-path",
    "debug-panic-path",
    "lockdep-detect",
    "task-stack-guard-page",
]

[batches.general]

[[batches.general.tests]]
id = "cpu-capacity"
name = "published CPU capacity across online CPUs"
entry = "crate::cpu_capacity::run"
category = "cpu_capacity"

[[batches.general.tests]]
id = "debug-backtrace"
name = "capture backtrace"
entry = "crate::debug::backtrace::run"
category = "debug"

[[batches.general.tests]]
id = "display-basic"
name = "framebuffer write, readback and restoration"
entry = "crate::display::basic::run"
category = "display"

[[batches.general.tests]]
id = "eventfd-epoll"
name = "eventfd semantics and epoll wake smoke"
entry = "crate::io_mpx::run"
category = "io_mpx"

[[batches.general.tests]]
id = "exception-breakpoint"
name = "raise breakpoint exception"
entry = "crate::exception::breakpoint::run"
category = "exception"
arches = ["aarch64", "riscv64", "loongarch64"]

[[batches.general.tests]]
id = "fs-basic"
name = "bounded filesystem operations"
entry = "crate::fs::basic::run"
category = "fs"

[[batches.general.tests]]
id = "lockdep-baseline"
name = "lockdep baseline locking"
entry = "crate::lockdep::baseline::run"
category = "lockdep"

[[batches.general.tests]]
id = "memtest"
name = "allocator alignment, failure and cross-CPU ownership"
entry = "crate::mem::test::run"
category = "mem"

[[batches.general.tests]]
id = "mem-stage1-transition"
name = "SMP kernel stage-1 mapping transition"
entry = "crate::mem::stage1_transition::run"
category = "mem"

[[batches.general.tests]]
id = "net-http"
name = "Rust std host HTTP round trip"
