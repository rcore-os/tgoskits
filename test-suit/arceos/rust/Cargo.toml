[package]
name = "arceos-test-suit"
version = "0.3.1"
edition.workspace = true
publish = false

[features]
default = []
std = []
# Every kernel test reaches ax-std through this feature, so it owns the ArceOS
# baseline instead of relying on axbuild to add it for the selected test case.
ax-std = ["dep:ax-driver", "dep:ax-hal", "dep:ax-std", "ax-std/arceos"]
memtest = ["ax-std", "dep:rand", "ax-std/alloc"]
task-yield = ["ax-std"]
sched-rr = ["ax-std", "ax-std/alloc", "ax-std/sched-rr"]
sched-cfs = ["ax-std", "ax-std/alloc", "ax-std/sched-cfs"]
task-affinity = ["ax-std"]
task-wait-queue = ["ax-std"]
task-wait-queue-remote-wake = ["ax-std", "ax-std/ipi"]
task-ipi = ["ax-std", "ax-std/alloc", "ax-std/ipi"]
task-mutex = ["ax-std", "ax-std/alloc"]
task-irq = [
    "ax-std",
    "ax-std/sched-rr",
    "dep:axpoll",
]
task-tls = ["ax-std", "ax-std/tls", "ax-std/alloc"]
task-parallel = ["ax-std", "dep:rand", "ax-std/alloc"]
task-priority = ["ax-std", "ax-std/alloc"]
task-sleep = ["ax-std"]
task-smp-online = ["ax-std", "ax-std/ipi"]
task-stack-guard-page = ["ax-std", "ax-std/paging", "ax-std/stack-guard-page"]
net-loopback = ["ax-std", "ax-driver/virtio-net", "ax-std/net", "ax-std/dns"]
fs-basic = ["ax-std", "ax-driver/nvme", "ax-std/alloc", "ax-std/fatfs"]
debug-backtrace = ["ax-std", "dep:axbacktrace", "ax-std/backtrace"]
debug-panic-path = ["ax-std", "dep:axbacktrace", "ax-std/backtrace"]
display-basic = ["ax-std", "ax-driver/virtio-gpu", "dep:embedded-graphics", "ax-std/display"]
eventfd-epoll = ["ax-std", "ax-std/fd"]
exception-breakpoint = ["ax-std"]
exception-page-fault = ["ax-std", "ax-std/paging"]
futex-errno-order = ["ax-std", "dep:libc"]
lockdep-baseline = ["ax-std", "dep:axfs-ng-vfs", "ax-std/alloc"]
lockdep-detect = [
    "ax-std",
    "dep:axfs-ng-vfs",
    "axfs-ng-vfs/lockdep",
    "ax-std/alloc",
    "ax-std/lockdep",
]
# `task-irq` needs the preemptive round-robin runtime. Cargo features are
# additive, so enabling it here would also run the FIFO-oriented bulk cases
# under that scheduler. The xtask default run dispatches this existing selector
# as a separate kernel after the `all` kernel.
all = [
    "memtest",
    "task-yield",
    "task-affinity",
    "task-wait-queue",
    "task-wait-queue-remote-wake",
    "task-ipi",
    "task-mutex",
    "task-tls",
    "task-parallel",
    "task-priority",
    "task-sleep",
    "net-loopback",
    "fs-basic",
    "debug-backtrace",
    "display-basic",
    "eventfd-epoll",
    "exception-breakpoint",
    "futex-errno-order",
    "lockdep-baseline",
]

[dependencies]
ax-driver = { workspace = true, optional = true }
ax-hal = { workspace = true, optional = true }
ax-std = { workspace = true, optional = true, features = ["default"] }
axbacktrace = { workspace = true, optional = true }
axfs-ng-vfs = { workspace = true, optional = true }
axpoll = { workspace = true, optional = true }
embedded-graphics = { version = "0.8", optional = true }
libc = { workspace = true, optional = true }
rand = { version = "0.8", default-features = false, features = ["small_rng"], optional = true }
