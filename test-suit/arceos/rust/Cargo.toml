[package]
name = "arceos-test-suit"
version = "0.3.1"
edition.workspace = true
publish = false

[features]
board-cpu-tests = ["task-runtime", "dep:cpu-tests"]
default = []
# Every kernel test reaches ax-std through this feature, so it owns the ArceOS
# baseline instead of relying on axbuild to add it for the selected test case.
ax-std = ["dep:ax-cpu", "dep:ax-driver", "dep:ax-hal", "dep:ax-std", "ax-std/arceos"]
memtest = ["ax-std", "ax-std/alloc"]
mem-stage1-transition = ["task-runtime", "ax-std/alloc", "ax-std/ipi", "ax-std/paging"]
task-runtime = ["ax-std"]
cpu-capacity = ["task-runtime"]
serial-rx = ["task-runtime", "dep:ax-runtime", "ax-runtime/fault-injection"]
task-yield = ["task-runtime", "ax-std/fp-simd"]
task-affinity = ["task-runtime"]
# Kept outside the general batch: device workers have no CPU hotplug park contract.
task-cpu-lifecycle = ["dep:ax-task", "task-runtime", "dep:ax-runtime", "ax-runtime/fault-injection", "ax-std/paging", "dep:ax-mm"]
task-fair-idle-pull = ["task-runtime", "ax-std/alloc"]
task-fair-wake-idle-sibling = ["task-runtime"]
task-wait-queue = ["task-runtime", "dep:ax-runtime", "ax-runtime/fault-injection", "ax-std/tls"]
task-wait-queue-remote-wake = ["task-runtime", "ax-std/ipi"]
task-ipi = ["task-runtime", "ax-std/alloc", "ax-std/ipi", "dep:ax-ipi", "ax-ipi/fault-injection"]
task-irq = ["task-runtime"]
task-kernel-timer = ["task-runtime"]
task-executor = ["task-runtime"]
task-tls = ["task-runtime", "ax-std/tls", "ax-std/alloc"]
task-pi-mutex = ["task-runtime", "dep:ax-task", "ax-task/fault-injection"]
task-preempt-guard = ["task-runtime"]
task-priority = ["task-runtime", "ax-std/alloc"]
task-rt-policy = ["task-runtime", "ax-std/alloc"]
task-scheduler-irq-window = ["task-runtime", "ax-std/ipi", "ax-std/qperf-metrics"]
task-sleep = ["task-runtime"]
task-stack-guard-page = ["task-runtime", "ax-std/paging"]
task-mutex = ["task-runtime", "ax-std/alloc", "dep:libc"]
net-http = ["ax-std", "ax-driver/virtio-net", "ax-std/net"]
# Owns the Unix namespace provider; run separately from the filesystem suite.
net-unix-path = ["task-runtime", "ax-driver/virtio-net", "ax-std/net"]
# Owns raw block controllers; must run outside the filesystem-enabled general kernel.
virtio-block-lifecycle = [
    "dep:ax-runtime",
    "ax-std",
    "ax-driver/virtio-blk",
    "ax-std/alloc",
    "dep:ax-alloc",
    "dep:axklib",
    "dep:dma-api",
    "dep:rdif-block",
    "dep:rdrive",
    "dep:virtio-drivers",
    "dep:zerocopy",
]
fs-basic = ["ax-std", "ax-driver/nvme", "ax-std/alloc", "ax-std/fatfs"]
intel-itco-qemu = ["ax-std", "dep:intel-itco-watchdog"]
nvme-qemu = [
    "ax-std",
    "ax-driver/nvme",
    "ax-std/alloc",
    "ax-std/fatfs",
    "dep:ax-fs-ng",
    "dep:ax-block",
    "ax-fs-ng/fat",
]
iommu-dma = [
    "ax-std",
    "ax-driver/nvme",
    "ax-driver/arm-smmu-v3",
    "ax-driver/iommu-dma-test",
    "ax-std/alloc",
    "ax-std/fatfs",
    "dep:dma-api",
    "dep:mmio-api",
    "dep:rdrive",
    "dep:rdif-iommu",
]
debug-backtrace = ["ax-std", "dep:axbacktrace", "ax-std/backtrace", "ax-std/fs"]
debug-panic-path = ["ax-std", "dep:axbacktrace", "ax-std/backtrace", "ax-std/fs"]
display-basic = ["ax-std", "ax-driver/virtio-gpu", "ax-std/display"]
eventfd-epoll = ["ax-std", "ax-std/fd", "dep:libc"]
exception-breakpoint = ["ax-std"]
lockdep-baseline = ["ax-std", "dep:axfs-ng-vfs", "ax-std/alloc"]
lockdep-detect = [
    "ax-std",
    "dep:axfs-ng-vfs",
    "axfs-ng-vfs/lockdep",
    "ax-std/alloc",
    "ax-std/lockdep",
]

[dependencies]
cpu-tests = { package = "arceos-cpu-tests", path = "../cpu", optional = true }
ax-alloc = { workspace = true, optional = true }
axklib = { workspace = true, optional = true }
dma-api = { workspace = true, optional = true }
rdif-block = { workspace = true, optional = true }
rdrive = { workspace = true, optional = true }
virtio-drivers = { workspace = true, optional = true }
zerocopy = { workspace = true, optional = true }
ax-mm = { workspace = true, optional = true }
ax-runtime = { workspace = true, optional = true }
ax-task = { workspace = true, optional = true }
ax-cpu = { workspace = true, optional = true }
ax-driver = { workspace = true, optional = true }
ax-fs-ng = { workspace = true, optional = true }
ax-block = { workspace = true, optional = true, features = ["cache"] }
ax-hal = { workspace = true, optional = true }
ax-ipi = { workspace = true, optional = true }
ax-memory-addr.workspace = true
ax-std = { workspace = true, optional = true, features = ["default"] }
axbacktrace = { workspace = true, optional = true }
axfs-ng-vfs = { workspace = true, optional = true }
intel-itco-watchdog = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
mmio-api = { workspace = true, optional = true }
rdif-iommu = { workspace = true, optional = true }

[build-dependencies]
arceos-test-build = { path = "../build-support" }
toml = { workspace = true, features = ["parse", "serde"] }

[package.metadata.clippy.board_suite]
path = "../board-orangepi-5-plus/suite.toml"
