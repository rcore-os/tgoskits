[package]
name = "arceos-test-suit"
version = "0.3.1"
edition.workspace = true
publish = false

[features]
default = []
std = []
# Every kernel test reaches ax-std through this feature, so it owns the ArceOS
# baseline instead of relying on axbuild to add it for the selected test case.
ax-std = ["dep:ax-driver", "dep:ax-hal", "dep:ax-std", "ax-std/arceos"]
memtest = ["ax-std", "dep:rand", "ax-std/alloc", "ax-std/multitask"]
task-runtime = ["ax-std", "ax-std/multitask"]
task-yield = ["task-runtime", "ax-std/task-test-hooks"]
sched-rr = ["task-runtime", "ax-std/alloc"]
sched-cfs = ["task-runtime", "ax-std/alloc"]
task-affinity = ["task-runtime", "ax-std/task-test-hooks"]
task-fair-idle-pull = [
    "task-runtime",
    "ax-std/alloc",
    "ax-std/irq",
    "ax-std/task-test-hooks",
]
task-fair-wake-idle-sibling = [
    "task-runtime",
    "ax-std/irq",
    "ax-std/task-test-hooks",
]
task-wait-queue = ["task-runtime", "ax-std/irq", "ax-std/task-test-hooks"]
task-wait-queue-remote-wake = [
    "task-runtime",
    "ax-std/irq",
    "ax-std/ipi",
    "ax-std/task-test-hooks",
]
task-ipi = [
    "task-runtime",
    "ax-std/alloc",
    "ax-std/irq",
    "ax-std/ipi",
    "ax-std/task-test-hooks",
]
task-irq = ["task-runtime", "ax-std/irq"]
task-kernel-timer = ["task-runtime", "ax-std/irq", "ax-std/task-test-hooks"]
task-tls = ["task-runtime", "ax-std/tls", "ax-std/alloc"]
task-parallel = ["task-runtime", "dep:rand", "ax-std/alloc", "ax-std/irq"]
task-pi-mutex = ["task-runtime", "ax-std/task-test-hooks"]
task-preempt-guard = ["task-runtime", "ax-std/task-test-hooks"]
task-priority = ["task-runtime", "ax-std/alloc"]
task-rt-policy = [
    "task-runtime",
    "ax-std/alloc",
    "ax-std/task-test-hooks",
]
task-sleep = ["task-runtime", "ax-std/irq"]
task-smp-online = ["task-runtime", "ax-std/irq", "ax-std/ipi"]
task-stack-guard-page = ["task-runtime", "ax-std/paging", "ax-std/stack-guard-page"]
net-loopback = ["ax-std", "ax-driver/virtio-net", "ax-std/net", "ax-std/dns"]
fs-basic = ["ax-std", "ax-driver/nvme", "ax-std/alloc", "ax-std/fatfs"]
debug-backtrace = ["ax-std", "dep:axbacktrace", "ax-std/backtrace"]
debug-panic-path = ["ax-std", "dep:axbacktrace", "ax-std/backtrace"]
display-basic = ["ax-std", "ax-driver/virtio-gpu", "dep:embedded-graphics", "ax-std/display"]
eventfd-epoll = ["ax-std", "ax-std/fd"]
exception-breakpoint = ["ax-std"]
exception-page-fault = ["ax-std", "ax-std/paging"]
lockdep-baseline = ["ax-std", "dep:axfs-ng-vfs", "ax-std/alloc", "ax-std/multitask"]
lockdep-detect = [
    "ax-std",
    "dep:axfs-ng-vfs",
    "axfs-ng-vfs/lockdep",
    "ax-std/alloc",
    "ax-std/multitask",
    "ax-std/lockdep",
]
all = [
    "memtest",
    "task-yield",
    "task-affinity",
    "task-fair-idle-pull",
    "task-fair-wake-idle-sibling",
    "task-wait-queue",
    "task-wait-queue-remote-wake",
    "task-ipi",
    "task-irq",
    "task-kernel-timer",
    "task-tls",
    "task-parallel",
    "task-pi-mutex",
    "task-preempt-guard",
    "task-priority",
    "task-rt-policy",
    "task-sleep",
    "net-loopback",
    "fs-basic",
    "debug-backtrace",
    "display-basic",
    "eventfd-epoll",
    "exception-breakpoint",
    "lockdep-baseline",
]

[dependencies]
ax-driver = { workspace = true, optional = true }
ax-hal = { workspace = true, optional = true }
ax-std = { workspace = true, optional = true, features = ["default"] }
axbacktrace = { workspace = true, optional = true }
axfs-ng-vfs = { workspace = true, optional = true }
embedded-graphics = { version = "0.8", optional = true }
rand = { version = "0.8", default-features = false, features = ["small_rng"], optional = true }
