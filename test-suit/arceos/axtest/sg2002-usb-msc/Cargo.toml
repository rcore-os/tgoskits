[package]
name = "arceos-axtest-sg2002-usb-msc"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = []
ax-std = ["dep:ax-hal", "dep:ax-runtime", "dep:ax-std"]
axtest = [
    "ax-std",
    "dep:ax-driver",
    "dep:ax-task",
    "dep:axplat-dyn",
    "dep:crab-usb",
    "dep:rdrive",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(axtest)'] }

[dependencies]
ax-driver = { workspace = true, optional = true }
ax-hal = { workspace = true, optional = true }
ax-runtime = { workspace = true, optional = true }
ax-std = { workspace = true, optional = true, features = ["default"] }
ax-task = { workspace = true, optional = true }
axplat-dyn = { workspace = true, optional = true }
crab-usb = { workspace = true, optional = true }
rdrive = { workspace = true, optional = true }

[[test]]
name = "axtest"
path = "tests/axtest.rs"
harness = false
required-features = ["axtest"]

[dev-dependencies]
axtest = { path = "../../../../components/axtest/axtest" }
ax-hal = { path = "../../../../os/arceos/modules/axhal" }
ax-std = { path = "../../../../os/arceos/ulib/axstd", features = ["default"] }

[package.metadata.axtest]
runtime = "board"

[package.metadata.docs.rs]
targets = ["riscv64gc-unknown-none-elf"]
