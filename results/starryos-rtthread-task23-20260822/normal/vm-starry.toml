# StarryOS controller Guest for the in-hypervisor virtio-net switch.
# The PCI host is passed through only for the NVMe root disk; the network
# endpoint remains an AxVisor virtual virtio-net device.
[base]
id = 1
name = "task2-starry-switch"
guest_type = "passthrough"
cpu_num = 1
phys_cpu_ids = [1]
phys_cpu_sets = [1]

[kernel]
entry_point = 0x4020_0000
image_location = "memory"
kernel_path = "${workspace}/target/aarch64-unknown-none-softfloat/release/starryos.bin"
kernel_load_addr = 0x4020_0000
dtb_load_addr = 0x5f00_0000
memory_regions = [[0x4000_0000, 0x2000_0000, 0x7, 1]]

[devices]
passthrough = [{ path = "/pcie@10000000" }]
disabled = []

[[devices.virtual]]
id = "virtnet0"
model = "virtio-net"
guest_mac = [0x52, 0x54, 0x00, 0x12, 0x34, 0x15]
