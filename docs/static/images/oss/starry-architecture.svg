<text x="204.0" y="483" font-size="17" font-weight="400" text-anchor="middle">信号模型与处理</text>
</g>
<g><rect x="386.0" y="424" width="328.0" height="80" rx="12" fill="var(--os-diagram-cell, #fff)" stroke="var(--os-diagram-border, #d7e2e9)" stroke-width="1.5"/>
<text x="550.0" y="454" font-size="22" font-weight="650" text-anchor="middle">starry-vm</text>
<text x="550.0" y="483" font-size="17" font-weight="400" text-anchor="middle">用户地址空间与映射</text>
</g>
<g><rect x="732.0" y="424" width="328.0" height="80" rx="12" fill="var(--os-diagram-cell, #fff)" stroke="var(--os-diagram-border, #d7e2e9)" stroke-width="1.5"/>
<text x="896.0" y="454" font-size="22" font-weight="650" text-anchor="middle">内核扩展能力</text>
<text x="896.0" y="483" font-size="17" font-weight="400" text-anchor="middle">kmod · tracepoint · perf 等</text>
</g>
<path d="M550 505V523m-6-8 6 8 6-8" fill="none" stroke="var(--os-diagram-arrow, #779bab)" stroke-width="2"/>
<g><rect x="40.0" y="534" width="1020.0" height="80" rx="12" fill="var(--os-diagram-accent-bg, #e6f4ee)" stroke="var(--os-accent, #0f766e)" stroke-width="1.5"/>
<text x="550.0" y="564" font-size="22" font-weight="650" text-anchor="middle">ArceOS 运行时与硬件抽象</text>
<text x="550.0" y="593" font-size="17" font-weight="400" text-anchor="middle">ax-runtime · ax-task · ax-sync · ax-mm · ax-hal</text>
</g>
<path d="M550 615V633m-6-8 6 8 6-8" fill="none" stroke="var(--os-diagram-arrow, #779bab)" stroke-width="2"/>
<g><rect x="40.0" y="644" width="328.0" height="80" rx="12" fill="var(--os-diagram-cell, #fff)" stroke="var(--os-diagram-border, #d7e2e9)" stroke-width="1.5"/>
<text x="204.0" y="674" font-size="22" font-weight="650" text-anchor="middle">文件系统能力</text>
<text x="204.0" y="703" font-size="17" font-weight="400" text-anchor="middle">ax-fs-ng · axfs-ng-vfs · rsext4</text>
</g>
<g><rect x="386.0" y="644" width="328.0" height="80" rx="12" fill="var(--os-diagram-cell, #fff)" stroke="var(--os-diagram-border, #d7e2e9)" stroke-width="1.5"/>
<text x="550.0" y="674" font-size="22" font-weight="650" text-anchor="middle">网络与设备</text>
<text x="550.0" y="703" font-size="17" font-weight="400" text-anchor="middle">ax-net · ax-driver · rdrive</text>
</g>
<g><rect x="732.0" y="644" width="328.0" height="80" rx="12" fill="var(--os-diagram-cell, #fff)" stroke="var(--os-diagram-border, #d7e2e9)" stroke-width="1.5"/>
<text x="896.0" y="674" font-size="22" font-weight="650" text-anchor="middle">共享基础能力</text>
<text x="896.0" y="703" font-size="17" font-weight="400" text-anchor="middle">ax-cpu · ax-alloc · ax-io</text>
</g>
<path d="M550 725V743m-6-8 6 8 6-8" fill="none" stroke="var(--os-diagram-arrow, #779bab)" stroke-width="2"/>
<g><rect x="40.0" y="754" width="1020.0" height="80" rx="12" fill="var(--os-diagram-accent-bg, #e6f4ee)" stroke="var(--os-accent, #0f766e)" stroke-width="1.5"/>
<text x="550.0" y="784" font-size="22" font-weight="650" text-anchor="middle">平台契约与启动</text>
<text x="550.0" y="813" font-size="17" font-weight="400" text-anchor="middle">ax-plat · axplat-dyn · somehal · someboot</text>
</g>
<path d="M550 835V852m-6-8 6 8 6-8" fill="none" stroke="var(--os-diagram-arrow, #779bab)" stroke-width="2"/>
<g><rect x="40.0" y="862" width="1020.0" height="66" rx="12" fill="var(--os-diagram-cell, #fff)" stroke="var(--os-diagram-border, #d7e2e9)" stroke-width="1.5"/>
<text x="550.0" y="884" dominant-baseline="central" font-size="22" font-weight="650" text-anchor="middle">目标环境</text>
<text x="550.0" y="910" dominant-baseline="central" font-size="17" font-weight="400" text-anchor="middle">AArch64 · RISC-V · x86_64 · LoongArch / QEMU 与实体板卡</text>
