<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img">
  <title>三套系统共享组件与运行基础</title>
  <desc>ArceOS 提供组件化运行时，AxVisor 管理虚拟机，Starry 实现 Linux 用户态兼容。三者复用工作区组件，AxVisor 和 Starry 同时复用 ArceOS 基础运行能力。</desc>
  <g font-family="system-ui, sans-serif" fill="var(--os-diagram-text, #263d4a)">
    <g fill="none" stroke="var(--os-diagram-arrow, #92b7bb)" stroke-width="2">
      <path d="M160 158v39h580v-39M450 158v72m-6-8 6 8 6-8M450 338v54m-6-8 6 8 6-8"/>
      <path d="M80 448H15M820 448h65" stroke-dasharray="5 7"/>
    </g>
    <g>
      <rect x="32" y="54" width="256" height="104" rx="18" fill="var(--os-diagram-cell, #fff)" stroke="var(--os-accent, #0f766e)"/>
      <text x="160" y="99" text-anchor="middle" font-size="29" font-weight="700">ArceOS</text>
      <text x="160" y="132" text-anchor="middle" font-size="19">组件化 Unikernel</text>
    </g>
    <g>
      <rect x="322" y="54" width="256" height="104" rx="18" fill="var(--os-diagram-cell, #fff)" stroke="var(--os-overview-purple, #997bc2)"/>
      <text x="450" y="99" text-anchor="middle" font-size="29" font-weight="700">AxVisor</text>
      <text x="450" y="132" text-anchor="middle" font-size="19">Type-I Hypervisor</text>
    </g>
    <g>
      <rect x="612" y="54" width="256" height="104" rx="18" fill="var(--os-diagram-cell, #fff)" stroke="var(--os-overview-blue, #6395c9)"/>
      <text x="740" y="99" text-anchor="middle" font-size="29" font-weight="700">Starry</text>
      <text x="740" y="132" text-anchor="middle" font-size="19">Linux 用户态兼容</text>
    </g>
    <g>
      <rect x="120" y="238" width="660" height="100" rx="20" fill="var(--os-diagram-accent-bg, #e6f4ee)" stroke="var(--os-accent, #0f766e)"/>
      <text x="450" y="278" text-anchor="middle" font-size="25" font-weight="650">ArceOS 基础运行能力</text>
      <text x="450" y="312" text-anchor="middle" font-size="19">runtime · task · memory · HAL</text>
    </g>
    <g>
      <rect x="70" y="404" width="760" height="88" rx="16" fill="var(--os-diagram-cell, #fff)" stroke="var(--os-diagram-border, #d7e2e9)"/>
      <text x="450" y="440" text-anchor="middle" font-size="23" font-weight="650">共享组件与平台适配</text>
      <text x="450" y="472" text-anchor="middle" font-size="18">内存 · 调度 · 驱动 · 文件系统 · 网络 · 虚拟化 · 平台</text>
    </g>
  </g>
</svg>
