<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">任务、内存、驱动、I/O、CPU 与虚拟机组件的组合示意</title><desc id="desc">TGOSKits 系统与组件概念示意，不表示物理硬件布局。</desc>
<defs>
<linearGradient id="metal" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#e8eff4"/><stop offset="1" stop-color="#bacbd8"/></linearGradient>
<linearGradient id="edge" x2="0" y2="1"><stop stop-color="#c7d6df"/><stop offset="1" stop-color="#879eae"/></linearGradient>
<linearGradient id="teal" x2="1" y2="1"><stop stop-color="#6be8d3"/><stop offset="1" stop-color="#147f86"/></linearGradient>
<linearGradient id="blue" x2="1" y2="1"><stop stop-color="#a5c6ff"/><stop offset="1" stop-color="#4869c4"/></linearGradient>
<linearGradient id="violet" x2="1" y2="1"><stop stop-color="#d9c7ff"/><stop offset="1" stop-color="#8063b5"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#8edfd2" stop-opacity=".3"/><stop offset="1" stop-color="#8edfd2" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-40%" y="-50%" width="180%" height="220%"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#0b293c" flood-opacity=".16"/></filter>
</defs>
<g font-family="system-ui, sans-serif"><ellipse cx="500" cy="350" rx="450" ry="230" fill="url(#glow)"/><g transform="translate(500 300) rotate(-25) skewX(25) scale(1 .8) translate(-500 -300)"><g transform="translate(145 320)" filter="url(#shadow)">
<path d="M0 0 710 0 710 135 0 135Z" fill="url(#edge)" transform="translate(0 15)"/>
<rect width="710" height="135" rx="12" fill="url(#metal)" stroke="#fff" stroke-opacity=".7"/>
<rect x="10" y="10" width="690" height="115" rx="8" fill="none" stroke="#fff" stroke-opacity=".35"/>

</g><g transform="translate(145 100)" filter="url(#shadow)">
<path d="M0 0 210 0 210 105 0 105Z" fill="url(#edge)" transform="translate(0 15)"/>
<rect width="210" height="105" rx="12" fill="url(#teal)" stroke="#fff" stroke-opacity=".7"/>
<rect x="10" y="10" width="190" height="85" rx="8" fill="none" stroke="#fff" stroke-opacity=".35"/>
<text x="105.0" y="57.5" fill="#16364a" text-anchor="middle" font-size="26" font-weight="650">TASK</text>
</g><g transform="translate(395 100)" filter="url(#shadow)">
<path d="M0 0 210 0 210 105 0 105Z" fill="url(#edge)" transform="translate(0 15)"/>
<rect width="210" height="105" rx="12" fill="url(#blue)" stroke="#fff" stroke-opacity=".7"/>
<rect x="10" y="10" width="190" height="85" rx="8" fill="none" stroke="#fff" stroke-opacity=".35"/>
<text x="105.0" y="57.5" fill="#16364a" text-anchor="middle" font-size="26" font-weight="650">MEMORY</text>
</g><g transform="translate(645 100)" filter="url(#shadow)">
<path d="M0 0 210 0 210 105 0 105Z" fill="url(#edge)" transform="translate(0 15)"/>
<rect width="210" height="105" rx="12" fill="url(#violet)" stroke="#fff" stroke-opacity=".7"/>
<rect x="10" y="10" width="190" height="85" rx="8" fill="none" stroke="#fff" stroke-opacity=".35"/>
<text x="105.0" y="57.5" fill="#16364a" text-anchor="middle" font-size="26" font-weight="650">DRIVER</text>
</g><g transform="translate(145 265)" filter="url(#shadow)">
<path d="M0 0 210 0 210 105 0 105Z" fill="url(#edge)" transform="translate(0 15)"/>
<rect width="210" height="105" rx="12" fill="url(#blue)" stroke="#fff" stroke-opacity=".7"/>
<rect x="10" y="10" width="190" height="85" rx="8" fill="none" stroke="#fff" stroke-opacity=".35"/>
<text x="105.0" y="57.5" fill="#16364a" text-anchor="middle" font-size="26" font-weight="650">I/O</text>
</g><g transform="translate(395 265)" filter="url(#shadow)">
<path d="M0 0 210 0 210 105 0 105Z" fill="url(#edge)" transform="translate(0 15)"/>
<rect width="210" height="105" rx="12" fill="url(#violet)" stroke="#fff" stroke-opacity=".7"/>
<rect x="10" y="10" width="190" height="85" rx="8" fill="none" stroke="#fff" stroke-opacity=".35"/>
<text x="105.0" y="57.5" fill="#16364a" text-anchor="middle" font-size="26" font-weight="650">CPU</text>
</g><g transform="translate(645 265)" filter="url(#shadow)">
<path d="M0 0 210 0 210 105 0 105Z" fill="url(#edge)" transform="translate(0 15)"/>
<rect width="210" height="105" rx="12" fill="url(#teal)" stroke="#fff" stroke-opacity=".7"/>
<rect x="10" y="10" width="190" height="85" rx="8" fill="none" stroke="#fff" stroke-opacity=".35"/>
<text x="105.0" y="57.5" fill="#16364a" text-anchor="middle" font-size="26" font-weight="650">VM</text>
</g></g></g></svg>