<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
  <title id="title">启动期每 CPU 区域布局</title><desc id="desc">一次 early bump 分配包含多个相同 stride 的 CPU 区域。</desc>
  <style>.h{font:700 24px sans-serif;fill:#0f172a}.t{font:600 16px sans-serif;fill:#0f172a}.s{font:14px sans-serif;fill:#334155}.outer{fill:#f8fafc;stroke:#64748b;stroke-width:2}.data{fill:#dbeafe;stroke:#3b82f6}.meta{fill:#f5f3ff;stroke:#8b5cf6}.pad{fill:#f1f5f9;stroke:#94a3b8}.stack{fill:#dcfce7;stroke:#22c55e}.part{stroke-width:2}</style>
  <text x="550" y="38" text-anchor="middle" class="h">someboot 每 CPU 预分配区域</text>
  <rect x="45" y="75" width="1010" height="190" rx="16" class="outer"/><text x="65" y="102" class="t">一次 early bump allocation</text>
  <g transform="translate(70 125)"><rect width="290" height="100" rx="10" class="outer"/><text x="145" y="22" text-anchor="middle" class="t">CPU 0 · area_stride</text><rect x="12" y="38" width="70" height="45" class="part data"/><rect x="82" y="38" width="60" height="45" class="part meta"/><rect x="142" y="38" width="38" height="45" class="part pad"/><rect x="180" y="38" width="98" height="45" class="part stack"/></g>
  <g transform="translate(405 125)"><rect width="290" height="100" rx="10" class="outer"/><text x="145" y="22" text-anchor="middle" class="t">CPU 1 · area_stride</text><rect x="12" y="38" width="70" height="45" class="part data"/><rect x="82" y="38" width="60" height="45" class="part meta"/><rect x="142" y="38" width="38" height="45" class="part pad"/><rect x="180" y="38" width="98" height="45" class="part stack"/></g>
  <g transform="translate(740 125)"><rect width="290" height="100" rx="10" class="outer"/><text x="145" y="22" text-anchor="middle" class="t">CPU N · area_stride</text><rect x="12" y="38" width="70" height="45" class="part data"/><rect x="82" y="38" width="60" height="45" class="part meta"/><rect x="142" y="38" width="38" height="45" class="part pad"/><rect x="180" y="38" width="98" height="45" class="part stack"/></g>
  <rect x="160" y="285" width="20" height="16" class="part data"/><text x="187" y="298" class="s">linker data</text><rect x="360" y="285" width="20" height="16" class="part meta"/><text x="387" y="298" class="s">PerCpuMeta</text><rect x="575" y="285" width="20" height="16" class="part pad"/><text x="602" y="298" class="s">page padding</text><rect x="775" y="285" width="20" height="16" class="part stack"/><text x="802" y="298" class="s">boot stack</text>
</svg>
