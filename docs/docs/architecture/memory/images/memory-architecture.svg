<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">TGOSKits 内存管理总体架构</title>
  <desc id="desc">展示启动事实、公共机制、并列地址空间策略和设备能力边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.group{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.boot{fill:#fff7ed;stroke:#f97316}.core{fill:#eff6ff;stroke:#3b82f6}.policy{fill:#f5f3ff;stroke:#8b5cf6}.device{fill:#ecfdf5;stroke:#10b981}.box{stroke-width:2;rx:12}.label{font:600 18px sans-serif;fill:#0f172a}.small{font:14px sans-serif;fill:#334155}.head{font:700 23px sans-serif;fill:#0f172a}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}</style>
  </defs>
  <text x="600" y="34" text-anchor="middle" class="head">TGOSKits 内存管理总体架构</text>
  <rect x="35" y="62" width="1130" height="130" rx="18" class="group boot"/>
  <text x="60" y="92" class="label">启动事实与交接</text>
  <rect x="70" y="112" width="200" height="54" class="box boot"/><text x="170" y="135" text-anchor="middle" class="label">UEFI / U-Boot</text><text x="170" y="155" text-anchor="middle" class="small">DTB 与固件内存表</text>
  <rect x="340" y="112" width="200" height="54" class="box boot"/><text x="440" y="135" text-anchor="middle" class="label">someboot</text><text x="440" y="155" text-anchor="middle" class="small">固定容量内存图</text>
  <rect x="610" y="112" width="220" height="54" class="box boot"/><text x="720" y="135" text-anchor="middle" class="label">启动页表与对象</text><text x="720" y="155" text-anchor="middle" class="small">early bump 所有权</text>
  <rect x="900" y="112" width="220" height="54" class="box boot"/><text x="1010" y="135" text-anchor="middle" class="label">axplat-dyn / ax-hal</text><text x="1010" y="155" text-anchor="middle" class="small">规范化 Free / Reserved / MMIO</text>
  <path d="M270 139H340M540 139H610M830 139H900" class="line"/>
  <rect x="35" y="220" width="1130" height="230" rx="18" class="group core"/>
  <text x="60" y="251" class="label">公共运行时机制</text>
  <rect x="75" y="280" width="220" height="60" class="box core"/><text x="185" y="304" text-anchor="middle" class="label">ax-alloc</text><text x="185" y="326" text-anchor="middle" class="small">页、内核堆、用途统计</text>
  <rect x="75" y="365" width="220" height="60" class="box core"/><text x="185" y="389" text-anchor="middle" class="label">buddy-slab-allocator</text><text x="185" y="411" text-anchor="middle" class="small">多 section Buddy + 每 CPU Slab</text>
  <rect x="360" y="280" width="220" height="60" class="box core"/><text x="470" y="304" text-anchor="middle" class="label">page-table-generic</text><text x="470" y="326" text-anchor="middle" class="small">无架构递归遍历</text>
  <rect x="360" y="365" width="220" height="60" class="box core"/><text x="470" y="389" text-anchor="middle" class="label">ax-memory-addr</text><text x="470" y="411" text-anchor="middle" class="small">地址与半开范围</text>
  <rect x="645" y="280" width="220" height="60" class="box core"/><text x="755" y="304" text-anchor="middle" class="label">Host Stage-1</text><text x="755" y="326" text-anchor="middle" class="small">axcpu + ax-hal</text>
  <rect x="645" y="365" width="220" height="60" class="box core"/><text x="755" y="389" text-anchor="middle" class="label">Guest Stage-2</text><text x="755" y="411" text-anchor="middle" class="small">axvm 架构适配</text>
  <rect x="930" y="322" width="190" height="60" class="box core"/><text x="1025" y="346" text-anchor="middle" class="label">ax-memory-set</text><text x="1025" y="368" text-anchor="middle" class="small">区域与 backend</text>
  <path d="M185 340V365M470 340V365M580 310H645M580 395H645M865 352H930" class="line"/>
  <path d="M1010 166V200H185V280" class="line"/>
  <rect x="35" y="478" width="790" height="235" rx="18" class="group policy"/>
  <text x="60" y="509" class="label">并列地址空间策略</text>
  <rect x="75" y="545" width="210" height="80" class="box policy"/><text x="180" y="574" text-anchor="middle" class="label">ArceOS ax-mm</text><text x="180" y="598" text-anchor="middle" class="small">内核与用户 Stage-1</text>
  <rect x="325" y="545" width="210" height="80" class="box policy"/><text x="430" y="574" text-anchor="middle" class="label">Starry kernel mm</text><text x="430" y="598" text-anchor="middle" class="small">Linux VMA / COW / RSS</text>
  <rect x="575" y="545" width="210" height="80" class="box policy"/><text x="680" y="574" text-anchor="middle" class="label">axaddrspace</text><text x="680" y="598" text-anchor="middle" class="small">客户机 GPA 策略</text>
  <text x="430" y="677" text-anchor="middle" class="small">三套策略共享机制，但分别拥有页表状态、页帧协议和错误语义</text>
  <path d="M180 545V465H755V425M430 545V450H1025V382M680 545V450H755V425" class="line"/>
  <rect x="855" y="478" width="310" height="235" rx="18" class="group device"/>
  <text x="880" y="509" class="label">设备能力边界</text>
  <rect x="895" y="545" width="230" height="60" class="box device"/><text x="1010" y="570" text-anchor="middle" class="label">dma-api + axklib</text><text x="1010" y="592" text-anchor="middle" class="small">可达性与缓存所有权</text>
  <rect x="895" y="625" width="230" height="60" class="box device"/><text x="1010" y="650" text-anchor="middle" class="label">mmio-api + axklib</text><text x="1010" y="672" text-anchor="middle" class="small">寄存器映射与易失访问</text>
  <path d="M895 575H825V310H295" class="line dash"/><path d="M895 655H825V352H930" class="line dash"/>
  <text x="600" y="744" text-anchor="middle" class="small">实线表示直接机制依赖；虚线表示平台能力或资源来源注入</text>
</svg>
