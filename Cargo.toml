[workspace.package]
edition = "2024"
version = "0.5.15"
authors = ["RCore Team <yuchen@tsinghua.edu.cn>"]
license = "Apache-2.0"
repository = "https://github.com/rcore-os/tgoskits"
keywords = ["arceos", "kernel"]
categories = ["os", "no-std"]

[profile.release]
lto = false

[workspace]
resolver = "3"
members = [
    "apps/starry/orangepi-5-plus-uvc/rust",

    "bootloader/axloader",

    "components/axtest/axtest",
    "components/axtest/axtest_macros",
    "components/cpu-local",
    "components/ax-cgroup",
    "components/ax-lazyinit",
    "components/axbacktrace",
    "components/axcpu",
    "components/axio",
    "components/axklib",
    "components/axpanic",
    "components/axpoll",
    "components/ax-tracepoint",
    "components/axsched",
    "components/cpumask",
    "components/crate_interface",
    "components/irq-framework",
    "components/kasm-aarch64",
    "components/kernutil",
    "components/linked_list_r4l",
    "components/scope-local",
    "components/timer_list",
    "platforms/ax-plat",
    "platforms/ax-plat-macros",
    "platforms/axplat-dyn",
    "platforms/someboot",
    "platforms/somehal",
    "platforms/somehal-macros",
    "components/crate_interface/test_crates/*",
    "components/ctor_bare/ctor_bare",
    "components/ctor_bare/ctor_bare_macros",
    "fs/ax-fs-ng",
    "fs/axfs-ng-vfs",
    "fs/rsext4",
    "memory/*",
    "virtualization/*",
    "virtualization/test_crates/virtualization-tests",
    "components/percpu/percpu",
    "components/percpu/percpu_macros",

    "drivers/ax-driver",
    "drivers/blk/*",
    "drivers/examples/*",
    "drivers/firmware/*",
    "drivers/gpu/*",
    "drivers/intc/*",
    "drivers/interface/*",
    "drivers/net/*",
    "drivers/npu/*",
    "drivers/pci/*",
    "drivers/pwm/*",
    "drivers/rdrive*",
    "drivers/rtc/*",
    "drivers/serial/*",
    "drivers/soc/rockchip/*",
    "drivers/test_crates/*",
    "drivers/tpu/*",
    "drivers/vpu/*",
    "drivers/usb/test_crates/*",
    "drivers/usb/usb-device/hid/*",
    "drivers/usb/usb-device/uvc",
    "drivers/usb/usb-host",
    "drivers/usb/usb-if",
    "drivers/usb/usb-serial",
    "drivers/usb/utils/*",

    "os/StarryOS/kernel",
    "os/StarryOS/signal",
    "os/StarryOS/starryos",
    "os/StarryOS/vm",
    "os/arceos/api/*",
    "os/arceos/modules/axdisplay",
    "os/arceos/modules/axhal",
    "os/arceos/modules/axinput",
    "os/arceos/modules/axipi",
    "os/arceos/modules/axlog",
    "os/arceos/modules/axmm",
    "net/ax-net",
    "os/arceos/modules/axruntime",
    "os/arceos/modules/axsync",
    "os/arceos/modules/axtask",
    "os/arceos/tools/bwbench_client",
    "os/arceos/tools/deptool",
    "os/arceos/tools/raspi4/chainloader",
    "os/arceos/ulib/*",
    "os/axvisor",
    "scripts/axbuild",
    "test-suit/arceos/loongarch/unaligned-fixup",
    "test-suit/arceos/axtest/sg2002-usb-msc",
    "test-suit/arceos/rust",
    "test-suit/arceos/std/smoke",
    "apps/arceos/*",
    "apps/starry/qemu/rust-hello/rust",
    "tools/qperf",
    "tools/qperf/analyzer",
    "xtask",
    "os/StarryOS/lkm/*",
]
exclude = [
    "os/StarryOS/lkm/linux-hello",
    "virtualization/test_crates",
]

[workspace.dependencies]
# Local workspace crates
# Keep local dependency requirements at major.minor precision so release-plz does not
# propagate patch-only releases to dependent workspace crates.
aarch64_sysreg = { version = "0.3", path = "virtualization/aarch64_sysreg" }
arm-scmi-rs = { version = "0.1", path = "drivers/firmware/arm-scmi-rs" }
arceos-test-suit = { version = "0.3", path = "test-suit/arceos/rust" }
arm_vcpu = { version = "0.5", path = "virtualization/arm_vcpu" }
arm_vgic = { version = "0.6", path = "virtualization/arm_vgic" }
ax-alloc = { version = "0.8", path = "memory/ax-alloc", default-features = false }
ax-api = { version = "0.7", path = "os/arceos/api/arceos_api" }
