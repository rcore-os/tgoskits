[package]
name = "axdevice"
version = "0.8.5"
description = "A reusable, OS-agnostic device abstraction layer designed for virtual machines."
repository = "https://github.com/arceos-hypervisor/axdevice"
keywords = ["hypervisor"]
authors = ["Su Mingxian <aarkegz@gmail.com>"]
documentation = "https://docs.rs/axdevice"
categories = ["virtualization"]
edition.workspace = true
license = "Apache-2.0"

[features]
host-test = ["ax-sync/host-test"]

[dependencies]
log = "0.4"
# Ordinary device state uses the task-sleepable `ax_sync::Mutex`, which is
# gated behind `ax-sync/sleep`; the native provider is supplied by the kernel
# runtime and a host test provider by the packages' test support modules.
ax-sync = { workspace = true, features = ["sleep"] }

# System independent crates provided by ArceOS.
axdevice_base = { workspace = true, features = ["runtime-internal"] }
axvm-types = { workspace = true }
thiserror = { workspace = true }
[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv_vplic = { workspace = true }
[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_vlapic = { workspace = true }

[[bench]]
name = "lookup_DeviceRuntime"
harness = false

[dev-dependencies]
ax-sync = { path = "../../os/arceos/modules/axsync", features = ["host-test"] }
ax-crate-interface = { workspace = true }
divan = "0.1.21"
paste = "1.0"
rand = { version = "0.10", features = ["std_rng"] }
