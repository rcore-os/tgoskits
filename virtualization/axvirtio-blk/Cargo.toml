[package]
name = "axvirtio-blk"
version = "0.1.0"
edition.workspace = true
authors = ["Debin <luodeb@outlook.com>"]
license.workspace = true
repository.workspace = true
description = "VirtIO block device implementation with MMIO transport for hypervisors"
keywords = ["virtio", "block", "hypervisor", "no_std", "arceos"]
categories = ["no-std", "embedded", "hardware-support"]
readme = "README.md"

[features]
default = []

[dependencies]
axvirtio-common.workspace = true
axaddrspace.workspace = true
axdevice_base.workspace = true
axvm-types.workspace = true
log.workspace = true
ax-sync.workspace = true

[dev-dependencies]
ax-memory-addr.workspace = true
ax-sync = { workspace = true, features = ["host-test"] }
