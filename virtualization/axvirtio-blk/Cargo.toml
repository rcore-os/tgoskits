[package]
name = "axvirtio-blk"
version = "0.4.2"
edition.workspace = true
authors = ["Debin <luodeb@outlook.com>"]
license.workspace = true
repository.workspace = true
description = "VirtIO block device implementation with MMIO transport for hypervisors"
keywords = ["virtio", "block", "hypervisor", "no_std", "arceos"]
categories = ["no-std", "embedded", "hardware-support"]

[features]
default = []

[dependencies]
axvirtio-common.workspace = true
axaddrspace.workspace = true
axdevice_base.workspace = true
axvm-types.workspace = true
log.workspace = true
# Ordinary transport/backend state uses the task-sleepable `ax_sync::Mutex`,
# which is gated behind `ax-sync/sleep`; the native provider is supplied by the
# kernel runtime and a host test provider by the packages' test support modules.
ax-sync = { workspace = true, features = ["sleep"] }

[dev-dependencies]
ax-memory-addr = { path = "../../memory/memory_addr" }
ax-sync = { path = "../../os/arceos/modules/axsync", features = ["host-test"] }
ax-crate-interface = { workspace = true }
