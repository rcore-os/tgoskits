[package]
name = "axplat-dyn"
version = "0.9.1"
authors = ["周睿 <zrufo747@outlook.com>"]
categories.workspace = true
description = "A dynamic platform module for ArceOS, providing runtime platform detection and configuration"
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["smp"]
smp = ["ax-plat/smp"]
rtc = []
efi = ["somehal/efi"]
fp-simd = ["ax-cpu/fp-simd"]
# Request kernel TLS; `uspace` takes precedence and disables kernel TLS.
tls = ["somehal/tls", "ax-cpu/tls", "cpu-local/tls"]
# Enable userspace support without kernel TLS, including when `tls` is enabled.
# User-space TLS remains available through the userspace context APIs.
uspace = ["somehal/uspace", "ax-cpu/uspace", "cpu-local/uspace"]
hv = ["somehal/hv"]
thead-mae = ["somehal/thead-mae", "ax-cpu/riscv-thead-mae"]

[dependencies]
anyhow = { workspace = true }
ax-cpu.workspace = true
cpu-local.workspace = true
ax-driver.workspace = true
ax-lazyinit.workspace = true
axklib = { workspace = true, features = ["buddy-slab"] }
ax-plat.workspace = true
heapless = "0.9"
log.workspace = true
ax-memory-addr.workspace = true
ax-percpu.workspace = true
rdrive.workspace = true
someboot.workspace = true
somehal.workspace = true
thiserror.workspace = true

[package.metadata.axplat]
platform = "dyn"
arch = "aarch64"
crate = "axplat_dyn"
dynamic = true
