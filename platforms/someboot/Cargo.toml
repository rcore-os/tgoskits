[package]
authors = ["周睿 <zrufo747@outlook.com>"]
categories = ["embedded", "no-std"]
description = "Sparreal OS kernel"
edition.workspace = true
keywords = ["os"]
license = "MPL-2.0"
name = "someboot"
repository.workspace = true
version = "0.7.2"

[[package.metadata.clippy.configurations]]
name = "x86_64-bare"
target = "x86_64-unknown-none"

[[package.metadata.clippy.configurations]]
name = "aarch64-efi"
target = "aarch64-unknown-none-softfloat"
features = ["efi"]

[[package.metadata.clippy.configurations]]
name = "riscv64-bare"
target = "riscv64gc-unknown-none-elf"

[[package.metadata.clippy.configurations]]
name = "loongarch64-efi"
target = "loongarch64-unknown-none-softfloat"
features = ["efi"]

[[package.metadata.clippy.configurations]]
name = "loongarch64-efi-handoff"
target = "loongarch64-unknown-none-softfloat"
features = ["efi-handoff"]

[features]
efi = []
boot-resources = []
efi-handoff = ["efi", "boot-resources"]
hv = []
mmu = []
thead-mae = ["ax-cpu/riscv-thead-mae"]
tls = []
# Enable userspace support without kernel TLS, including when `tls` is enabled.
# User-space TLS remains available through the userspace context APIs.
uspace = ["mmu"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(axtest)', 'cfg(axtest_coverage)'] }

[dependencies]
thiserror.workspace = true
log = "0.4"

[target.'cfg(not(target_os = "uefi"))'.dependencies]
ax-cpu.workspace = true
trait-ffi.workspace = true
acpi = "6.0.1"
anyhow = { workspace = true, default-features = false }
arrayvec = { version = "0.7", default-features = false }
bit_field = "0.10"
byte-unit = { workspace = true }
byteorder = { version = "1", default-features = false }
fdt-edit.workspace = true
fdt-raw.workspace = true
heapless = "0.9"
kernutil = { workspace = true }
num-align = "0.1"
page-table-generic = { workspace = true }
ranges-ext = { workspace = true }
some-serial.workspace = true
somehal-macros = { workspace = true }
tock-registers.workspace = true

[target.'cfg(all(target_arch = "loongarch64", not(target_os = "uefi")))'.dependencies]
loongArch64 = "0.2"
uefi.workspace = true
uefi-raw.workspace = true

[target.'cfg(all(target_arch = "aarch64", not(target_os = "uefi")))'.dependencies]
aarch64-cpu = "11"
smccc = "0.2"
uefi.workspace = true
uefi-raw.workspace = true

[target.'cfg(all(target_arch = "x86_64", not(target_os = "uefi")))'.dependencies]
uefi.workspace = true
uefi-raw.workspace = true
x86 = "0.52"

[target.'cfg(all(target_arch = "riscv64", not(target_os = "uefi")))'.dependencies]
sbi-rt = { workspace = true, features = ["legacy"] }

[target.'cfg(target_os = "uefi")'.dependencies]
uefi.workspace = true
uefi-raw.workspace = true

[[package.metadata.clippy.configurations]]
name = "x86_64-uefi-library"
target = "x86_64-unknown-uefi"
features = ["efi-handoff"]

[[package.metadata.clippy.configurations]]
name = "loongarch64-resources"
target = "loongarch64-unknown-none-softfloat"
features = ["boot-resources"]

[build-dependencies]
prettyplease = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
libc.workspace = true
