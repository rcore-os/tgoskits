args = [
  "-nographic",
  "-accel",
  "tcg,thread=multi",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-device",
  "virtio-blk-device,drive=disk0",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
  "-append",
  "root=/dev/vda rw init=/bin/sh",
  "-m",
  "8g",
]
fail_regex = [
  "(?m)^AXVISOR_RT_RUN_FAILED.*$",
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
]
success_regex = ["(?m)^AXVISOR_RT_RUN_COMPLETE$"]
shell_prefix = "~ #"
shell_init_cmd = "/axvisor-rt-run"
timeout = 1800
to_bin = true
uefi = false
