# Experimental diagnostic variant: expose one NVMe MSI-X vector to the
# passthrough StarryOS Guest while keeping the dual-Guest network topology.
args = [
  "-display", "none",
  "-monitor", "none",
  "-serial", "unix:${workspace}/tmp/net-dual-guest/serial-starry-zephyr-msix1.sock,server,nowait",
  "-cpu", "cortex-a72",
  "-machine", "virt,virtualization=on,gic-version=3",
  "-smp", "2",
  "-m", "8g",
  "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=1",
  "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
  "-append", "root=/dev/nvme0n1 rw init=/init",
  "-qmp", "unix:${workspace}/tmp/net-dual-guest/qmp-starry-zephyr-msix1.sock,server,nowait",
]
fail_regex = ["TASK2_ERROR=", "(?i)panic"]
success_regex = ["STARRY_T2N1_PASS"]
to_bin = true
uefi = false
