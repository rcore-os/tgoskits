# Two-Guest StarryOS/Zephyr switch run.  Two host CPUs are required because
# the Starry passthrough Guest owns one physical CPU while AxVisor remains on
# the other; the Zephyr virtual Guest shares the host CPU with the switch.
args = [
  "-display", "none",
  "-monitor", "none",
  "-serial", "unix:${workspace}/tmp/net-dual-guest/serial-starry-zephyr.sock,server,nowait",
  "-cpu", "cortex-a72",
  "-machine", "virt,virtualization=on,gic-version=3",
  "-smp", "2",
  "-m", "8g",
  "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
  "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
  "-append", "root=/dev/nvme0n1 rw init=/init",
  "-snapshot",
  "-qmp", "unix:${workspace}/tmp/net-dual-guest/qmp-starry-zephyr.sock,server,nowait",
]
fail_regex = ["TASK2_ERROR=", "(?i)panic"]
success_regex = ["STARRY_T2N1_PASS"]
to_bin = true
uefi = false
