# Task 1 evidence capture waits for the serial client before boot so the
# AxVisor scheduler-selection marker is retained. Both scheduler arms use this
# file with the RT-Thread shared-pCPU Guest.
args = [
  "-display", "none",
  "-monitor", "none",
  "-serial", "unix:${workspace}/tmp/net-dual-guest/serial-starry-rtthread-task1-capture.sock,server",
  "-cpu", "cortex-a72",
  "-machine", "virt,virtualization=on,gic-version=3",
  "-smp", "2",
  "-m", "8g",
  "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=1",
  "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
  "-append", "root=/dev/nvme0n1 rw init=/init",
  "-snapshot",
  "-qmp", "unix:${workspace}/tmp/net-dual-guest/qmp-starry-rtthread-task1-capture.sock,server,nowait",
]
fail_regex = ["TASK2_ERROR=", "(?i)panic"]
success_regex = ["NEVER_MATCH_EVIDENCE_CAPTURE"]
timeout = 180
to_bin = true
uefi = false
