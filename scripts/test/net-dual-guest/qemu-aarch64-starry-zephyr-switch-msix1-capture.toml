# Evidence capture variant of the dual-Guest StarryOS/Zephyr topology.
args = [
  "-display", "none",
  "-monitor", "none",
  "-serial", "unix:/tmp/tgoskits-task123/serial-starry-zephyr-msix1-capture.sock,server,nowait",
  "-cpu", "cortex-a72",
  "-machine", "virt,virtualization=on,gic-version=3",
  "-smp", "2",
  "-m", "8g",
  "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=1",
  "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
  "-append", "root=/dev/nvme0n1 rw init=/init",
  "-qmp", "unix:/tmp/tgoskits-task123/qmp-starry-zephyr-msix1-capture.sock,server,nowait",
]
fail_regex = ["TASK2_ERROR=", "(?i)panic"]
success_regex = ["NEVER_MATCH_EVIDENCE_CAPTURE"]
timeout = 180
to_bin = true
uefi = false
