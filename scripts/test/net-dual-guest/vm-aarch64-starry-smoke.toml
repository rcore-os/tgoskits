# StarryOS replacement smoke Guest for AxVisor.
#
# This is deliberately separate from vm-aarch64-p2-linux.toml.  The Guest
# kernel is the AArch64 StarryOS raw image; its userspace network endpoint is
# injected into the Alpine rootfs by apps/starry/starryos-task2.
[base]
id = 1
name = "task2-starry-smoke"
guest_type = "virtualized"
cpu_num = 1
phys_cpu_ids = [1]
phys_cpu_sets = [1]

[kernel]
entry_point = 0x8020_0000
image_location = "memory"
kernel_path = "${workspace}/target/aarch64-unknown-none-softfloat/release/starryos.bin"
kernel_load_addr = 0x8000_0000
dtb_load_addr = 0x9f00_0000
memory_regions = [
  [0x8000_0000, 0x2000_0000, 0x7, 0],
]

[devices]
passthrough = []
disabled = []

[[devices.virtual]]
id = "virtnet0"
model = "virtio-net"
guest_mac = [0x52, 0x54, 0x00, 0x12, 0x34, 0x15]
