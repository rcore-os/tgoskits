# StarryOS Guest replacing the Linux controller in the QEMU/AxVisor path.
# The outer QEMU exposes NVMe and virtio-net below the PCIe host node; this VM
# receives that node as a passthrough device and boots the Starry raw kernel
# at the same 0x40200000 physical load address used by qemu-aarch64.toml.
[base]
id = 1
name = "task2-starry-passthrough"
guest_type = "passthrough"
cpu_num = 1
phys_cpu_ids = [1]
phys_cpu_sets = [1]

[kernel]
entry_point = 0x4020_0000
image_location = "memory"
kernel_path = "${workspace}/target/aarch64-unknown-none-softfloat/release/starryos.bin"
kernel_load_addr = 0x4020_0000
dtb_load_addr = 0x5f00_0000
memory_regions = [
  [0x4000_0000, 0x2000_0000, 0x7, 1],
]

[devices]
passthrough = [{ path = "/pcie@10000000" }]
passthrough_irqs = [16]
disabled = []
