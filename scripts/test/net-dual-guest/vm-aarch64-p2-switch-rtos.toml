# P2-SWITCH Zephyr managed guest. Memory is MAP_ALLOC; the raw binary is
# linked at the base of its own guest-physical region.
[base]
id = 2
name = "task2-p2-switch-zephyr"
guest_type = "virtualized"
cpu_num = 1
phys_cpu_ids = [0]

[kernel]
entry_point = 0xA000_117C
image_location = "memory"
kernel_path = "${workspace}/tmp/net-dual-guest/zephyr-task2/zephyr-task2.bin"
kernel_load_addr = 0xA000_0000
dtb_load_addr = 0xA7F0_0000
memory_regions = [[0xA000_0000, 0x2000_0000, 0x7, 0]]

[devices]
passthrough = []
disabled = []

[[devices.virtual]]
id = "virtnet0"
model = "virtio-net"
guest_mac = [0x52, 0x54, 0x00, 0x12, 0x34, 0x02]
