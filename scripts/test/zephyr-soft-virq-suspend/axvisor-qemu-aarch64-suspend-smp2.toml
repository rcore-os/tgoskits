# Cross-vCPU targeted-wake experiment: vCPU0 parks idle via PSCI CPU_SUSPEND,
# vCPU1 receives the software vIRQ; the injector targets vCPU1 only.
[base]
id = 2
name = "zephyr-qemu-software-virq-suspend-smp2"
vm_type = 1
cpu_num = 2
phys_cpu_ids = [0, 1]

[kernel]
entry_point = 0x4000_114c
image_location = "memory"
kernel_path = "/tmp/zephyr-soft-virq-suspend-build/zephyr/zephyr.bin"
kernel_load_addr = 0x4000_0000
dtb_load_addr = 0x47e0_0000
memory_regions = [
  [0x4000_0000, 0x0800_0000, 0x7, 0],
]

[devices]
interrupt_mode = "emulated"
passthrough_devices = [
  ["/pl011@9000000"],
  ["/intc@8000000"],
  ["/timer"],
]
passthrough_addresses = []
excluded_devices = []
emu_devices = [
  ["gppt-gicd", 0x0800_0000, 0x1_0000, 0, 0x21, []],
  ["gppt-gicr", 0x080a_0000, 0x2_0000, 0, 0x20, [2, 0x2_0000, 0]],
]
