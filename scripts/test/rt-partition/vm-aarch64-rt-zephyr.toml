# RT-PARTITION Zephyr guest: 1 vCPU dedicated to physical CPU 1.
#
# The pCPU is exclusively owned by this guest (no other host task or vCPU is
# placed on pCPU 1); the hypervisor, virtio-net switch, and shell all stay on
# pCPU 0. Interrupts and the virtual timer are passthrough/emulated per the
# selected guest profile so the steady-state VM-exit rate can drop to ~0
# after the T1.1 tick isolation change.
[base]
id = 2
name = "rt-partition-zephyr"
guest_type = "virtualized"
cpu_num = 1
phys_cpu_ids = [1]
host_sched_priority = 90

[kernel]
entry_point = 0xA000_117C
image_location = "memory"
kernel_path = "${workspace}/tmp/rt-partition/zephyr-rt.bin"
kernel_load_addr = 0xA000_0000
dtb_load_addr = 0xA7F0_0000
memory_regions = [[0xA000_0000, 0x2000_0000, 0x7, 0]]

[devices]
passthrough = []
disabled = []

[[devices.virtual]]
id = "virtnet0"
model = "virtio-net"
guest_mac = [0x52, 0x54, 0x00, 0x12, 0x34, 0x02]
