[package]
name = "ax-config"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared host-side build configuration and runtime parameter validation"

[features]
default = []
toml = ["dep:toml", "dep:figment"]
schema = ["dep:schemars"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
toml = { workspace = true, optional = true, features = ["serde", "parse", "display"] }
figment = { workspace = true, optional = true, default-features = false }
schemars = { workspace = true, optional = true, features = ["derive"] }
