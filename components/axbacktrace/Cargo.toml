[package]
name = "axbacktrace"
version = "0.4.8"
description = "Backtrace for ArceOS"
authors = ["Mivik <mivikq@gmail.com>", "朝倉水希 <asakuramizu111@gmail.com>"]
repository = "https://github.com/Starry-OS/axbacktrace"
edition.workspace = true
keywords = ["DWARF", "debug", "backtrace", "unwinding"]
categories = ["development-tools::debugging"]
license = "Apache-2.0"

[features]
alloc = []
dwarf = ["dep:addr2line", "dep:gimli", "dep:paste", "alloc"]
axtest = ["alloc"]

[dependencies]
axpanic = { workspace = true }
cfg-if = "1"
log = "0.4"
ax-lazyinit.workspace = true

addr2line = { version = "0.26", default-features = false, optional = true, features = [
    "cpp_demangle",
    "rustc-demangle",
] }
gimli = { version = "0.33", default-features = false, optional = true, features = [
    "read-core",
    "endian-reader",
] }
paste = { version = "1", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(axtest)'] }

[[test]]
name = "axtest"
path = "tests/axtest.rs"
harness = false
required-features = ["axtest"]

[dev-dependencies.axtest]
path = "../axtest/axtest"

[dev-dependencies.ax-std]
path = "../../os/arceos/ulib/axstd"
features = ["default"]

[dev-dependencies.ax-hal]
path = "../../os/arceos/modules/axhal"

[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-none",
    "aarch64-unknown-none-softfloat",
    "riscv64gc-unknown-none-elf",
    "loongarch64-unknown-none-softfloat",
]
