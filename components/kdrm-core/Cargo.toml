[package]
name = "kdrm-core"
version = "0.1.0"
edition.workspace = true
license = "MIT"
authors = ["TheKernel contributors"]
description = "Portable Linux DRM core for the TGOSKits display stack"
repository.workspace = true

[features]
default = []

[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-none",
    "aarch64-unknown-none-softfloat",
    "riscv64gc-unknown-none-elf",
    "loongarch64-unknown-none-softfloat",
]

[dependencies]
drm-kapi.workspace = true
spin.workspace = true
