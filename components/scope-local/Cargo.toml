[package]
name = "scope-local"
version = "0.4.5"
edition.workspace = true
description = "Scope local storage"
authors = ["朝倉水希 <asakuramizu111@gmail.com>"]
keywords = ["arceos"]
repository = "https://github.com/Starry-OS/scope-local"
license = "Apache-2.0"

[features]
axtest = ["dep:axtest"]
host-test = ["ax-sync/host-test", "cpu-local/host-test"]

[dependencies]
ax-lazyinit.workspace = true
ax-percpu.workspace = true
ax-sync.workspace = true
cpu-local.workspace = true
axtest = { workspace = true, optional = true }

[dev-dependencies]
ax-sync.workspace = true
ctor = "0.6"
ax-percpu = { workspace = true, features = ["host-test"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(axtest)'] }
