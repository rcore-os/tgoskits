[package]
name = "ax-task"
version = "0.7.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "OS-independent IRQ-safe SMP task scheduling core"

[lib]
test = false

[[test]]
name = "effective_schedule_axtest"
path = "tests/effective_schedule_axtest.rs"
harness = false
required-features = ["axtest"]

[features]
default = []
axtest = ["dep:axtest"]
qperf-metrics = []
host-test = ["smp"]
lockdep = ["dep:axpanic"]
smp = []
task-test-hooks = []

[dependencies]
axpanic = { workspace = true, optional = true }
axtest = { workspace = true, optional = true }
cfg-if.workspace = true
lock_api.workspace = true
thiserror.workspace = true
trait-ffi = "0.2.11"

[target.'cfg(target_arch = "riscv64")'.dependencies]
sbi-rt = { workspace = true, features = ["legacy"] }

[dev-dependencies]
axtest.workspace = true
ax-hal.workspace = true
ax-std = { workspace = true, features = ["default"] }
loom.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(axtest)'] }
