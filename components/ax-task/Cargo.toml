[package]
name = "ax-task"
version = "0.7.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "OS-independent IRQ-safe SMP task scheduling core"

[features]
default = []
qperf-metrics = []
# The final runtime selects the host or OS PiMutexTaskOps provider. ax-task's
# host compatibility must not select ax-sync's independent host waiter ABI.
host-test = ["smp"]
lockdep = ["ax-sync/lockdep"]
smp = []

[dependencies]
ax-crate-interface.workspace = true
ax-sync = { workspace = true, features = ["lock-api", "sleep"] }
cfg-if.workspace = true
lock_api.workspace = true
thiserror.workspace = true
trait-ffi = "0.2.11"

[dev-dependencies]
loom.workspace = true
