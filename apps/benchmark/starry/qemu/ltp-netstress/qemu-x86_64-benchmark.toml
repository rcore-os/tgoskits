args = [
    "-machine", "q35",
    "-accel", "tcg,thread=multi",
    "-nographic",
    "-m", "512M",
    "-smp", "4",
    "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-x86_64-alpine.img,snapshot=on",
]
uefi = true
to_bin = true
fail_regex = [
    "(?i)kernel panic",
    "(?m)^ARCEOS_PANIC_EMERGENCY",
    "(?m)^panicked at ",
    "(?m)^LTP_NETSTRESS_APP_FAILED:",
]
timeout = 900

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = "/usr/bin/ltp-netstress-run bench"
success_regex = ["(?m)^LTP_NETSTRESS_APP_PASSED mode=bench\\s*$"]
