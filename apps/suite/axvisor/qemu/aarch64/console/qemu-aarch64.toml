args = [
    "-nographic",
    "-snapshot",
    "-cpu",
    "cortex-a72",
    "-machine",
    "virt,virtualization=on,gic-version=3",
    "-smp",
    "4",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-append",
    "root=/dev/nvme0n1 rw init=/bin/sh",
    "-m",
    "8g",
]
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)kernel panic",
    "(?i)I/O error",
    "sleeping or rescheduling is not allowed in atomic context",
    "Axvisor host console output worker stopped",
    "Axvisor host console output stopped",
]
timeout = 960
to_bin = true
uefi = false

[axbuild]
checks = [
    "tests/interleave.toml",
    "tests/atomic-output.toml",
]
