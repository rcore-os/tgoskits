timeout = 300
requires = ["prepare-guest.toml"]

[[shell_check_steps]]
fail_regex = ["(?i)\\bpanic(?:ked)?\\b", "(?i)I/O error", "(?m)^✗ "]
shell_prefix = "axvisor:/$"
shell_cmd = "vm list"
success_regex = ["(?m)^VM ID\\s+NAME\\s+STATUS"]
timeout = 60

[[shell_check_steps]]
fail_regex = ["(?i)\\bpanic(?:ked)?\\b", "(?i)I/O error", "(?m)^✗ "]
shell_cmd = "vm suspend 3"
success_regex = ["(?m)^\\[.*VM\\[3\\] paused\\s*$", "(?m)^✓ VM\\[3\\] suspended\\s*$", "(?m)^  1/1 VCpu task\\(s\\) parked at the VMExit boundary\\s*$"]
timeout = 60

[[shell_check_steps]]
fail_regex = ["(?i)\\bpanic(?:ked)?\\b", "(?i)I/O error", "(?m)^✗ "]
shell_cmd = "vm resume 3"
success_regex = ["(?m)^\\[.*VM\\[3\\] resumed\\b", "(?m)^✓ VM\\[3\\] resumed successfully\\s*$"]
timeout = 60

[[shell_check_steps]]
fail_regex = ["(?i)\\bpanic(?:ked)?\\b", "(?i)I/O error", "(?m)^✗ "]
shell_cmd = "echo CONSOLE_INTERLEAVE_OK"
success_regex = ["(?m)^CONSOLE_INTERLEAVE_OK\\s*$"]
timeout = 30
