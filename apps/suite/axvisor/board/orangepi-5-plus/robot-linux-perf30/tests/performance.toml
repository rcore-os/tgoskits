requires = ["guest-session.toml"]

[[shell_check_steps]]
shell_prefix = "orangepi@orangepi5plus:~"
shell_cmd = "printf \"%s\\n\" orangepi | sudo -S sh -c '\nset -eu\ntrap '\\''printf \"[AXVISOR_PERF_PROFILE] RESULT=%s reason=devfreq\\\\n\" FAIL'\\'' EXIT\nnpu=0\ndmc=0\nfor dir in /sys/class/devfreq/*; do\n  [ -d \"$dir\" ] || continue\n  name=$(cat \"$dir/name\" 2>/dev/null || basename \"$dir\")\n  name_lc=$(printf \"%s\" \"$name\" | tr \"[:upper:]\" \"[:lower:]\")\n  case \"$name_lc\" in\n    *rknpu*|*npu*) class=npu; npu=$((npu + 1)) ;;\n    *dmc*) class=dmc; dmc=$((dmc + 1)) ;;\n    *) continue ;;\n  esac\n  grep -qw performance \"$dir/available_governors\"\n  printf performance > \"$dir/governor\"\n  [ \"$(cat \"$dir/governor\")\" = performance ]\n  printf \"[AXVISOR_PERF_PROFILE] node=%s class=%s governor=%s cur=%s max=%s\\n\" \\\n    \"$name\" \"$class\" \"$(cat \"$dir/governor\")\" \\\n    \"$(cat \"$dir/cur_freq\" 2>/dev/null || printf unknown)\" \\\n    \"$(cat \"$dir/max_freq\" 2>/dev/null || printf unknown)\"\ndone\n[ \"$npu\" -gt 0 ]\ndriver=$(cat /sys/devices/system/cpu/cpufreq/policy0/scaling_driver 2>/dev/null || true)\ngovernor=$(cat /sys/devices/system/cpu/cpufreq/policy0/scaling_governor 2>/dev/null || true)\nif [ -n \"$driver\" ]; then\n  if [ \"$driver\" != virt-cpufreq ]; then\n    result_marker=\"[AXVISOR_PERF_PROFILE] RESULT=\"\n    reason_marker=\"CPUFREQ_GUEST_DRIVER_UNEXPECTED\"\n    printf \"%sFAIL reason=%s driver=%s\\\\n\" \"$result_marker\" \"$reason_marker\" \"$driver\"\n    exit 1\n  fi\n  printf \"[AXVISOR_PERF_PROFILE] guest_cpufreq driver=%s governor=%s\\n\" \"$driver\" \"$governor\"\n  [ \"$governor\" = performance ]\nelse\n  printf \"[AXVISOR_PERF_PROFILE] CPUFREQ_VIRT_UNAVAILABLE_HOST_PERF\\n\"\nfi\ntrap - EXIT\nif [ \"$dmc\" -eq 0 ]; then\n  printf \"[AXVISOR_PERF_PROFILE] DMC_DEVFREQ_UNAVAILABLE_FIRMWARE\\n\"\nfi\nprintf \"[AXVISOR_PERF_PROFILE] RESULT=PASS npu=%s dmc=%s\\n\" \"$npu\" \"$dmc\"\n'\n"
success_regex = ["(?m)^\\[AXVISOR_PERF_PROFILE\\] RESULT=PASS npu=[1-9][0-9]* dmc=[0-9]+\\s*$"]
