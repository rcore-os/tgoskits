CONFIG_TGOS_IVC=y
CONFIG_ARM_MMU=y
# Size xlat tables for uncached BAR mappings from two large owner slices,
# the original GIC/UART, and PCI ECAM; the default 12 is insufficient.
CONFIG_MAX_XLAT_TABLES=32
CONFIG_PCIE=y
CONFIG_PCIE_CONTROLLER=y
CONFIG_PCIE_MSI=y
CONFIG_PCIE_MSI_X=y
CONFIG_PCIE_MSI_MULTI_VECTOR=y
CONFIG_GIC_V3_ITS=y
CONFIG_DYNAMIC_INTERRUPTS=y
# Reserve 2 MiB for GICv3 ITS setup: two ITS instances use 2 x 512 KiB
# device tables, plus collection/LPI tables and alignment.
CONFIG_HEAP_MEM_POOL_SIZE=2097152
CONFIG_KERNEL_VM_SIZE=0x02000000
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_PRINTK=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_SPEED_OPTIMIZATIONS=y
