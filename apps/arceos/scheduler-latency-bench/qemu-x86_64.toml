args = ["-machine", "q35", "-cpu", "max", "-m", "256M", "-smp", "1", "-nographic", "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65", "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/runtime-assets/apps/arceos/scheduler-latency-bench/disk.img", "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0", "-serial", "mon:stdio"]
# Dynamic-platform PIE images boot through the same UEFI path as the Rust suite.
uefi = true
to_bin = true
fail_regex = ["(?i)\\bpanic(?:ked)?\\b"]
timeout = 120

[[shell_check_steps]]
success_regex = ["KERNEL_SCHED_BENCH_PASSED"]
