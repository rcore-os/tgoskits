[package]
name = "arceos-scheduler-latency-bench"
version = "0.1.0"
edition.workspace = true
authors = ["RCore Team <yuchen@tsinghua.edu.cn>"]
publish = false

[features]
default = ["arceos"]
arceos = ["dep:ax-std", "ax-std/arceos"]
qperf-metrics = ["ax-std/qperf-metrics", "ax-runtime/qperf-metrics"]

[dependencies]
ax-std = { workspace = true, optional = true, features = ["default"] }
ax-runtime = { workspace = true }
