[package]
name = "arceos-helloworld"
version = "0.1.0"
edition.workspace = true
authors = ["eternalcomet <mydragonos@outlook.com>"]
publish = false

[features]
default = ["arceos"]
arceos = ["dep:ax-std", "ax-std/arceos"]
loong-efi-smoke = ["initramfs-smoke", "ax-std/efi", "dep:someboot", "dep:ax-alloc"]
cmdline-smoke = ["arceos", "dep:ax-hal"]
initramfs-smoke = ["cmdline-smoke", "ax-std/fs", "dep:ax-fs-ng"]
boot-resources-smoke = ["arceos", "ax-std/efi", "dep:someboot"]
block-root-smoke = ["initramfs-smoke", "ax-std/ext4fs", "ax-std/nvme"]

[dependencies]
ax-std = { workspace = true, optional = true, features = ["default"] }
ax-hal = { workspace = true, optional = true }
ax-fs-ng = { workspace = true, optional = true }

someboot = { workspace = true, optional = true, features = ["boot-resources"] }

ax-alloc = { workspace = true, optional = true }

[[package.metadata.clippy.configurations]]
name = "loongarch64-efi-reclaim"
target = "loongarch64-unknown-linux-musl"
features = ["loong-efi-smoke"]
