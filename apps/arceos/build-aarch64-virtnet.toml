# ArceOS guest build config for the AxVisor virtio-net smoke test.
# Enables the virtio-mmio net frontend driver and the ArceOS net stack so the
# guest can probe the AxVisor-emulated device and run the UDP echo app. The
# virtio,mmio device is described by the guest DTB (generated by axvm), so no
# QEMU virtio-net device argument is used.
env = { AX_IP = "10.0.0.2/24", AX_GW = "0.0.0.0", AX_NET_DEV = "virtio-net" }
features = ["net", "multitask", "ax-driver/virtio-net"]
log = "Info"
target = "aarch64-unknown-none-softfloat"
max_cpu_num = 1
