[package]
name = "arceos-ivshmem-pci"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = ["arceos"]
arceos = ["dep:ax-mm", "dep:ax-std", "ax-std/arceos"]

[dependencies]
ax-mm = { workspace = true, optional = true }
ax-std = { workspace = true, optional = true, features = ["default"] }
