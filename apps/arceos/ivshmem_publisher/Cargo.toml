[package]
name = "ivshmem_publisher"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = ["arceos"]
arceos = ["dep:ax-mm", "dep:ax-std", "ax-std/arceos", "dep:fdt-parser", "dep:axvisor-ivshmem"]

[dependencies]
ax-mm = { workspace = true, optional = true }
ax-std = { workspace = true, optional = true, features = ["default"] }
fdt-parser = { version = "0.4", optional = true }
axvisor-ivshmem = { workspace = true, optional = true }

[[bin]]
name = "ivshmem-publisher"
path = "src/main.rs"
