[package]
name = "arceos-vcpu-perf"
version = "0.1.0"
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["aarch64-unknown-linux-musl"]

[features]
default = ["arceos"]
arceos = ["dep:ax-std", "ax-std/arceos"]

[dependencies]
ax-std = { workspace = true, optional = true, features = ["default"] }
