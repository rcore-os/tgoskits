[package]
name = "arceos-ivc-subscriber"
version = "0.1.0"
edition.workspace = true
authors = ["AxVisor Team"]
publish = false

[features]
default = []
arceos = [
  "dep:ax-std",
  "dep:arceos-ivshmem-pci",
  "ax-std/arceos",
  "ax-std/paging",
  "ax-std/alloc",
]

[dependencies]
ax-std = { workspace = true, optional = true, features = ["default"] }
axivc.workspace = true
arceos-ivshmem-pci = { path = "../ivshmem-pci", optional = true }

[lib]
name = "arceos_ivc_subscriber"
path = "src/lib.rs"

[package.metadata.axstd]
features = ["log-level-info"]
