# AxVisor + StarryOS real robot control check (AxVisor Nightly only).
#
# The current-checkout StarryOS guest runs the robot application from the
# fixed directory /home/orangepi/robot/aka-rk3588-single. The launcher uses the USB
# camera 0ac8:0346 and Feetech USB controller 1a86:55d3 through FEETECH_DEV=auto.
board_type = "BallPick-Robot"
cmdline = "root=/dev/mmcblk0p2 rw console=ttyS2,1500000 earlycon=uart8250,mmio32,0xfeb50000 rootwait rootfstype=ext4 axvisor.vm_start=1"

timeout = 900
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  'Failed to initialize guest VM',
  '(?i)segmentation fault',
  '(?i)SIGSEGV',
  'exit with code: 139',
  '(?m)^(?:\x1b\[[0-9;]*m)*\[ROBOT_CI\] RESULT=FAIL .*$',
  '(?m)^(?:\x1b\[[0-9;]*m)*\[ROBOT_CI\] HARNESS=FAIL .*$',
]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"

[[shell_check_steps]]
# Wait for the guest shell prompt itself: the cmdline echo also contains
# HOSTNAME=starry and would fire this step while the kernel is still booting.
shell_prefix = "root@starry:~#"
shell_cmd = 'd=/home/orangepi/robot/aka-rk3588-single'

[[shell_check_steps]]
shell_prefix = "root@starry:~#"
# Fixed by this test configuration; change this argument to revise the FPS gate.
shell_cmd = 'cd "$d" && FEETECH_DEV=auto ./run_single_pick_ci_once.sh 28.0'
# Only the final launcher verdict counts. A non-zero exit fails the step
# directly, without an echo-based fallback marker.
success_regex = ['(?m)^(?:\x1b\[[0-9;]*m)*\[ROBOT_CI\] RESULT=PASS attempts=[12](?:[ \t\r]*$|\[\s*\d+\.\d+\].*$)']

[[shell_check_steps]]
shell_prefix = "root@starry:~#"
shell_cmd = "sync"
