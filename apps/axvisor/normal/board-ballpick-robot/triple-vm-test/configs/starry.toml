[base]
id = 2
name = "starry"
guest_type = "virtualized"
cpu_num = 1
phys_cpu_ids = [0x300]

[kernel]
entry_point = 0x4008_0000
kernel_load_addr = 0x4008_0000
kernel_path = "/guest/starry/orangepi-5-plus"
# StarryOS names its only whole-disk VirtIO root /dev/sda.
cmdline = 'root=/dev/sda rw init=/bin/sh HOME=/root USER=root HOSTNAME=starry -- -c "cd /root; export PS1=$USER@$HOSTNAME:~#; exec /bin/sh -i"'
dtb_load_addr = 0x4000_0000
memory_regions = [[0x4000_0000, 0x4000_0000, 0x7, 0]]

[devices]
passthrough = []
disabled = []

[[devices.virtual]]
id = "starry-rootfs"
model = "virtio-blk"
path = "/guest/rootfs-aarch64-orangepi-jammy-1.img"
filesystem = "ext4"
