# AxVisor + Linux real robot control check (AxVisor Nightly only).
#
# The Linux guest runs the robot application from the fixed directory
# /home/orangepi/robot/aka-rk3588-single. The launcher uses the USB camera
# 0ac8:0346 and Feetech USB controller 1a86:55d3 through FEETECH_DEV=auto.
# The guest kernel and private rootfs image are
# selected in linux-smp1-emmc.toml. The guest starts a root console shell
# so device access does not depend on image-specific accounts or autologin.
board_type = "BallPick-Robot"
cmdline = "root=/dev/mmcblk0p2 rw console=ttyS2,1500000 earlycon=uart8250,mmio32,0xfeb50000 rootwait rootfstype=ext4 axvisor.vm_start=1"

timeout = 900
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  'Failed to initialize guest VM',
  'VFS: Cannot open root device',
  'Waiting for root device',
  'Waiting for root file system',
  '(?i)segmentation fault',
  '(?i)SIGSEGV',
  'exit with code: 139',
  '(?m)^\[ROBOT_CI\] RESULT=FAIL .*$',
  '(?m)^\[ROBOT_CI\] HARNESS=FAIL .*$',
]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"

[[shell_check_steps]]
shell_prefix = "root@linux:~#"
shell_cmd = 'd=/home/orangepi/robot/aka-rk3588-single'

[[shell_check_steps]]
shell_prefix = "root@linux:~#"
# Fixed by this test configuration; change this argument to revise the FPS gate.
shell_cmd = 'cd "$d" && env FEETECH_DEV=auto ./run_single_pick_ci_once.sh 28.0'
# Only the final launcher verdict counts. A non-zero exit fails the step
# directly, without an echo-based fallback marker.
success_regex = ['(?m)^\[ROBOT_CI\] RESULT=PASS attempts=[12](?:[ \t\r]*$|\[\s*\d+\.\d+\].*$)']

[[shell_check_steps]]
shell_prefix = "root@linux:~#"
shell_cmd = "sync"
