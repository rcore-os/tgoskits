[base]
id = 1
name = "linux"
guest_type = "passthrough"
cpu_num = 1
# Bind the Linux USB/vision workload to the RK3588 A76 core at /cpus/cpu@400
# (MPIDR 0x400), separate from Starry's /cpus/cpu@0 affinity.
phys_cpu_ids = [0x400]

[kernel]
entry_point = 0x2_4008_0000
kernel_load_addr = 0x2_4008_0000
# Guest kernel on the AxVisor host filesystem; the path is maintained manually.
kernel_path = "/guest/linux/orangepi-5-plus"
# The BallPick robot host and guest share the verified /dev/mmcblk0p2 root.
cmdline = "root=/dev/mmcblk0p2 rw console=ttyS2,1500000 earlycon=uart8250,mmio32,0xfeb50000 cpuidle.off=1 rodata=off rootwait rootfstype=ext4 ignore_loglevel loglevel=8 cma=128M"
dtb_load_addr = 0x2_4000_0000
# Boot the ext4 root directly; the standard initramfs only starts a BusyBox shell.
memory_regions = [
    [0xb000_0000, 0x1000_0000, 0x7, 2],
    [0xc000_0000, 0x3000_0000, 0x7, 2],
    [0x2_4000_0000, 0x8000_0000, 0x7, 1],
]

[devices]
passthrough = []
disabled = []
