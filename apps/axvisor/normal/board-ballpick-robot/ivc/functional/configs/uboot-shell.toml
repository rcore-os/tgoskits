# Interactive session; guests are started manually from the AxVisor shell.
# Guest commands and result checks are entered manually.
# Server and port come from the run environment.
board_type = "BallPick-Robot"
cmdline = "root=/dev/mmcblk0p2 rw console=ttyS2,1500000 console=tty1 splash=verbose consoleblank=0 earlycon=uart8250,mmio32,0xfeb50000 cpuidle.off=1 rodata=off rootwait rootfstype=ext4 loglevel=8 usb-storage.quirks= cma=128M cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory swapaccount=1"

shell_check_steps = []
fail_regex = []
