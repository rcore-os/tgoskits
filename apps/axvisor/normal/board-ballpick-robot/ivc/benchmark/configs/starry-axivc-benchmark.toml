[base]
id = 1
name = "starry-axivc-benchmark"
guest_type = "virtualized"
cpu_num = 1
phys_cpu_ids = [0x00]

# Use the published kernel and its independent guest root filesystem.
[kernel]
entry_point = 0x4008_0000
kernel_load_addr = 0x4008_0000
kernel_path = "/guest/starry/orangepi-5-plus"
dtb_load_addr = 0x4000_0000
cmdline = "rw earlycon=uart8250,mmio32,0xfeb50000 cpuidle.off=1 rodata=off rootwait cma=128M init=/bin/sh"

memory_regions = [[0x4000_0000, 0x4000_0000, 0x7, 0]]

[devices]
passthrough = []
disabled = [
  { path = "/serial@feb90000" },
  { path = "/pcie@fe150000" },
  { path = "/pcie@fe160000" },
  { path = "/pcie@fe170000" },
  { path = "/pcie@fe180000" },
  { path = "/pcie@fe190000" },
  { path = "/phy@fee00000" },
  { path = "/phy@fee10000" },
  { path = "/phy@fee20000" },
  { path = "/phy@fee80000" },
]

[[devices.virtual]]
id = "starry-rootfs"
model = "virtio-blk"
path = "/guest/rootfs-aarch64-orangepi-jammy-1.img"
filesystem = "ext4"

[[devices.virtual]]
id = "ivc0"
model = "ivc-channel"
