board_type = "BallPick-Robot"
timeout = 3600
cmdline = "root=/dev/mmcblk0p2 rw console=ttyS2,1500000 earlycon=uart8250,mmio32,0xfeb50000 rootwait rootfstype=ext4 axvisor.vm_start=65"
fail_regex = ['(?i)\bpanic(?:ked)?\b', 'failed to initialize default VMs', '(?m)^SCALE_[A-Z_]*FAILED\r?$', 'Failed to stop VM', 'Failed to remove VM', 'VM[0-9]*_VIRTIO_NET_FAIL']

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 65\n:"
success_regex = ['Attached VM\[65\] console']
timeout = 180

[[shell_check_steps]]
shell_prefix = "root@linux-observer:~#"
shell_cmd = '''
if sh -s <<'LINUX_PREPARE'
set -eu
export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
mkdir -p /proc /sys /dev
mount -t proc proc /proc 2>/dev/null || grep -q ' /proc proc ' /proc/mounts
test -d /sys/class/net || mount -t sysfs sysfs /sys
ip link set lo up
ip link set eth0 up
ip addr replace 10.0.2.2/24 dev eth0
ip addr replace 10.0.2.79/24 dev eth0
ip -4 -o addr show dev eth0
test "$(cat /sys/class/net/eth0/carrier)" = 1
LINUX_PREPARE
then printf '\nSCALE_OBSERVER_%s\n' READY
else printf '\nSCALE_OBSERVER_%s\n' FAILED
fi
'''
success_regex = ['(?m)^SCALE_OBSERVER_READY[[:space:]]*$']
timeout = 300

[[shell_check_steps]]
shell_prefix = "root@linux-observer:~#"
shell_cmd = "\u0018h"
timeout = 120

