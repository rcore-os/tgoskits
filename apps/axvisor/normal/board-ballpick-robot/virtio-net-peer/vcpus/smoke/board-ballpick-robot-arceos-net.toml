[[shell_check_steps]]
shell_prefix = "root@linux-observer:~#"
shell_cmd = '''
{
if sh -s -- partial 64 <<'LINUX_CHECK'
set -eu
phase=$1
count=$2
export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
mkdir -p /proc /sys /dev
mount -t proc proc /proc 2>/dev/null || grep -q ' /proc proc ' /proc/mounts
test -d /sys/class/net || mount -t sysfs sysfs /sys
ip link set lo up
ip link set eth0 up
ip addr replace 10.0.2.2/24 dev eth0
# Own the tail peer address so its retries do not target an unanswered ARP entry.
ip addr replace "10.0.2.$((15 + count))/24" dev eth0
ip -4 -o addr show dev eth0
command -v ping >/dev/null
test "$(cat /sys/class/net/eth0/carrier)" = 1
n=1
while [ "$n" -le "$count" ]; do
    ip="10.0.2.$((14 + n))"
    expected=down
    if [ "$phase" = before ] || { [ "$phase" = partial ] && [ "$n" -eq "$count" ]; }; then
        expected=up
    fi
    if ping -n -c 2 -W 1 "$ip" >/dev/null 2>&1; then rc=0; else rc=$?; fi
    if [ "$expected" = up ]; then
        [ "$rc" -eq 0 ]
        mac=$(printf '52:54:00:20:01:%02x' "$n")
        ip neigh show "$ip" dev eth0 | grep -qi "lladdr $mac "
    else
        # iputils exit 1 means no replies; exit 2 is an execution/network error.
        [ "$rc" -eq 1 ]
    fi
    printf 'SCALE_TARGET phase=%s vm=%s ip=%s expected=%s ping_exit=%s\n' "$phase" "$n" "$ip" "$expected" "$rc"
    n=$((n + 1))
done
test "$(cat /sys/class/net/eth0/carrier)" = 1
sync
LINUX_CHECK
then
    printf '\nSCALE_%s_PASS\n' $(printf %s partial | tr a-z A-Z)
else
    printf '\nSCALE_%s_FAILED\n' $(printf %s partial | tr a-z A-Z)
fi
}
'''
success_regex = ['(?m)^SCALE_PARTIAL_PASS[[:space:]]*$']
timeout = 600

[[shell_check_steps]]
shell_prefix = "root@linux-observer:~#"
shell_cmd = "\u0018h"
timeout = 120

