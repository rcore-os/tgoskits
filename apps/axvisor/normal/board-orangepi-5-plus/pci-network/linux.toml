[base]
id = 1
name = "linux-pci-network"
guest_type = "passthrough"
cpu_num = 1
phys_cpu_ids = [0x400]

[kernel]
entry_point = 0x2_4008_0000
kernel_load_addr = 0x2_4008_0000
# Requires the Rockchip BSP release 6.1.99-rockchip-rk3588 and matching guest modules.
# The ping case checks uname -r before probing PCIe; see README.md for deployment.
kernel_path = "/guest/linux/orangepi-5-plus"
dtb_load_addr = 0x2_4000_0000
# Physical PCI MSI/ITS assignment is not wired into the AxVM host backend.
# This case exercises the PCIe controller's physical INTx cascade instead.
cmdline = 'root=/dev/vda rw console=ttyS2,1500000 earlycon=uart8250,mmio32,0xfeb50000 rootwait rootfstype=ext4 devtmpfs.mount=1 clk_ignore_unused pci=nomsi init=/bin/sh HOME=/root USER=root HOSTNAME=ubuntu -- -c "cd /root; export PS1=$USER@$HOSTNAME:~#; exec /bin/sh -i"'
# MapIdentical allocates RAM owned by this VM and preserves physical DMA
# addresses. Do not reuse old fixed MapReserved ranges from another host.
memory_regions = [
    [0x2_4000_0000, 0x8000_0000, 0x7, 1],
]

[devices]
# PCI host bridges only reach the guest when listed explicitly; an implicit
# root passthrough drops all PCI nodes. The dependency walker additionally
# requires every referenced clock/DMA/PHY/power-domain provider to be
# assigned, so the whitelist carries the CRU, the SPI DMA engine and the
# shared GRF syscons next to the device subtrees themselves.
passthrough = [
    { path = "/aliases" },
    { path = "/clocks" },
    { path = "/clock-controller@fd7c0000" },
    { path = "/dma-controller@fea30000" },
    { path = "/firmware" },
    { path = "/power-management@fd8d8000" },
    { path = "/pinctrl" },
    { path = "/syscon@fd5f0000" },
    { path = "/syscon@fd5b0000" },
    { path = "/syscon@fd5bc000" },
    { path = "/syscon@fd5c4000" },
    { path = "/vcc3v3-pcie-eth" },
    { path = "/spi@feb20000" },
    { path = "/i2c@fd880000" },
    { path = "/pcie@fe180000" },
    { path = "/pcie@fe190000" },
    { path = "/phy@fee00000" },
    { path = "/phy@fee20000" },
]
# Physical storage remains owned by AxVisor; the guest uses its own ext4.
disabled = [{ path = "/mmc@fe2c0000" }, { path = "/mmc@fe2e0000" }]

[[devices.virtual]]
id = "rootfs"
model = "virtio-blk"
path = "/guest/rootfs-aarch64-orangepi-jammy-0.img"
filesystem = "ext4"
