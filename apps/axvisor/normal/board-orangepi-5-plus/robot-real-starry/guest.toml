# Real-robot AxVisor + StarryOS guest. The guest kernel is built from this
# checkout with:
# cargo xtask starry build --config test-suit/starryos/board-orangepi-5-plus/robot-flow/build-aarch64-unknown-none-softfloat.toml --smp 1

[base]
id = 1
name = "starry"
guest_type = "passthrough"
cpu_num = 1
phys_cpu_ids = [0x00]

[kernel]
entry_point = 0x4008_0000
kernel_load_addr = 0x4008_0000
kernel_path = "${workspace}/target/aarch64-unknown-none-softfloat/release/starryos.bin"
dtb_load_addr = 0x4000_0000
# Without an explicit cmdline the guest inherits the board's stale Armbian
# /chosen bootargs and starts systemd as PID 1, which StarryOS cannot bring up.
# Boot straight into the fixed CI shell instead, like the native robot-flow
# board config and the robot-starry virtual case.
cmdline = 'root=/dev/mmcblk0p2 rw console=ttyS2,1500000 earlycon=uart8250,mmio32,0xfeb50000 rootwait rootfstype=ext4 init=/bin/sh HOME=/root USER=root HOSTNAME=starry -- -c "cd /root; export PS1=$USER@$HOSTNAME:~#; exec /bin/sh -i"'

# Keep a fixed 256 MiB region below 4 GiB for the kernel and DMA32 devices,
# while allowing ordinary allocations to use the 2 GiB high-memory region.
memory_regions = [
    [0x4000_0000, 0x1000_0000, 0x7, 2],
    [0x2_4000_0000, 0x8000_0000, 0x7, 1],
]

# Physical-device selection. Virtual platform devices are machine-owned.
[devices]
passthrough = []
disabled = [{ path = "/pcie@fe150000" }, { path = "/pcie@fe160000" }, { path = "/pcie@fe170000" }, { path = "/pcie@fe180000" }, { path = "/pcie@fe190000" }]
