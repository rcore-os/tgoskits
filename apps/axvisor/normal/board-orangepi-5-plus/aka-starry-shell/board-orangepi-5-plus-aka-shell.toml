board_type = "OrangePi-5-Plus-robot-emmc"
uboot_cmd = [
  "setenv bootargs root=/dev/mmcblk0p2 rw console=ttyS2,1500000 console=tty1 splash=verbose consoleblank=0 earlycon=uart8250,mmio32,0xfeb50000 cpuidle.off=1 rodata=off rootwait rootfstype=ext4 loglevel=8 usb-storage.quirks= cma=128M cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory swapaccount=1 axvisor.vm_start=1,2",
  "mw.l 0xfd7c03cc 0x7e000000",
  "mw.l 0xfd7c03d0 0x00080129",
  "mw.l 0xfd7c03d4 0x00030001",
  "mw.l 0xfd7c0830 0x00800000",
  "mw.l 0xfd7c0834 0x10000000",
  "mw.l 0xfd5f8020 0x00ff00aa",
  "mw.l 0xfd5f9110 0x000f000f",
  "mw.l 0xfd5f9020 0x00ff0066",
]
timeout = 900
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  'Failed to initialize guest VM',
  'Failed to start VM',
  'exited with a fault',
  'unhandled guest translation fault',
  'ZEPHYR_ROBOT_CONTROL_FAILED',
  '(?m)^AKA_WORKLOAD_EXIT result=[1-9][0-9]*\s*$',
  '(?m)^AKA_SHELL_CI_FAIL status=.*$',
  '(?m)^AKA_GUEST_EXT4_FAIL$',
]

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 2"

[[shell_check_steps]]
shell_prefix = "zephyr:~$"
shell_cmd = "aka run"
success_regex = ['(?m)^aka_run=0\s*$']

[[shell_check_steps]]
shell_prefix = "zephyr:~$"
shell_cmd = "aka status"
success_regex = ['(?m)^aka_state=running result=0\s*$']

[[shell_check_steps]]
shell_prefix = "zephyr:~$"
shell_cmd = "\u0018hhelp"

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"

[[shell_check_steps]]
shell_prefix = "root@starry:~#"
shell_cmd = 'if test -b /dev/blk0 && test ! -e /dev/mmcblk0 && test -f /opt/aka/bin/tennis-perception; then echo AKA_GUEST_EXT4_READY; else echo AKA_GUEST_EXT4_FAIL; fi'
success_regex = ['(?m)^AKA_GUEST_EXT4_READY\s*$']

[[shell_check_steps]]
shell_prefix = "root@starry:~#"
shell_cmd = "cd /opt/aka"

[[shell_check_steps]]
shell_prefix = "root@starry:~#"
shell_cmd = './run_dual_pick_ci_once.sh --min-fps 0.01; r=$?; printf "%s\n" "$r" > /tmp/aka-shell-ci.status; sync; printf "\nAKA_SHELL_CI_RESULT status=%s\n" "$r"'
success_regex = ['(?m)^AKA_SHELL_CI_RESULT status=[0-9]+\s*$']

# Returning to the host replays the logs hidden behind the guest console.
[[shell_check_steps]]
shell_prefix = "root@starry:~#"
shell_cmd = "\u0018hhelp"

[[shell_check_steps]]
shell_prefix = "axvisor:/$"
shell_cmd = "vm console 1"

[[shell_check_steps]]
shell_prefix = "Attached VM[1] console"
shell_cmd = 'r=$(cat /tmp/aka-shell-ci.status); m=AKA_SHELL_CI; if [ "$r" = 0 ]; then printf "\n%s_PASS\n" "$m"; else printf "\n%s_FAIL status=%s\n" "$m" "$r"; fi'
success_regex = ['(?m)^AKA_SHELL_CI_PASS\s*$']
