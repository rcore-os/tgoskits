features = [
  "ax-driver/rk3588-pcie",
  "ax-driver/realtek-rtl8125",
  "ax-driver/rockchip-sdhci",
  "ax-driver/rockchip-dwmmc",
  "web",

]
log = "Warn"
target = "aarch64-unknown-none-softfloat"
vm_configs = [
  "apps/axvisor/normal/board-orangepi-5-plus/aka-starry-shell/starry-smp1.toml",
  "apps/axvisor/normal/board-orangepi-5-plus/aka-starry-shell/zephyr-smp1.toml",
]

[env]
AXVM_HTTP_BIND = "0.0.0.0:8080"
