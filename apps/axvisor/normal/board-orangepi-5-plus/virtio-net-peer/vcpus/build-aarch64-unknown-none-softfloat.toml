# Default layout: 64 ArceOS peers (4 GiB) and one Linux observer (1 GiB).
# Run orangepi-arceos-virtio-net-test.sh gen before building to prepare the VM configs.
features = ["ax-driver/rk3588-cpufreq", "ax-driver/rockchip-dwmmc", "ax-driver/rockchip-sdhci"]
log = "Error"
max_cpu_num = 8
target = "aarch64-unknown-none-softfloat"
vm_configs = [
  "apps/axvisor/normal/board-orangepi-5-plus/virtio-net-peer/linux-observer.toml",
  "target/axvisor-arceos-net-scale/vm1.toml",
