# Default observer: VM65, independent 1 GiB RAM and Jammy ext4.
[base]
id = 65
name = "linux-net-observer"
guest_type = "virtualized"
cpu_num = 1
phys_cpu_ids = [0x700]
phys_cpu_sets = [128]

[kernel]
entry_point = 0x4008_0000
kernel_path = "/guest/linux/orangepi-5-plus"
kernel_load_addr = 0x4008_0000
dtb_load_addr = 0x4000_0000
cmdline = 'root=/dev/vda rw console=ttyS0,1500000 earlycon=uart8250,mmio32,0xfeb50000 rootwait rootfstype=ext4 devtmpfs.mount=1 init=/bin/sh HOME=/root USER=root HOSTNAME=linux-observer -- -c "cd /root; export PS1=$USER@$HOSTNAME:~#; exec /bin/sh -i"'
memory_regions = [
  [0x4000_0000, 0x4000_0000, 0x7, 0],
]

[devices]
passthrough = []
disabled = []

[[devices.virtual]]
id = "console0"
model = "uart16550-mmio"
address = 0xfeb50000

[[devices.virtual]]
id = "rootfs"
model = "virtio-blk"
path = "/guest/rootfs-aarch64-orangepi-jammy-0.img"
filesystem = "ext4"

[[devices.virtual]]
id = "virtnet0"
model = "virtio-net"
guest_mac = [0x52, 0x54, 0x00, 0x20, 0x02, 0x01]
