# cpu-unknow-infer aarch64 - llama.cpp (ggml) CPU greedy-decode inference correctness carpet. The
# carpet greedy-decodes qwen3-0.6b.gguf (temperature=0, argmax sampler, n_gpu_layers=0) and asserts
# the generated token IDs equal the committed golden token-by-token. No GPU. -cpu max exposes the full
# AArch64 feature set (LSE atomics, dotprod, NEON) the ggml CPU backend dispatches to. -smp 1: single
# vCPU (llama.cpp pinned to one thread). 6144M: qwen3-0.6b weights + ggml buffers + KV cache. The model
# rides an nvme drive (ax-driver/nvme, not virtio-blk).
args = [
    "-nographic", "-cpu", "max", "-m", "6144M", "-smp", "1",
    "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "sh /usr/bin/run_all.sh"
success_regex = ['(?m)^TEST PASSED\s*$']
fail_regex = ['(?i)\bpanic(?:ked)?\b', '(?m)^TEST FAILED\s*$']
timeout = 24000
