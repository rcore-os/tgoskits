args = [
    "-nographic",
    "-m",
    "512M",
    "-cpu",
    "rv64",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-riscv64-alpine.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
]
uefi = false
to_bin = true
fail_regex = ['(?i)\bpanic(?:ked)?\b']
# The riscv64 run prints FINDUTILS TEST PASSED about 16s after boot, so the
# previous 15s budget ended the run just as the test succeeded. 60s keeps a
# stable margin without hiding a hang.
timeout = 60

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = "/usr/bin/findutils-test"
success_regex = ["(?m)^FINDUTILS TEST PASSED\\s*$"]
