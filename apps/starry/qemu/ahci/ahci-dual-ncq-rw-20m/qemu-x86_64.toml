args = [
  "-machine",
  "q35",
  "-nographic",
  "-m",
  "768M",
  "-smp",
  "4",
  "-drive",
  "if=ide,index=0,id=disk0,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-x86_64-alpine.img",
  "-drive",
  "if=ide,index=1,format=raw,file=fat:rw:${workspace}/tmp/axbuild/ahci-dual-ncq-rw-20m-data",
]
uefi = true
to_bin = true
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "(?m)ahci-pci-.*-p0: ready with .* NCQ depth 1\\s*$",
  "(?m)ahci-pci-.*-p1: ready with .* NCQ depth 1\\s*$",
  "(?m)^AHCI_DUAL_NCQ_RW_20M_FAILED\\s*$",
]
timeout = 900

[[shell_check_steps]]
shell_prefix = "root@starry:"
# Body staged by prebuild.sh; one short line avoids injecting a multi-line command
# that interleaves with the shell's own console output.
shell_cmd = "sh /usr/local/bin/ahci-dual-ncq-rw-20m.sh"
success_regex = [
  "(?m)^AHCI_DUAL_NCQ_RW_20M_PASSED\\s*$",
]
