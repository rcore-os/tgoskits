args = [
    "-nographic",
    "-m",
    "512M",
    "-cpu",
    "rv64",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-riscv64-alpine.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
]
uefi = false
to_bin = true
fail_regex = ['(?i)\bpanic(?:ked)?\b', "(?m)^LUA_LUAROCKS_TEST_FAILED\\s*$"]
timeout = 600

# The inspect source archive is served from the host at 10.0.2.2:18391 over
# QEMU SLIRP. `prebuild.sh` creates and verifies this directory before the
# harness starts the server; the guest still performs a real LuaRocks download.
[host_http_server]
bind = "127.0.0.1"
port = 18391
dir = "target/lua-luarocks-assets"

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = "/usr/bin/lua-luarocks-tests.sh"
success_regex = ["(?m)^LUA_LUAROCKS_TEST_PASSED\\s*$"]
