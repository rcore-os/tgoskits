args = [
    "-machine",
    "q35,accel=tcg",
    "-nographic",
    "-cpu",
    "max",
    "-m",
    "512M",
    "-smp",
    "2",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-x86_64-alpine.img,snapshot=on",
]
uefi = true
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "/usr/bin/futex-ping-pong-bench.sh"
success_regex = [
    "(?m)^FUTEX_PING_PONG_PASSED\\s*$",
    "(?m)^FUTEX_PING_PONG_APP_PASSED\\s*$",
]
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)segmentation fault",
    "(?i)kernel panic",
    "(?i)panicked at",
    "(?m)^FUTEX_PING_PONG_APP_FAILED\\s*$",
]
timeout = 300
