timeout = 2400
# StarryOS PIE images require the UEFI handoff; direct ELF loading requires a PVH note.
uefi = true
to_bin = true
fail_regex = [
    '(?i)\bpanic(?:ked)?\b',
    '(?i)page fault',
    '(?i)segmentation fault',
    '(?m)^MYSQL_TEST_FAILED(?:[: ].*)?$',
]

args = [
    "-machine",
    "q35",
    "-nographic",
    "-m",
    "2G",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-x86_64-mysql.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
]

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = "/usr/bin/mysql-test.sh"
success_regex = ['(?m)^MYSQL_TEST_PASSED\s*$']
