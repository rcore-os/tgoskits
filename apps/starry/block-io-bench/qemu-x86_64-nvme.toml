args = [
    "-machine",
    "q35",
    "-nographic",
    "-m",
    "512M",
    "-drive",
    "id=nvm,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-x86_64-alpine.img,snapshot=on",
    "-device",
    "nvme,serial=starry-block-io-bench,drive=nvm,max_ioqpairs=64,msix_qsize=1",
]
# StarryOS is linked as a PIE image and needs the x86_64 UEFI handoff.
uefi = true
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "/usr/bin/block-io-bench.sh"
success_regex = [
    "(?m)^BLOCK_BENCH_APP_PASSED\\s*$",
]
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)segmentation fault",
    "(?i)kernel panic",
    "(?i)panicked at",
    "(?m)^BLOCK_BENCH_APP_FAILED\\s*$",
]
timeout = 300
