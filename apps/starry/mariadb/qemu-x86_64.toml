args = [
    "-nographic",
    "-m",
    "1536M",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-x86_64-alpine.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
]
# UEFI starts the kernel from the ESP instead of QEMU's -kernel path, so
# -append is invalid. Starry selects the sole ext4 root filesystem on this
# NVMe disk; keep the drive/device wiring as the real root contract.
uefi = true
to_bin = true
fail_regex = [
    '(?i)\bpanic(?:ked)?\b',
    "(?m)^MARIADB_TEST_FAILED(?:[: ].*)?$",
]
timeout = 1800

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = "/usr/bin/mariadb-test.sh"
success_regex = ["(?m)^MARIADB_TEST_PASSED\\s*$"]
