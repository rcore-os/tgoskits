# cpu-model-test loongarch64 - "pyte for 3D models" closed-form/golden carpet. Self-written OBJ/STL/PLY
# parsers + mesh-plane slicer + barycentric/z-buffer rasterizer bundled into static cells (cgltf vendored for
# glb; no runtime 3D lib); closed-form slice/render/pointcloud + host goldens, self-written in the cells.
# Platform: dynamic (axplat-dyn) - build-loongarch64*.toml carries ax-driver/serial and does not opt out of
# dynamic platform mode; the retired static LoongArch path lacked the serial console binding. uefi=false /
# to_bin=true is the dynamic platform's raw-binary boot path. -smp 1: single vCPU. 2048M: benchy slice +
# suzanne render + bunny point-cloud buffers.
args = [
    "-machine", "virt", "-cpu", "la464", "-nographic", "-m", "2048M", "-smp", "1",
    "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-loongarch64-alpine.img",
    "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "sh /usr/bin/run_all.sh"
success_regex = ['(?m)^TEST PASSED\s*$']
fail_regex = ['(?i)\bpanic(?:ked)?\b', '(?m)^TEST FAILED\s*$']
timeout = 20000
