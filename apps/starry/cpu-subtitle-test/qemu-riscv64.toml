# cpu-subtitle-test riscv64 - "pyte for subtitles" deterministic/golden carpet. Self-written SRT/VTT/ASS
# parsers + SRT<->VTT converter bundled into static cells (no runtime subtitle lib); deterministic synthetic
# timing + host structural goldens (counts / first-last ts / monotonic / UTF-8), never the dialogue text.
# -smp 1: single vCPU. 512M: subtitle text buffers are tiny.
args = [
    "-nographic", "-cpu", "rv64", "-m", "512M", "-smp", "1",
    "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-riscv64-alpine.img",
    "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "sh /usr/bin/run_all.sh"
success_regex = ['(?m)^TEST PASSED\s*$']
fail_regex = ['(?i)\bpanic(?:ked)?\b', '(?m)^TEST FAILED\s*$']
timeout = 20000
