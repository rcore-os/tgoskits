# cpu-image-test riscv64 - "pyte for images" byte-exact/PSNR carpet. stb_image + nanosvg bundled into
# static cells (no runtime image lib); per-pixel SHA / closed-form regions / PSNR vs host goldens,
# self-written in the cells. -smp 1: single vCPU. 2048M: real raster decode + SVG raster buffer.
args = [
    "-nographic", "-cpu", "rv64", "-m", "2048M", "-smp", "1",
    "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-riscv64-alpine.img",
    "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "sh /usr/bin/run_all.sh"
success_regex = ['(?m)^TEST PASSED\s*$']
fail_regex = ['(?i)\bpanic(?:ked)?\b', '(?m)^TEST FAILED\s*$']
timeout = 20000
