board_type = "ROC-RK3568-PC"
shell_prefix = "root@starry:"
success_regex = [
  '(?m)^RK3568_BLOCK_RW_BENCH_PASSED$',
]
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  '(?m)^RK3568_BLOCK_RW_BENCH_SESSION_FAILED$',
  '(?m)^block-rw-bench: error: .*$',
  '(?m)^block-rw-bench: .*verify=(?:fail|mismatch).*$',
  '(?i)(block-rw-bench|sh): .*not found',
  '(?i)\bI/O error\b',
]
timeout = 1200

shell_init_cmd = """
export BLOCK_RW_BENCH_ROOT_DEVICE='PARTLABEL=rootfs'
export BLOCK_RW_BENCH_CONTROLLER='rk3568-dwcmshc-emmc'
export BLOCK_RW_BENCH_SUCCESS_MARKER='RK3568_BLOCK_RW_BENCH_PASSED'
export BLOCK_RW_BENCH_MAX_TRANSFER_BYTES='1048064'
"""
