board_type = "OrangePi-5-Plus"
shell_prefix = "root@starry:/root #"
success_regex = [
  '(?m)^ORANGEPI_BLOCK_RW_BENCH_PASSED$',
]
fail_regex = [
  '(?i)\bpanic(?:ked)?\b',
  '(?m)^ORANGEPI_BLOCK_RW_BENCH_SESSION_FAILED$',
  '(?m)^block-rw-bench: error: .*$',
  '(?m)^block-rw-bench: .*verify=(?:fail|mismatch).*$',
  '(?i)(block-rw-bench|sh): .*not found',
  '(?i)\bI/O error\b',
]
timeout = 1200

shell_init_cmd = """
export BLOCK_RW_BENCH_ROOT_DEVICE='/dev/mmcblk0'
export BLOCK_RW_BENCH_CONTROLLER='rk3588-dwcmshc-emmc'
export BLOCK_RW_BENCH_SUCCESS_MARKER='ORANGEPI_BLOCK_RW_BENCH_PASSED'
export BLOCK_RW_BENCH_MAX_TRANSFER_BYTES='1048064'
"""
