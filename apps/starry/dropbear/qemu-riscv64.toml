# dropbear riscv64 - SSH suite carpet. Platform: dynamic (uefi=false / to_bin=true). The
# gate provisions the dropbear suite on-target with `apk add` (v3.23 ships riscv64 packages)
# then drives every SSH session single-node over 127.0.0.1 under TCG.
args = [
    "-nographic", "-m", "1024M", "-smp", "1", "-cpu", "rv64",
    "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-riscv64-alpine.img",
    "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "sh /usr/bin/run-dropbear.sh"
success_regex = ['(?m)^TEST PASSED\s*$']
fail_regex = ['(?i)\bpanic(?:ked)?\b', '(?m)^TEST FAILED\s*$']
timeout = 5400
