# Vm base info configs
#
[base]
# Guest vm id.
id = 1
# Guest vm name.
name = "linux-qemu"
# Virtualization type.
guest_type = "passthrough"
# The number of virtual CPUs.
cpu_num = 3
# Guest vm physical cpu sets.
phys_cpu_ids = [0, 1, 2]
phys_cpu_sets = [1, 2, 4]
#
# Vm kernel configs
#
[kernel]
cmdline = "earlycon=sbi console=ttyS0,115200 init=/bin/sh root=/dev/vda rw"
# The entry point of the kernel image.
entry_point = 0x9020_0000
# The location of image: "memory" | "fs".
# Load from file system.
image_location = "fs"
# The file path of the kernel image.
kernel_path = "/guest/linux/linux-qemu"
# The load address of the kernel image.
kernel_load_addr = 0x9020_0000
# The file path of the device tree blob (DTB).
# dtb_path = "/path/tmp/configs/linux-riscv64-qemu-smp1.dtb"
# The load address of the device tree blob (DTB).
dtb_load_addr = 0x9300_0000

# Memory regions with format (`base_paddr`, `size`, `flags`, `map_type`).
# For `map_type`, 0 means `MAP_ALLOC`, 1 means `MAP_IDENTICAL`, 2 means `MAP_RESERVED`.
memory_regions = [
    [0x9000_0000, 0x0400_0000, 0x7, 1], # System RAM 64M MAP_IDENTICAL for DMA-capable passthrough
]

#
# Device specifications
#

# Physical-device selection. Virtual platform devices are machine-owned.
[devices]
passthrough = []
disabled = []
