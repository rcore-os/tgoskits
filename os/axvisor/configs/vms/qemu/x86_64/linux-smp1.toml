# Vm base info configs
#
[base]
# Guest vm id.
id = 1
# Guest vm name.
name = "linux-x86_64-qemu"
# Virtualization type.
guest_type = "passthrough"
# The number of virtual CPUs.
cpu_num = 1
# Guest vm physical cpu sets.
phys_cpu_sets = [1]

#
# Vm kernel configs
#
[kernel]
# The entry point of the kernel image.
# Linux direct boot uses the Linux-specific boot stub at this GPA.
entry_point = 0x8000
# The file path of the kernel image.
kernel_path = "${workspace}/target/axbuild/images/qemu-x86_64/linux/linux-qemu"
# The load address of the kernel image.
kernel_load_addr = 0x20_0000
# Whether to enable BIOS boot flow.
enable_bios = false
# Keep the direct-boot device-probing options shared by both nested backends.
# Let Linux validate TSC instead of forcing clock reads through the emulated
# ACPI PM timer. The 231-byte boot command-line limit leaves out the optional
# rootfs `noload` and terminal `dumb` options.
cmdline = "console=ttyS0 root=/dev/vda ro rootwait devtmpfs.mount=1 init=/sbin/getty pci=conf1 pci=nomsi irqpoll nox2apic no_timer_check initcall_blacklist=ahci_pci_driver_init,i8042_init -- -n -l /bin/sh -L 115200 ttyS0"

## The path of the disk image.

# Memory regions with format (`base_paddr`, `size`, `flags`, `map_type`).
# For `map_type`, 0 means `MAP_ALLOC`, 1 means `MAP_IDENTICAL`, 2 means `MAP_RESERVED`.
memory_regions = [
  [0x0000_0000, 0x0800_0000, 0x7, 1], # System RAM 128M MAP_IDENTICAL for DMA-capable passthrough
  [0x0000_0000, 0x0010_0000, 0x7, 0], # Low boot scratch for real-mode stub and boot_params
]

#
# Device specifications
#

# Physical-device selection. Virtual platform devices are machine-owned.
[devices]
passthrough = []
disabled = []
