[base]
id = 1
name = "linux-virtio-blk-mount-x86_64"
guest_type = "passthrough"
cpu_num = 1
phys_cpu_ids = [1]

[kernel]
entry_point = 0x8000
image_location = "memory"
kernel_path = "${workspace}/tmp/axbuild/images/qemu-x86_64/linux/linux-qemu"
kernel_load_addr = 0x20_0000
ramdisk_path = "${workspace}/tmp/axbuild/images/initramfs-x86_64-busybox.cpio.gz/initramfs-x86_64-busybox.cpio.gz"
ramdisk_load_addr = 0x0800_0000
enable_bios = false
boot_protocol = "direct"
cmdline = "console=ttyS0 rdinit=/init devtmpfs.mount=1 nox2apic no_timer_check ibt=off initcall_blacklist=ahci_pci_driver_init"
memory_regions = [
  [0x0000_0000, 0x2000_0000, 0x7, 0],
]

[devices]
passthrough = []
disabled = []

[[devices.virtual]]
id = "virtblk0"
model = "virtio-blk"
transport = "pci"
path = "/guest/rootfs-x86_64-alpine.img"
filesystem = "ext4"
