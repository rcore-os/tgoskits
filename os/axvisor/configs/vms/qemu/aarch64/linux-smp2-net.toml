# Vm base info — Linux 2 vCPU + VirtioNet loopback (Task 2 phase 1)
#
# pCPU layout (QEMU virt, 4 cores):
#   pCPU0: AxVisor host
#   pCPU1-2: this guest
#
[base]
id = 1
name = "linux-qemu-smp2-net"
vm_type = 1
cpu_num = 2
phys_cpu_ids = [1, 2]
vcpu_priorities = [10, 10]

[kernel]
entry_point = 0x8020_0000
image_location = "fs"
kernel_path = "/guest/linux/linux-qemu"
kernel_load_addr = 0x8020_0000
dtb_load_addr = 0x8000_0000

memory_regions = [
  [0x8000_0000, 0x1000_0000, 0x7, 1], # System RAM 1G MAP_IDENTICAL
]

[devices]
interrupt_mode = "passthrough"

passthrough_devices = [
    ["/"],
]

passthrough_addresses = []

excluded_devices = []

# VirtioNet at DTB virtio_mmio@a000000 (SPI 16 → GIC INTID 48).
# Length 0x1000 matches stage-2 4K alignment so the whole page is owned by emu.
emu_devices = [
  ["virtio-net0", 0xa000000, 0x1000, 48, 0xE2, [0x02, 0x00, 0x00, 0x00, 0x00, 0x02]],
]
