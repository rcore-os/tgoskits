# FreeRTOS GICv3 guest from /home/ajax/Desktop/Project/Kernel/freertos-guest.
# Build it with `make MEM_BASE=0x3f000000` in that external guest tree before
# running Axvisor. The guest defaults to GICv3 and TIMER=30.

[base]
id = 1
name = "freertos-gicv3-qemu"
vm_type = 1
cpu_num = 1
phys_cpu_ids = [0]

[kernel]
entry_point = 0x3f80_0000
image_location = "memory"
kernel_load_addr = 0x3f80_0000
kernel_path = "/home/ajax/Desktop/Project/Kernel/freertos-guest/freertos.gicv3.qemu.bin"
dtb_load_addr = 0x4400_0000
dtb_path = "/home/ajax/Desktop/Project/Kernel/freertos-guest/freertos-gicv3.dtb"
memory_regions = [
  [0x3f00_0000, 0x1000_0000, 0x7, 0],
]

[devices]
interrupt_mode = "emulated"
passthrough_devices = [
  ["/"],
]
passthrough_addresses = []
excluded_devices = []
emu_devices = [
  ["gppt-gicd", 0x0800_0000, 0x1_0000, 0, 0x21, []],
  ["gppt-gicr", 0x080a_0000, 0x2_0000, 0, 0x20, [1, 0x2_0000, 0]],
]
