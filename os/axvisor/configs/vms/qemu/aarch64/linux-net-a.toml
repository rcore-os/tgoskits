# Linux Guest A — Task 2 dual-guest IP (10.0.9.2)
#
# pCPU1-2, VirtioNet on global vsw
#
[base]
id = 1
name = "linux-qemu-net-a"
guest_type = "passthrough"
cpu_num = 1
# vCPU0 must run on pCPU0: passthrough SPI injection (pl011 console,
# virtio-blk rootfs) currently only reaches interrupts routed to pCPU0.
phys_cpu_ids = [0]
vcpu_priorities = [10]

[kernel]
entry_point = 0x8020_0000
image_location = "fs"
kernel_path = "/guest/linux/linux-qemu"
kernel_load_addr = 0x8020_0000
dtb_load_addr = 0x8000_0000

# Guest A needs host block device; identical RAM mapping for reliable rootfs boot.
memory_regions = [
  [0x8000_0000, 0x1000_0000, 0x7, 1],
]

# Host AxVisor keeps the PCIe NVMe for its own filesystem (kernel loading);
# Guest A boots from the passthrough virtio-blk disk (root=/dev/vda) and
# Guest B boots from a private initramfs.
[devices]
passthrough = []
disabled = [{ path = "/pcie@10000000" }]

# mac 02:00:00:00:00:02
[[devices.virtual]]
id = "virtnet0"
model = "virtio-net"
guest_mac = [0x02, 0x00, 0x00, 0x00, 0x00, 0x02]
