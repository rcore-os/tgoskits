# Task 1 contended baseline — RT on pCPU3 shared with Linux vCPU1 + emulated timer
#
[base]
id = 2
name = "arceos-rt-qemu-baseline-contended"
guest_type = "passthrough"
cpu_num = 1
phys_cpu_ids = [3]
vcpu_priorities = [19]

[kernel]
entry_point = 0x8020_0000
image_location = "memory"
kernel_path = "../../../../images/qemu_aarch64_arceos_rt/qemu-aarch64-rt-latency-bench"
kernel_load_addr = 0x8020_0000
dtb_load_addr = 0x8000_0000

memory_regions = [
  [0x8000_0000, 0x0800_0000, 0x7, 0],
]

[devices]
passthrough = []
disabled = [{ path = "/pcie@10000000" }]
