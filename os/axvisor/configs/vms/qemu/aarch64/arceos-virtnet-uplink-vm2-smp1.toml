# ArceOS guest #2 sharing one AxVisor host virtio-net uplink with guest #1.
#
# Distinct VM id (2), guest MAC (..34:57), emulated virtio-net MMIO window
# (0x0a30_0000) and SPI (66) so the two guests never collide inside AxVisor,
# while the raw-uplink cfg_list references the SAME host uplink MAC
# (52:54:00:aa:bb:01) so both ports land on the shared VirtualSwitch.
#
# Memory uses MapAlloc (map_type = 0) instead of guest #1's MapIdentical, so
# AxVisor allocates disjoint host physical backing instead of both guests
# pinning host PA 0x8000_0000.

[base]
id = 2
name = "arceos-virtnet-uplink-vm2-qemu"
vm_type = 1
cpu_num = 1
# Keep guest MPIDR 0 while pinning its vCPU to host CPU1. This lets two ArceOS
# guests run concurrently without changing the single-CPU guest boot contract.
phys_cpu_ids = [0]
phys_cpu_sets = [2]

[kernel]
entry_point = 0x8020_0000
image_location = "memory"
kernel_path = "${workspace}/target/aarch64-unknown-linux-musl/release/arceos-virtnet-uplink-vm2.bin"
kernel_load_addr = 0x8020_0000
dtb_load_addr = 0x8000_0000
memory_regions = [
  [0x8000_0000, 0x4000_0000, 0x7, 0], # System RAM 1G MapAlloc (disjoint host backing)
]

[devices]
interrupt_mode = "emulated"
passthrough_devices = [
  ["/psci"],
  ["/pl011@9000000"],
  ["/intc@8000000"],
  ["/timer"],
  ["/aliases"],
  ["/chosen"],
]
passthrough_addresses = []
excluded_devices = []
emu_devices = [
  ["gppt-gicd", 0x0800_0000, 0x1_0000, 0, 0x21, []],
  ["gppt-gicr", 0x080a_0000, 0x2_0000, 0, 0x20, [1, 0x2_0000, 0]],
  # Guest #2 virtio-mmio net: base 0x0a30_0000, SPI irq 66, guest MAC ..34:57,
  # raw-uplink mode=1, shared host NIC MAC 52:54:00:aa:bb:01.
  ["virtnet0", 0x0a30_0000, 0x200, 66, 0xE2,
   [0x52, 0x54, 0x00, 0x12, 0x34, 0x57, 1,
    0x52, 0x54, 0x00, 0xaa, 0xbb, 0x01]],
]
