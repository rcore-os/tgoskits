# StarryOS guest for QEMU aarch64 under Axvisor with a virtio-net device.
#
# StarryOS is an AArch64 Linux-style Image and receives the generated guest DTB
# in x0. The DTB is generated by Axvisor at runtime (no dtb_path), so a
# virtio-net virtual device automatically gets a /virtio_mmio@a000000 node
# (reg 0x0a00_0000, SPI 48). See docs/design/axvisor-vtp.md.

[base]
id = 1
name = "starry"
# Passthrough maps the host-attached NVMe (rootfs) into the guest; the
# virtio-net virtual device is still added by the resolved device graph.
guest_type = "passthrough"
cpu_num = 1
phys_cpu_ids = [1]
phys_cpu_sets = [1]

[kernel]
# StarryOS is an AArch64 Image and receives the generated guest DTB in x0.
entry_point = 0x4008_0000
image_location = "memory"
kernel_path = "${workspace}/target/aarch64-unknown-none-softfloat/release/starryos.bin"
kernel_load_addr = 0x4008_0000
dtb_load_addr = 0x4000_0000

# Memory region format: [base, size, flags, map_type].
# map_type: 0 = MAP_ALLOC, 1 = MAP_IDENTICAL, 2 = MAP_RESERVED.
# 256 MiB reserved below 4 GiB for the kernel (0x4008_0000) and DMA32
# devices; the remainder is identical-mapped RAM.
memory_regions = [
  [0x4000_0000, 0x1000_0000, 0x7, 2],
  [0x5000_0000, 0x3000_0000, 0x7, 1],
]

[devices]
# Rootfs comes from the host NVMe attached by the QEMU config (Starry boots
# from nvme, matching its standalone QEMU flow). Keep PCI enabled so the
# NVMe host node is mapped into the guest.
passthrough = []
disabled = []

[[devices.virtual]]
id = "virtnet0"
model = "virtio-net"
guest_mac = [0x52, 0x54, 0x00, 0x12, 0x34, 0x56]
