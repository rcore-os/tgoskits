[base]
id = 1
name = "linux-virtio-blk-mount-loongarch64"
guest_type = "virtualized"
cpu_num = 1
phys_cpu_ids = [1]

[kernel]
entry_point = 0x0159_6000
image_location = "memory"
kernel_path = "${workspace}/tmp/axbuild/images/qemu-loongarch64/linux/linux-qemu"
kernel_load_addr = 0x0020_0000
ramdisk_path = "${workspace}/tmp/axbuild/images/initramfs-loongarch64-busybox.cpio.gz/initramfs-loongarch64-busybox.cpio.gz"
ramdisk_load_addr = 0x0800_0000
enable_bios = false
boot_protocol = "direct"
cmdline = "console=ttyS0,115200 earlycon=uart8250,mmio,0x1fe001e0,115200 rdinit=/init devtmpfs.mount=1 nokaslr swiotlb=1024 pci=nomsi axvisor.pci_block_case=mount"
memory_regions = [[0x0000_0000, 0x1000_0000, 0x7, 0]]

[devices]
passthrough = []
disabled = []

[[devices.virtual]]
id = "virtblk0"
model = "virtio-blk"
transport = "pci"
path = "/guest/rootfs-loongarch64-alpine.img"
filesystem = "ext4"
