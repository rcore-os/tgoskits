# Vm base info configs
#
[base]
# Guest vm id.
id = 1
# Guest vm name.
name = "linux"
# Virtualization type.
guest_type = "passthrough"
# The number of virtual CPUs.
cpu_num = 1
# The physical CPU ids.
phys_cpu_ids = [0x00]

#
# Vm kernel configs
#
[kernel]
# The entry point of the kernel image.
entry_point = 0x2_4008_0000
# The location of image: "memory" | "fs".
# Load from file system.
image_location = "fs"
# The load address of the kernel image.
kernel_load_addr = 0x2_4008_0000
# The file path of the kernel image.
# kernel_path = "/guest/orangepi-5-plus"
kernel_path = "/guest/linux/orangepi-5-plus"
# The guest uses a fixed clock for its virtual UART, but the matching physical
# UART clock remains host-owned inside the shared RK3588 clock controller.
cmdline = "root=/dev/mmcblk0p2 rw console=ttyS2,1500000 earlycon=uart8250,mmio32,0xfeb50000 cpuidle.off=1 rodata=off rootwait rootfstype=ext4 ignore_loglevel loglevel=8 cma=128M"
# The file path of the device tree blob (DTB).
dtb_load_addr = 0x2_4000_0000
# The file path of the device tree blob (DTB).
# dtb_path = "/path/to/axvisor/configs/vms/orangepi-5-plus/linux-smp1.dtb"

ramdisk_path = "/guest/linux/initramfs.cpio"
# The load address of the ramdisk image (U-Boot ramdisk_addr_r).
ramdisk_load_addr = 0xc000_0000

# Memory regions with format (`base_paddr`, `size`, `flags`, `map_type`).
# For `map_type`, 0 means `MAP_ALLOC`, 1 means `MAP_IDENTICAL`, 2 means `MAP_RESERVED`.
memory_regions = [
    [0xb000_0000, 0x1000_0000, 0x7, 2],
    [0xc000_0000, 0x3000_0000, 0x7, 2],
    [0x2_4000_0000, 0x8000_0000, 0x7, 1], # System RAM MAP_IDENTICAL
]

#
# Device specifications
#

# Physical-device selection. Virtual platform devices are machine-owned.
[devices]
passthrough = []
disabled = []
