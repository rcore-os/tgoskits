# Vm base info configs
#
[base]
# Guest vm id.
id = 1
# Guest vm name.
name = "linux"
# Virtualization type.
guest_type = "passthrough"
# The number of virtual CPUs.
cpu_num = 2
# The physical CPU ids.
phys_cpu_ids = [0x200, 0x300]

#
# Vm kernel configs
#
[kernel]
# The entry point of the kernel image.
entry_point = 0x8008_0000
# The location of image: "memory" | "fs".
# Load from memory.
image_location = "fs"
# The load address of the kernel image.
kernel_load_addr = 0x8008_0000
# The file path of the kernel image.
kernel_path = "/userdata/rootfs_overlay/guest/linux/roc-rk3568-pc"
# The load address of the device tree blob (DTB).
dtb_load_addr = 0x8000_0000
# The physical FIQ debugger is replaced by the machine-owned virtual 16550,
# which the guest enumerates as ttyS2.
cmdline = "storagemedia=emmc androidboot.storagemedia=emmc androidboot.mode=normal androidboot.verifiedbootstate=orange rw rootwait earlycon=uart8250,mmio32,0xfe660000 console=ttyS2,1500000 root=PARTLABEL=rootfs rootfstype=ext4 overlayroot=device:dev=PARTLABEL=userdata,fstype=ext4,mkfs=1 coherent_pool=1m systemd.gpt_auto=0 cgroup_enable=memory swapaccount=1 swiotlb=0x10000 net.ifnames=0"
# The file path of the device tree blob (DTB).
# dtb_path = "/path/to/dtb"
# Memory regions with format (`base_paddr`, `size`, `flags`, `map_type`).
# For `map_type`, 0 means `MAP_ALLOC`, 1 means `MAP_IDENTICAL`, 2 means `MAP_RESERVED`.
memory_regions = [
  [0x8000_0000, 0x6000_0000, 0x7, 1], # System RAM 1G MAP_IDENTICAL
]

#
# Device specifications
#

# Physical-device selection. Virtual platform devices are machine-owned.
[devices]
passthrough = []
disabled = []
