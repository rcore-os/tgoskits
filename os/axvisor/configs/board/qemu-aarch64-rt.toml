# AArch64 build-wide bounded polling profile. Ordinary WFI/standby may poll
# only within the configured runtime budget, then return to the shared wait
# queue. Poll-capable vCPUs must be pinned to distinct non-CPU0 host CPUs;
# AxVisor rejects invalid placements before registering a guest VM.
features = ["rt-poll-idle"]
log = "Info"
target = "aarch64-unknown-none-softfloat"
vm_configs = []
