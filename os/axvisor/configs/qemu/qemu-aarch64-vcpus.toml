args = [
  "-nographic",
  "-cpu", "cortex-a72",
  "-machine", "virt,virtualization=on,gic-version=3",
  # Four guest vCPUs share the two host pCPUs (two guests on each).
  "-smp", "2",
  "-m", "4g",
]
fail_regex = [
  "Failed to initialize guest VM",
  "VM1_VIRTIO_NET_FAIL",
  "VM2_VIRTIO_NET_FAIL",
  "VM3_VIRTIO_NET_FAIL",
  "VM4_VIRTIO_NET_FAIL",
  "(?i)panic",
]
timeout = 360
to_bin = true
uefi = false

[[shell_check_steps]]
shell_prefix = "axvisor:$"
shell_cmd = "vm console 1"

[[shell_check_steps]]
success_regex = ["VM1_VIRTIO_NET_PASS role=client"]

[[shell_check_steps]]
shell_prefix = "VM1_VIRTIO_NET_HB_TX"
shell_cmd = "\u0018h"

[[shell_check_steps]]
shell_prefix = "axvisor:$"
shell_cmd = "vm console 2"

[[shell_check_steps]]
success_regex = ["VM2_VIRTIO_NET_PASS role=client"]

[[shell_check_steps]]
shell_prefix = "VM2_VIRTIO_NET_HB_TX"
shell_cmd = "\u0018h"

[[shell_check_steps]]
shell_prefix = "axvisor:$"
shell_cmd = "vm console 3"

[[shell_check_steps]]
success_regex = ["VM3_VIRTIO_NET_PASS role=client"]

[[shell_check_steps]]
shell_prefix = "VM3_VIRTIO_NET_HB_TX"
shell_cmd = "\u0018h"

[[shell_check_steps]]
shell_prefix = "axvisor:$"
shell_cmd = "vm console 4"

[[shell_check_steps]]
success_regex = ["VM4_VIRTIO_NET_PASS role=server"]

[[shell_check_steps]]
success_regex = ["VM4_VIRTIO_NET_HB_RX.*count=5"]
