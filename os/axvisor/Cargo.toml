[package]
name = "axvisor"
authors = ["Keyang Hu <keyang.hu@qq.com>", "周睿 <zrufo747@outlook.com>"]
edition.workspace = true
version = "0.8.2"
description = "A lightweight type-1 hypervisor based on ArceOS"
repository = "https://github.com/arceos-hypervisor/axvisor"
documentation = "https://docs.rs/axvisor"
keywords = ["hypervisor", "virtualization", "arceos", "type-1"]
categories = ["os", "no-std", "embedded"]
license = "Apache-2.0"
# `tests/` holds helper modules for the explicit `axtest` target below, not
# standalone integration-test targets.
autotests = false
include = [
    ".cargo/config.toml",
    "src/**",
    "build.rs",
    "linker.ld",
    "configs/**",
    "xtask/src/**",
    "README.md",
    "LICENSE*",
]

[[bin]]
name = "axvisor"
path = "src/main.rs"
test = false

[[bin]]
name = "xtask"
path = "xtask/src/main.rs"
test = false
required-features = ["host-xtask"]

[[test]]
name = "axtest"
path = "tests/axtest.rs"
harness = false
required-features = ["axtest"]

[package.metadata.axtest]
runtime = "axvisor"

[package.metadata.docs.rs]
targets = ["aarch64-unknown-none-softfloat"]

[features]
# AxVisor owns the host networking path by default.  The physical uplink is
# capability-selected at runtime; board configurations still choose which
# concrete NIC drivers are compiled into `ax-driver`.
default = ["ax-std/net"]
host-xtask = []
axtest = []
vpci-test-device = ["axvm/vpci-test-device"]
sstc = ["axvm/sstc"]
stack-protector = ["ax-std/stack-protector"]
backtrace = ["ax-std/backtrace"]
test-virq-delivery = []
vcpu-perf-load = []
# Benchmark-local FIFO policy for the vCPU host task. Only the dedicated
# Rust-Shyper task-switch benchmark board build enables it; it selects an
# explicit FIFO policy at VM creation time, and default AxVisor builds keep the
# Fair vCPU host task policy.
bench-fifo-vcpu-policy = []
# axum-based management HTTP server. Pulls `ax-std/net` explicitly so the
# ArceOS network stack (which probes the QEMU virtio-net NIC and backs the
# tokio `TcpListener`) is enabled only when the control plane is built; a
# non-HTTP build must not enable the network subsystem.
http-axum = ["ax-std/net", "dep:axum", "dep:tokio", "dep:serde_json"]
# Board-hosted browser console. It owns only the embedded page, console
# discovery, and WebSocket character streams; the VM management API remains an
# independent opt-in feature.
browser-console = [
  "ax-std/net",
  "axum/ws",
  "dep:axum",
  "dep:futures-util",
  "dep:serde_json",
  "dep:tokio",
]
# Do not auto-boot the default VMs at startup; the HTTP control plane starts
# and stops them on demand (VMs are created and stay in `Ready`).
no-auto-start = []
[dependencies]
anyhow.workspace = true
axvmconfig = { workspace = true, default-features = false }
ax-fs-ng = { workspace = true, features = ["vfs"] }
axfs-ng-vfs.workspace = true
shlex.workspace = true
axtest.workspace = true
heapless.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(axtest)', 'cfg(feature, values("ax-std"))'] }

[target.'cfg(any(not(any(windows, unix)), target_env = "musl"))'.dependencies]
log = "0.4"
axum = { version = "0.8", optional = true }
futures-util = { version = "0.3", optional = true, features = ["sink"] }
serde_json = { version = "1", optional = true }
# The runtime only enables the IO driver (`enable_io()`), so no `time` driver
# and thus no `timerfd` syscall is needed. `rt` + `net` cover the manually
# built current-thread runtime and `TcpListener`.
tokio = { version = "1", optional = true, features = ["net", "rt"] }

# System dependent modules provided by ArceOS.
ax-hal.workspace = true
ax-runtime = { workspace = true, features = ["deferred-rootfs"] }
ax-api.workspace = true
ax-std = { workspace = true, default-features = false, features = [
  "ext4fs",
  "fatfs",
  "alloc",
  "fd",
  "ext-ld",
  "paging",
  "task-ext",
  "smp",
  "hv",
  "tls",
  "std-compat",
] }
# System dependent modules provided by ArceOS-Hypervisor (bare-metal only)
# ax-runtime = { version = "=0.3.0-preview.1", features = ["alloc", "paging", "smp"] }
axvm = { workspace = true, default-features = false, features = ["tls", "host-fs"] }
axvm-types.workspace = true
ax-driver = { workspace = true, optional = true }

[dev-dependencies]
axtest = { path = "../../components/axtest/axtest" }
ax-hal = { path = "../arceos/modules/axhal" }

# xtask dependencies (only used on host platforms)
[target.'cfg(any(windows, all(unix, not(target_env = "musl"))))'.dependencies]
axbuild = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[build-dependencies]
anyhow = { workspace = true, features = ["std"] }
