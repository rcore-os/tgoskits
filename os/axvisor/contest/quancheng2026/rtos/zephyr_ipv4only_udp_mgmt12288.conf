# AxVisor enters the Zephyr guest at EL1 in the Non-secure world.
CONFIG_ARMV8_A_NS=y
CONFIG_DEMAND_PAGING=n

# Use only the virtio-mmio Ethernet device described by the board overlay.
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_VIRTIO_NET=y
CONFIG_VIRTIO_MMIO=y
CONFIG_PCIE=n
CONFIG_ETH_E1000=n
CONFIG_NET_SLIP_TAP=n
CONFIG_SLIP=n
CONFIG_UART_PIPE=n

# Fixed IPv4 address for the private Linux <-> RTOS network.
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.20"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.10"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_NEED_IPV4=y

# Contest communication path is UDP/IPv4; remove IPv6 and TCP paths for the RTOS baseline.
CONFIG_NET_IPV6=n
CONFIG_NET_CONFIG_NEED_IPV6=n
CONFIG_NET_CONFIG_MY_IPV6_ADDR=""
CONFIG_NET_CONFIG_PEER_IPV6_ADDR=""
CONFIG_NET_TCP=n
CONFIG_NET_UDP=y

# Keep kernel shell for serial validation, but remove the heavy net shell command tree.
CONFIG_SHELL=y
CONFIG_NET_SHELL=n

# Keep connection-manager readiness event, but provide a larger event stack after the sentinel evidence.
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=12288

# Keep enough diagnostics to prove device and network readiness.
CONFIG_VIRTIO_LOG_LEVEL_INF=y
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_LOG=y
CONFIG_NET_LOG=y

# Match the original build's minimal heap while avoiding broad POSIX process/runtime accounting.
CONFIG_HEAP_MEM_POOL_SIZE=808
CONFIG_POSIX_API=n
CONFIG_POSIX_MULTI_PROCESS=n
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_SCHED_THREAD_USAGE=n
