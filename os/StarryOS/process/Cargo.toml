[package]
name = "starry-process"
version = "0.4.16"
edition.workspace = true
authors = ["朝倉水希 <asakuramizu111@gmail.com>"]
description = "Process management for Starry OS"
keywords = ["starry-os"]
repository = "https://github.com/Starry-OS/starry-process"
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(axtest)'] }

[dependencies]
ax-runtime.workspace = true
ax-lazyinit = { workspace = true }
weak-map = "0.1"

[dev-dependencies]
ctor = "0.4.1"
ax-runtime = { workspace = true, features = ["host-test", "smp", "lockdep", "multitask"] }
