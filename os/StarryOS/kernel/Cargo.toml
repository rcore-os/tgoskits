[features]
default = ["dynamic_debug"]
dev-log = []
# Lock-free user-copy fast path: probe the HW page table (aarch64 `AT S1E0R/W`)
# so a syscall copy of already-present, EL0-permitted pages skips the aspace lock
# and `populate_area`. Off by default; misses fall to the unchanged locked slow
# path. The probe itself is always compiled (rides ax-cpu `uspace`); this gate
# only enables its use. Only meaningful on aarch64 (other arches stub to false).
user-access-fastpath = []
ext4 = ["ax-fs-ng/ext4"]
fat = ["ax-fs-ng/fat"]
input = ["dep:ax-input", "ax-runtime/input"]
ipi = ["ax-runtime/ipi"]
loongarch64-low-va = []
memtrack = ["axbacktrace/alloc", "ax-alloc/tracking"]
rknpu = ["ax-driver/rknpu"]
jpeg = ["ax-driver/jpeg"]
rga = ["ax-driver/rga", "dep:rockchip-rga"]
rk3588-pwm = [
    "ax-driver/rk3588-pwm",
    "dep:rdif-pwm",
]
k230-kpu = ["ax-hal/xuantie-c9xx", "dep:k230-kpu"]
vsock = ["ax-runtime/vsock"]
dynamic_debug = ["ipi"]
sg2002 = [
    "ax-driver/usb",
    "dep:rdif-pwm",
    "dep:sg2002-tpu",
    "dep:some-serial",
    "dep:sg200x-bsp",
    "dep:tock-registers",
]
sg2002-cvi-usb-camera = [
    "sg2002",
    "dep:cvi-vdec-uapi",
    "dep:sg200x-jpu",
]
smp = ["ax-std/smp"]
stack-guard-page = ["ax-runtime/stack-guard-page"]
stack-protector = ["ax-runtime/stack-protector"]
axtest = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(axtest)', 'cfg(feature, values("ax-std"))'] }

[dependencies]
ax-alloc = { workspace = true }
ax-crate-interface.workspace = true
ax-display.workspace = true
ax-fs-ng = { workspace = true, features = ["vfs"] }
ax-cpu = { workspace = true, features = ["fp-simd"] }
ax-hal = { workspace = true, features = ["fp-simd", "uspace"] }
ax-input = { workspace = true, optional = true }
ax-lazyinit.workspace = true
ax-log.workspace = true
ax-mm = { workspace = true, features = ["copy"] }
ax-net = { workspace = true }
ax-driver = { workspace = true, features = ["usb"] }
axklib.workspace = true
axplat-dyn.workspace = true
ax-runtime = { workspace = true, features = [
    "uspace",
    "rtc",
    "ext4fs",
    "net",
] }
ax-task = { workspace = true, features = [
    "task-ext",
    "tracepoint-hooks",
    "sched-rr",
] }
rockchip-rga = { workspace = true, optional = true }
sg2002-tpu = { workspace = true, optional = true }
k230-kpu = { workspace = true, optional = true }
crab-usb.workspace = true
usb-serial.workspace = true
rdrive.workspace = true

axbacktrace = { workspace = true }
ax-cgroup = { workspace = true }
axfs-ng-vfs = { workspace = true }
rdif-block = { workspace = true }
rdif-pinctrl = { workspace = true, optional = true }
rdif-pwm = { workspace = true, optional = true }
ax-io = { workspace = true }
axhvc = { workspace = true }
axivc = { workspace = true }
axpoll = { workspace = true }
bitflags = "2.10"
bitmaps = { version = "3.2", default-features = false }
bytemuck = { version = "1.23", features = ["unsound_ptr_pod_impl", "derive"] }
cfg-if = "1.0"
chrono = { version = "0.4", default-features = false }
downcast-rs = { version = "2.0", default-features = false, features = ["sync"] }
enum_dispatch = "0.3"
event-listener = { version = "5.4", default-features = false }
extern-trait = { workspace = true }
flatten_objects = "0.2.4"
hashbrown = "0.16"
indoc = "2"
inherit-methods-macro = "0.1.0"
kernel-elf-parser = "0.3.4"
linux-raw-sys = { version = "0.12", default-features = false, features = [
    "no_std",
    "general",
    "net",
    "netlink",
    "prctl",
    "system",
    "ioctl",
    "loop_device",
    "io_uring",
] }
lock_api = { version = "0.4", features = ["arc_lock"] }
ax-memory-addr = { workspace = true }
ax-memory-set = { workspace = true }
num_enum = { version = "0.7", default-features = false }
ouroboros = { version = "0.18", default-features = false }
ax-percpu = { workspace = true }
rand = { version = "0.10", default-features = false, features = ["alloc", "chacha"] }
ringbuf = { version = "0.4.8", default-features = false, features = ["alloc"] }
scope-local = { workspace = true }
slab = { version = "0.4.9", default-features = false }
starry-signal = { workspace = true }
starry-vm = { workspace = true }
strum = { version = "0.28", default-features = false, features = ["derive"] }
syscalls.workspace = true
thiserror.workspace = true
uluru = "3.1.0"
weak-map = "0.1.1"
xmas-elf = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }
ax-ipi = { workspace = true }
static-keys = "0.8"
ddebug = "0.5"
kprobe = { workspace = true }
kmod = { version = "0.3", package = "kmod-tools" }
kmod-loader = "0.3.1"
lwprintf-rs = "0.3"
some-serial = { workspace = true, optional = true }
sg200x-bsp = { workspace = true, optional = true, features = ["c906", "cv182x-host"] }
cvi-vdec-uapi = { workspace = true, optional = true }
dma-api.workspace = true
sg200x-jpu = { workspace = true, optional = true }
# 0.10 to match sg200x-bsp 0.7.x's internal tock-registers; the Writeable trait
# must come from the same version as sg200x-bsp's ReadWrite types.
tock-registers = { version = "0.10", optional = true }
ax-tracepoint.workspace = true
ksym = "0.6"
kbpf-basic = "0.6"
rbpf = { version = "0.4", default-features = false }

[dev-dependencies]
axtest = { path = "../../../components/axtest/axtest" }
ax-std = { path = "../../arceos/ulib/axstd", default-features = false, features = [
    "alloc",
    "fd",
    "ext-ld",
    "fs",
] }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
ax-runtime = { workspace = true, features = ["host-test", "smp"] }

[[test]]
name = "axtest_kernel"
path = "src/axtest_kernel.rs"
harness = false
required-features = ["axtest", "smp"]

[package.metadata.axtest]
runtime = "starry"

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86 = "0.52"

[target.'cfg(any(target_arch = "riscv32", target_arch = "riscv64"))'.dependencies]
riscv.workspace = true
