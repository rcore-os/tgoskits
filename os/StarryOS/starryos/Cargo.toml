[package]
authors = [
  "Azure-stars <Azure_stars@126.com>",
  "Yuekai Jia <equation618@gmail.com>",
  "KylinSoft Co., Ltd. <https://www.kylinos.cn/>",
  "朝倉水希 <asakuramizu111@gmail.com>",
  "Mivik <mivikq@gmail.com>",
]
description = "A Linux-compatible OS kernel built on ArceOS unikernel"
edition.workspace = true
license.workspace = true
name = "starryos"
repository.workspace = true
version = "0.5.38"

[features]
default = []
nixos = []
# The profiling command selects this package-level preset; axbuild must not assemble the
# individual driver feature list at runtime.
qperf = ["ax-driver/nvme", "ax-driver/virtio-net", "ax-driver/virtio-socket"]
qperf-metrics = ["starry-kernel/qperf-metrics"]
lockdep = ["ax-std/lockdep"]

k230 = [
  "starry-kernel/k230-kpu",
  "ax-driver/serial",
  "ax-driver/k230-sdhci",
]

rknpu = ["ax-driver/rknpu", "starry-kernel/rknpu"]
jpeg = ["ax-driver/jpeg", "starry-kernel/jpeg"]
rga = ["ax-driver/rga", "starry-kernel/rga"]
stack-protector = ["ax-std/stack-protector", "starry-kernel/stack-protector"]

[[bin]]
name = "starryos"
path = "src/main.rs"
test = false

[[bin]]
name = "xtask"
path = "xtask/main.rs"
test = false

[dependencies]
# Starry is a freestanding PIE. Keep host `std` compatibility and kernel TLS
# out of the final feature tree.
ax-std = { workspace = true, default-features = false, features = [
  "alloc",
  "fd",
  "ext-ld",
  "fs",
] }
ax-driver.workspace = true
ax-hal = { workspace = true, features = ["smp"] }
ax-runtime = { workspace = true, features = ["ext-ld", "smp"] }
axplat-dyn = { workspace = true, features = ["smp"] }
starry-kernel = { workspace = true, features = ["dev-log", "ext4"] }

[target.'cfg(any(windows, all(unix, not(target_env = "musl"))))'.dependencies]
anyhow = { workspace = true, features = ["std"] }
axbuild = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }

[package.metadata.vendor-filter]
all-features = true
platforms = ["riscv64gc-unknown-none-elf", "loongarch64-unknown-none-softfloat"]
