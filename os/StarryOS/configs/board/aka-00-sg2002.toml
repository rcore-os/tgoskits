# Block storage is unsupported until the CV181x SDHCI driver is migrated to
# the IRQ-driven block runtime.
features = [
  "starry-kernel/sg2002",
  "starry-kernel/sg2002-cvi-usb-camera",
  "axplat-dyn/thead-mae",
  "ax-driver/serial",
  "ax-driver/sg2002-dwc2",
]
log = "Info"
target = "riscv64gc-unknown-none-elf"
