# Build-time config for StarryOS on the JL-LSGD2K10 board.
target = "loongarch64-unknown-none-softfloat"
log = "Info"
# Block storage is unsupported until the LS2K1000 AHCI driver is migrated to
# the IRQ-driven block runtime.
features = [
  "starry-kernel/loongarch64-low-va",
  "ax-driver/serial",
  "ax-driver/rtc",
  "ax-driver/ls2k1000-gmac",
]
