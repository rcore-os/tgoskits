# Remote Banana Pi BPI-SM10 runtime config. The build config is bananapi-bpi-sm10.toml.
board_type = "BananaPi"
kernel_load_addr = "0x102200000"
fit_load_addr = "0x140000000"
bootm_addr = "0x140000000"
shell_prefix = "root@starry:"
shell_init_cmd = "echo STARRY_BPI_SM10_BOOT_OK"
success_regex = ["(?m)^STARRY_BPI_SM10_BOOT_OK\\s*$"]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)segmentation fault",
  "(?i)SIGSEGV",
  "exit with code: 139",
  "failed to determine root device",
]
timeout = 600
