# Local-only U-Boot serial config for booting StarryOS on Banana Pi BPI-SM10.
# CI uses the `BananaPi` board-server profile instead of this file.
# Build-time settings live in `bananapi-bpi-sm10.toml`.
serial = "/dev/ttyUSB0"
baud_rate = "115200"
dtb_file = "os/StarryOS/configs/board/bananapi-bpi-sm10.dtb"

kernel_load_addr = "0x102200000"
fit_load_addr = "0x140000000"
bootm_addr = "0x140000000"

fail_regex = [
  "panicked at",
  "failed to determine root device",
  "NoSerialDevice",
  "/dev/console has no serial TTY binding",
]
shell_prefix = "root@starry:"
shell_init_cmd = "echo STARRY_BPI_SM10_UBOOT_OK"
success_regex = ["(?m)^STARRY_BPI_SM10_UBOOT_OK\\s*$"]
timeout = 600
