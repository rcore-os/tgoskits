[package]
name = "ax-hal"
version = "0.8.0"
repository = "https://github.com/rcore-os/tgoskits"
edition.workspace = true
authors = ["Yuekai Jia <equation618@gmail.com>"]
description = "ArceOS hardware abstraction layer, provides unified APIs for platform-specific operations"
license.workspace = true

[features]
smp = [
    "axplat-dyn/smp",
    "ax-plat/smp",
]
fp-simd = [
    "ax-cpu/fp-simd",
    "axplat-dyn/fp-simd",
]
riscv-thead-mae = ["ax-cpu/riscv-thead-mae"]
rtc = ["axplat-dyn/rtc"]
paging = [
    "dep:ax-alloc",
    "dep:page-table-generic",
]
# Request kernel TLS; `uspace` takes precedence and disables kernel TLS.
tls = ["ax-cpu/tls", "cpu-local/tls", "axplat-dyn/tls"]
# Enable userspace support without kernel TLS, including when `tls` is enabled.
# User-space TLS remains available through the userspace context APIs.
uspace = ["paging", "ax-cpu/uspace", "cpu-local/uspace", "axplat-dyn/uspace"]
hv = [
  "paging",
  "fp-simd",
  "ax-cpu/virtualization",
  "axplat-dyn/hv",
]
host-test = [
    "cpu-local/host-test",
    "ax-percpu/host-test",
    "ax-sync/host-test",
]
pmu = ["ax-cpu/pmu"]
default = []
ipi = []

[dependencies]
axbacktrace.workspace = true
ax-alloc = { workspace = true, optional = true }
ax-cpu = { workspace = true, features = ["context"] }
cpu-local.workspace = true
ax-plat.workspace = true
ax-lazyinit.workspace = true
cfg-if.workspace = true
fdt-parser = "0.4"
heapless = "0.9"
ax-sync.workspace = true
log.workspace = true
ax-memory-addr.workspace = true
ax-percpu.workspace = true
axplat-dyn = { workspace = true, default-features = false }
page-table-generic = { workspace = true, optional = true }
rdrive.workspace = true
thiserror.workspace = true

[build-dependencies]
quote = { workspace = true }
