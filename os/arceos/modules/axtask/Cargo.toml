[package]
authors = ["Yuekai Jia <equation618@gmail.com>"]
description = "ArceOS task management module"
edition.workspace = true
license.workspace = true
name = "ax-task"
repository = "https://github.com/rcore-os/tgoskits"
version = "0.6.11"

[package.metadata.docs.rs]
targets = [
  "x86_64-unknown-none",
  "aarch64-unknown-none-softfloat",
  "riscv64gc-unknown-none-elf",
  "loongarch64-unknown-none-softfloat",
]

[features]
default = []

ipi = ["ax-hal/ipi", "dep:ax-ipi"]
preempt = []
smp = []
vmap-task-stack = ["dep:ax-mm", "ax-hal/paging"]
stack-guard-page = ["vmap-task-stack"]
lockdep = ["dep:axpanic"]
lock-api = ["dep:lock_api"]
task-ext = ["dep:extern-trait"]
tls = ["ax-hal/tls"]
# Cross-crate tracepoint hook for the scheduler context switch.
# Enabling this exposes a `SchedTracepoint` interface (via `ax-crate-interface`)
# that another crate (e.g. starry-kernel) must implement; otherwise the link
# step will fail with an unresolved symbol. Pure ArceOS unikernels leave this
# off and pay no cost.
tracepoint-hooks = []
uspace = ["ax-hal/uspace"]

sched-cfs = ["preempt"]
sched-rr = ["preempt"]

host-test = [
  "ax-hal/host-test",
  "ax-percpu/host-test",
]
test = ["host-test"]

[dependencies]
ax-alloc.workspace = true
ax-cpumask.workspace = true
ax-crate-interface.workspace = true
ax-hal.workspace = true
ax-ipi = {workspace = true, optional = true}
ax-lazyinit.workspace = true
ax-memory-addr.workspace = true
ax-mm = {workspace = true, optional = true}
ax-percpu.workspace = true
axpanic = {workspace = true, optional = true}
ax-sched.workspace = true
ax-timer-list.workspace = true
axpoll.workspace = true
cfg-if.workspace = true
extern-trait = { workspace = true, optional = true }
event-listener.workspace = true
futures-util = {version = "0.3", default-features = false, features = [
  "alloc",
  "async-await-macro",
]}
thiserror.workspace = true
log.workspace = true
lock_api = {workspace = true, optional = true}

[target.'cfg(target_arch = "riscv64")'.dependencies]
sbi-rt = { workspace = true, features = ["legacy"] }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
ax-hal = { path = "../axhal", features = ["fp-simd"] }

[build-dependencies]
quote = { workspace = true }
