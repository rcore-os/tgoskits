[package]
name = "ax-sync"
version = "0.5.31"
repository = "https://github.com/rcore-os/tgoskits"
edition.workspace = true
authors = ["Yuekai Jia <equation618@gmail.com>"]
description = "ArceOS synchronization primitives"
license.workspace = true

[features]
host-test = []
sleep = []
lock-api = ["dep:lock_api"]
default = []

[dependencies]
ax-crate-interface.workspace = true
lock_api = { workspace = true, optional = true }

[dev-dependencies]
# Host tests must link the external lock provider; this crate deliberately
# contains no in-crate host lock engine (see tests/thin_wrapper_contract.rs).
ax-runtime = { path = "../axruntime", features = ["host-test"] }

[[test]]
name = "std"
path = "tests/std.rs"
required-features = ["host-test"]
