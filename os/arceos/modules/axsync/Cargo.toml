[package]
name = "ax-sync"
version = "0.5.30"
repository = "https://github.com/rcore-os/tgoskits"
edition.workspace = true
authors = ["Yuekai Jia <equation618@gmail.com>"]
description = "ArceOS synchronization primitives"
license.workspace = true

[features]
multitask = ["dep:ax-task", "ax-kernel-guard/preempt"]
lockdep = [
  "multitask",
  "ax-kspin/lockdep",
  "dep:ax-lockdep",
  "ax-lockdep/task-context",
]
default = []

[dependencies]
ax-kernel-guard.workspace = true
ax-lockdep = { workspace = true, optional = true }
ax-task = { workspace = true, optional = true }
ax-kspin.workspace = true
lock_api.workspace = true

[dev-dependencies]
ax-crate-interface.workspace = true
ax-kspin = { workspace = true, features = ["host-test"] }
loom.workspace = true
