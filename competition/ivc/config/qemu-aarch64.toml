args = [
  "-nographic",
  "-accel",
  "tcg,thread=multi",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-device",
  "virtio-blk-device,drive=disk0",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/tmp/competition/ivc/linux/rootfs.img",
  "-append",
  "root=/dev/vda ro init=/bin/sh",
  "-net",
  "none",
  "-m",
  "8g",
]
fail_regex = [
  "IVC-LINUX-FATAL",
  "IVC-LINUX-DONE exit=[1-9]",
  "IVC-RTOS-FATAL",
  "(?m)^IVC-CONTROLLER-RESULT .*errors=[1-9][0-9]*",
  "panicked at",
]
success_regex = [
  "(?m)^IVC-LINUX-DONE exit=0\\r?$",
]
timeout = 300
to_bin = true
uefi = false
