board_type = "OrangePi-5-Plus"
shell_prefix = "AXVISOR_SHELL_READY"
shell_init_cmd = "ss 1 0 /home/orangepi/rknpu-result.img"
success_regex = [
  "(?m)^AXVISOR_HOST_FILESYSTEM_SYNCED\\r?$",
]
fail_regex = [
  "(?m)^.*THERMAL_RKNN_STARRY_FAIL.*$",
  "(?m)^.*AXVISOR_HOST_FILESYSTEM_SYNC_FAILED:.*$",
  "(?m)^.*AXVISOR_VM_BLOCK_SNAPSHOT_FAILED:.*$",
  "(?m)^.*Failed to initialize guest VM.*$",
  "(?m)^.*VM\\[[0-9]+\\] run VCpu\\[[0-9]+\\] get error .*$",
  "(?m)^.*Unhandled synchronous exception from current EL:.*$",
  "(?mi)^.*panicked at.*$",
]
timeout = 600
