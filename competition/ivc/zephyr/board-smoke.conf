# Finite profile for an automated physical-board smoke run. PSCI SYSTEM_OFF
# returns control to AxVisor after the controller receives all responses.
CONFIG_PM_CPU_OPS=y
CONFIG_POWEROFF=y
CONFIG_IVC_EXPECTED_COMMANDS=20
CONFIG_IVC_EXIT_AFTER_EXPECTED_COMMANDS=y
