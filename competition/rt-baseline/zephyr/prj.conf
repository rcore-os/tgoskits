CONFIG_PRINTK=y
CONFIG_LOG=n
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_THREAD_NAME=y

# Match the RTOS guest's non-secure AArch64 execution mode while running
# directly on QEMU's virt machine.
CONFIG_ARMV8_A_NS=y
CONFIG_SMP=n

# One kernel tick is exactly the requested 1 ms period. Disable the board's
# instruction-count virtual clock so the result observes normal QEMU timer and
# host scheduling behavior, as the AxVisor QEMU case does.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_TIMEOUT_64BIT=y
CONFIG_QEMU_ICOUNT=n

# Report measured CPU ownership instead of inferring stress from configuration.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
CONFIG_SCHED_THREAD_USAGE_AUTO_ENABLE=y

# Let the finite benchmark terminate QEMU through PSCI SYSTEM_OFF.
CONFIG_PM_CPU_OPS=y
CONFIG_POWEROFF=y

# The validated Linux-target AArch64 compiler otherwise outlines atomics to a
# userspace libgcc helper that is unavailable to this freestanding image.
CONFIG_COMPILER_OPT="-mno-outline-atomics"
